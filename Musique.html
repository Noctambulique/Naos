<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Lecteur minimaliste</title>
  <style>
    body{margin:0;padding:0;background:#f5eee6;font-family:Georgia,serif;display:flex;justify-content:center;align-items:center;height:100vh;color:#3b2f2f}
    .wrap{background:#fff7f0;padding:30px;border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,0.15);width:90%;max-width:420px;text-align:center}
    h1{font-size:22px;margin:0 0 10px 0}
    p{font-size:13px;margin:0 0 20px 0;color:#8a7b74}
  </style>
</head>
<body>
  <div class="wrap">
    <h1 id="title">—</h1>
    <p id="artist">—</p>
  </div>

  <audio id="audio"></audio>

  <script>
    /* --------------------------------------------------
       AJOUTE SIMPLEMENT TES MORCEAUX ICI
       
       Tu peux ajouter :
       { title:"Nom", artist:"Artiste", url:"lien" }
       OU juste :
       "lien.mp3"
    -------------------------------------------------- */
    const tracks = [
    { title:"C'est ainsi", artist:"Euphonik", url:"https://www.dropbox.com/scl/fi/kf50hho9yzed1revmvbic/C-est-ainsi-Euphonik.mp3?dl=1" },
    ];
    /* -------------------------------------------------- */

    let index = 0;

    const audio = document.getElementById('audio');
    const title = document.getElementById('title');
    const artist = document.getElementById('artist');

    function normalize(track){
      if(typeof track === "string"){
        const filename = track.split('/').pop().split('?')[0];
        return {
          url: track.replace("?dl=0","?dl=1"),
          title: filename.replace(/\.(mp3|ogg|wav|m4a)$/i,""),
          artist: "Audio"
        };
      }
      return {
        url: track.url.replace("?dl=0","?dl=1"),
        title: track.title || "Sans titre",
        artist: track.artist || "—"
      };
    }

    function load(i){
      if(!tracks.length) return;
      index = (i + tracks.length) % tracks.length;

      const t = normalize(tracks[index]);
      audio.src = t.url;
      title.textContent = t.title;
      artist.textContent = t.artist;
    }

    audio.addEventListener('ended', ()=>{
      load(index+1);
      audio.play();
    });

    if(tracks.length){
      load(0);
      audio.volume = 0.9;
      audio.play();
    }
  </script>
</body>
</html>
