<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Lecteur Vintage</title>

<style>
  body{
    margin:0;padding:40px;
    background:#f5eee6;
    font-family:Georgia,serif;
    color:#3b2f2f;
  }

  /* Cadre principal */
  .wrap{
    background:#fff7f0;
    padding:30px;
    border-radius:12px;
    box-shadow:0 6px 20px rgba(0,0,0,0.15);
    width:100%;
    max-width:420px;
    margin:auto;
    text-align:center;
  }

  h1{font-size:22px;margin:0 0 5px 0}
  p{font-size:13px;margin:0 0 20px 0;color:#8a7b74}

  /* Playlist */
  .playlist{
    max-width:420px;
    margin:20px auto 0 auto;
    background:#fff7f0;
    border-radius:10px;
    padding:10px 0;
    box-shadow:0 4px 14px rgba(0,0,0,0.1);
  }

  .track{
    padding:10px 15px;
    border-bottom:1px solid #e6d8cc;
    cursor:pointer;
    transition:0.2s;
  }
  .track:last-child{border-bottom:none;}
  .track:hover{
    background:#f0e4d9;
  }
  .active{
    background:#e9ddcf;
    font-weight:bold;
  }

  /* Bouton Play/Pause extérieur */
  #playPause{
    position:fixed;
    right:30px;
    bottom:30px;
    background:#3b2f2f;
    color:white;
    border:none;
    padding:15px 20px;
    font-size:18px;
    border-radius:50px;
    cursor:pointer;
    box-shadow:0 5px 15px rgba(0,0,0,0.25);
  }
</style>
</head>

<body>

<div class="wrap">
  <h1 id="title">Titre</h1>
  <p id="artist">Artiste</p>
</div>

<!-- Playlist -->
<div class="playlist" id="playlist"></div>

<!-- Audio natif -->
<audio id="audio"></audio>

<!-- Bouton -->
<button id="playPause">⏸️</button>

<script>
/* -------------------- LISTE DES MUSIQUES -------------------- */
/* Tu peux en ajouter autant que tu veux */
const tracks = [
{ title:"C'est ainsi", artist:"Euphonik", url:"https://www.dropbox.com/scl/fi/kf50hho9yzed1revmvbic/C-est-ainsi-Euphonik.mp3?dl=1" },
{ title:"L'erreur 404", artist:"L'Imperatrice", url:"https://www.dropbox.com/scl/fi/lmxrwkk2fln57eeg2lxck/Erreur-404-L-Imp-ratrice.mp3?dl=1" },
{ title:"A l'heure où je me couche", artist:"Orelsan", url:"https://www.dropbox.com/scl/fi/dl22b20p51dayvqe9q4i5/l-heure-o-je-me-couche-Casseurs-Flowters.mp3?dl=1" },
];

/* -------------------- VARIABLES -------------------- */
let index = 0;
const audio = document.getElementById("audio");
const title = document.getElementById("title");
const artist = document.getElementById("artist");
const playlist = document.getElementById("playlist");
const btn = document.getElementById("playPause");

/* -------------------- AFFICHAGE PLAYLIST -------------------- */
function buildPlaylist(){
  playlist.innerHTML = "";
  tracks.forEach((t, i)=>{
    const div = document.createElement("div");
    div.className = "track" + (i===index ? " active" : "");
    div.textContent = t.title;
    div.onclick = ()=>{ load(i); audio.play(); };
    playlist.appendChild(div);
  });
}

/* -------------------- CHARGEMENT PISTE -------------------- */
function load(i){
  index = (i + tracks.length) % tracks.length;
  const t = tracks[index];
  audio.src = t.url;
  title.textContent = t.title;
  artist.textContent = t.artist;
  buildPlaylist();
}

/* -------------------- LECTURE AUTOMATIQUE -------------------- */
audio.addEventListener("ended", ()=>{
  load(index+1);
  audio.play();
});

/* -------------------- BOUTON PLAY/PAUSE -------------------- */
btn.onclick = ()=>{
  if(audio.paused){
    audio.play();
    btn.textContent = "⏸️";
  } else {
    audio.pause();
    btn.textContent = "▶️";
  }
};

/* -------------------- INIT -------------------- */
if(tracks.length){
  load(0);
  audio.volume = 0.9;
}
</script>

</body>
</html>
