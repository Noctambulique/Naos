      align-items:center;
      background:#e7dfd3;
      font-family:"Georgia",serif;
      color:#3a2f2a;
    }

    /* Cadre vintage */
    .wrap{
      background:#f8f1e7;
      border:2px solid #c7b7a3;
      border-radius:14px;
      padding:30px;
      width:90%;
      max-width:420px;
      text-align:center;
      box-shadow:0 4px 14px rgba(0,0,0,0.18);
    }

    h1{
      margin:0;
      font-size:22px;
      letter-spacing:0.5px;
    }

    p{
      margin:6px 0 0 0;
      font-size:13px;
      color:#7c6c63;
    }

    /* Bouton isolé sous le cadre */
    .controls{
      margin-top:18px;
    }

    .btn{
      padding:10px 22px;
      background:#d8c4b5;
      border:1px solid #b8a293;
      border-radius:8px;
      cursor:pointer;
      font-size:15px;
      font-family:inherit;
      transition:0.2s;
      box-shadow: inset 0 0 6px rgba(0,0,0,0.15);
    }

    .btn:hover{
      background:#ccb5a5;
    }

    /* -------------------------------------------------- */

    const audio = document.getElementById("audio");
    const title = document.getElementById("title");
    const artist = document.getElementById("artist");
    const toggleBtn = document.getElementById("toggle");

    let index = 0;

    function norm(t){
      if(typeof t === "string"){
        const file = t.split("/").pop().split("?")[0];
        return {
          url: t.replace("?dl=0","?dl=1"),
          title: file.replace(/\.(mp3|wav|ogg|m4a)$/i,""),
          artist: "Audio"
        };
      }
      return {
        url: t.url.replace("?dl=0","?dl=1"),
        title: t.title || "Sans titre",
        artist: t.artist || "—"
      };
    }

    function load(i){
      if(!tracks.length) return;
      index = (i + tracks.length) % tracks.length;
      const t = norm(tracks[index]);
      audio.src = t.url;
      title.textContent = t.title;
      artist.textContent = t.artist;
    }

    audio.addEventListener("ended", ()=>{
      load(index+1);
      audio.play();
      toggleBtn.textContent = "⏸ Pause";
    });

    toggleBtn.addEventListener("click", ()=>{
      if(audio.paused){
        audio.play();
        toggleBtn.textContent = "⏸ Pause";
      } else {
        audio.pause();
        toggleBtn.textContent = "⏵ Lire";
      }
    });

    if(tracks.length){
      load(0);
      audio.volume = 0.9;
    }
