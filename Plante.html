<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Grille de mots</title>
  <style>
    :root{--cols:2}
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;font-family:"Georgia",serif;background:#fff;color:#111;display:flex;align-items:center;justify-content:center;transition:opacity .5s ease}
    body.fade{opacity:0}
    main{width:100%;padding:5vh 5vw;transition:opacity .5s ease}
    .grid{display:grid;grid-template-columns:repeat(var(--cols),1fr);gap:20px;text-align:center}
    .word{background:transparent;border:0;padding:20px;cursor:pointer;outline:none;font-size:1.2rem;transition:opacity .35s,transform .25s}
    .word:active{transform:scale(.97)}
    .word.fade{opacity:.4}
    #detail{display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:5vh 10vw;animation:fadeIn .6s ease}
    #detail img{max-width:100%;max-height:60vh;object-fit:contain;border-radius:6px;margin:20px 0}
    #detail p{font-size:1.05rem;line-height:1.5}
    #retour{margin-top:20px;padding:8px 14px;border:0;background:#eee;border-radius:6px;cursor:pointer;font-family:inherit;font-size:1rem}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  </style>
</head>
<body>
  <main id="main">
    <div id="grid" class="grid" style="--cols:2"></div>
  </main>

  <section id="detail">
    <img id="imageDetail" src="" alt="" />
    <p id="texteDetail"></p>
    <button id="retour">Retour</button>
  </section>

  <script>
    const grid = document.getElementById('grid');
    const main = document.getElementById('main');
    const detail = document.getElementById('detail');
    const imgDetail = document.getElementById('imageDetail');
    const texteDetail = document.getElementById('texteDetail');
    const retour = document.getElementById('retour');

    const mots = [
      { mot: 'Basilic Eternel', texte: 'Basilic Eternel', image: 'plante/Basilic.jpg' },
      { mot: 'Ciboulette', texte: 'Ciboulette', image: 'plante/Ciboulette.jpg' },
      { mot: 'Salvina', texte: 'Salvina', image: 'plante/Salvina.jpg' },
      { mot: 'Trèfle Pourpre', texte: 'Trèfle Pourpre', image: 'plante/Trèfle Pourpre.jpg' }
    ];

    function genererMots() {
      grid.innerHTML = '';
      mots.forEach(item => {
        const btn = document.createElement('button');
        btn.className = 'word';
        btn.textContent = item.mot;
        btn.dataset.text = item.texte;
        btn.dataset.image = item.image;
        grid.appendChild(btn);
      });
    }
    genererMots();

    grid.addEventListener('click', e => {
      const btn = e.target.closest('.word');
      if (!btn) return;

      btn.classList.add('fade');
      setTimeout(() => btn.classList.remove('fade'), 380);

      const text = btn.dataset.text || '';
      const image = btn.dataset.image || '';

      main.style.opacity = 0;
      setTimeout(() => {
        main.style.display = 'none';
        texteDetail.textContent = text;
        if (image) {
          imgDetail.src = image;
          imgDetail.style.display = 'block';
        } else {
          imgDetail.style.display = 'none';
        }
        detail.style.display = 'flex';
      }, 400);
    });

    retour.addEventListener('click', () => {
      detail.style.display = 'none';
      main.style.display = 'block';
      setTimeout(() => {
        main.style.opacity = 1;
      }, 100);
    });
  </script>
</body>
</html>
