<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Galerie pleine largeur</title>
  <style>
    :root {
      --gap: 0.75rem;
      --max-image-height: 80vh;
      --page-bg: #000;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--page-bg);
      overflow-x: hidden;
    }

    .gallery {
      display: grid;
      gap: var(--gap);
    }

    figure {
      margin: 0;
      width: 100vw;
      transform: translateX(calc((100% - 100vw) / 2));
    }

    img {
      display: block;
      width: 100vw;
      height: auto;
      max-height: var(--max-image-height);
      object-fit: cover;
      object-position: center;
    }
  </style>
</head>
<body>
  <main class="gallery">
    <figure>
      <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=1920&q=80" alt="Image 1" loading="lazy">
    </figure>
    <figure>
      <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1920&q=80" alt="Image 2" loading="lazy">
    </figure>
    <figure>
      <img src="https://images.unsplash.com/photo-1491553895911-0055eca6402d?auto=format&fit=crop&w=1920&q=80" alt="Image 3" loading="lazy">
    </figure>
  </main>
</body>
</html>
