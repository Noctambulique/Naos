<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Mini Jardin Auto</title>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: #f0f6f0;
      color: #234;
    }
    select {
      margin: 10px;
      padding: 8px 12px;
      border-radius: 8px;
      border: none;
      font-size: 1em;
    }
    #pot {
      width: 200px;
      height: 200px;
      background: #cfe5cf;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 20px;
      position: relative;
    }
    img {
      width: 100px;
      transition: all 1s ease;
      opacity: 0;
    }
    #progress {
      width: 200px;
      height: 10px;
      background: #d9e9d9;
      border-radius: 10px;
      overflow: hidden;
    }
    #bar {
      width: 0%;
      height: 100%;
      background: #2b9348;
      transition: width 0.2s linear;
    }
  </style>
</head>
<body>
  <h2>Mini Jardin Auto</h2>
  <select id="seedSelect"></select>
  <div id="pot">
    <img id="plantImg" src="" alt="plant" />
  </div>
  <div id="progress"><div id="bar"></div></div>
  <p id="timer">--:--</p>

  <script>
    // 🪴 Personnalisez ici vos plantes :
    // Ajoutez, supprimez ou modifiez simplement les objets ci-dessous.
    // Vous pouvez fournir une image personnalisée (chemin ou URL), sinon une version SVG simplifiée sera utilisée.
    const PLANTS = [
      {name: 'Tournesol', growTime: 15, color: '#f5c22b', image: ''},
      {name: 'Herbe', growTime: 10, color: '#6cbf6c', image: ''},
      {name: 'Tomate', growTime: 20, color: '#d84d4d', image: ''}
    ];

    const seedSelect = document.getElementById('seedSelect');
    const plantImg = document.getElementById('plantImg');
    const bar = document.getElementById('bar');
    const timerEl = document.getElementById('timer');

    PLANTS.forEach((p, i) => {
      const opt = document.createElement('option');
      opt.value = i;
      opt.textContent = p.name;
      seedSelect.appendChild(opt);
    });

    let timer = null;

    seedSelect.addEventListener('change', (e) => {
      const plant = PLANTS[e.target.value];
      startGrowth(plant);
    });

    function startGrowth(plant) {
      clearInterval(timer);
      bar.style.width = '0%';
      plantImg.style.opacity = 0;
      plantImg.src = plant.image || makeSeed(plant.color);
      const total = plant.growTime;
      let elapsed = 0;

      setTimeout(() => plantImg.style.opacity = 1, 200);

      timer = setInterval(() => {
        elapsed += 0.2;
        const pct = Math.min(1, elapsed / total);
        bar.style.width = pct * 100 + '%';
        timerEl.textContent = formatTime(total - elapsed);

        if (pct > 0.5 && pct < 1) plantImg.src = plant.image || makeGrowing(plant.color);
        if (pct >= 1) {
          clearInterval(timer);
          plantImg.src = plant.image || makeFinal(plant.color);
          timerEl.textContent = '00:00';
        }
      }, 200);
    }

    function makeSeed(c) {
      return `data:image/svg+xml;utf8,${encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><ellipse cx='50' cy='60' rx='10' ry='6' fill='${c}' /></svg>`)}`;
    }
    function makeGrowing(c) {
      return `data:image/svg+xml;utf8,${encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='48' y='40' width='4' height='30' fill='${c}' /><circle cx='50' cy='35' r='10' fill='${c}' /></svg>`)}`;
    }
    function makeFinal(c) {
      return `data:image/svg+xml;utf8,${encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M50 70 L50 40 Q60 30 70 40 Q60 20 50 30 Q40 20 30 40 Q40 30 50 40 Z' fill='${c}' /></svg>`)}`;
    }

    function formatTime(sec) {
      sec = Math.max(0, sec);
      const m = Math.floor(sec / 60).toString().padStart(2, '0');
      const s = Math.floor(sec % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    // Lance automatiquement la première plante par défaut
    startGrowth(PLANTS[0]);
  </script>
</body>
</html>
