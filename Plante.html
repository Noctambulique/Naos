<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Grille de mots</title>
  <style>
    :root{--cols:2}
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;font-family:"Georgia",serif;background:#fff;color:#111;display:flex;align-items:center;justify-content:center}
    main{width:100%;padding:5vh 5vw}
    .grid{display:grid;grid-template-columns:repeat(var(--cols),1fr);gap:20px;text-align:center}
    .word{background:transparent;border:0;padding:20px;cursor:pointer;outline:none;font-size:1.2rem;transition:opacity .35s,transform .25s}
    .word:active{transform:scale(.97)}
    .word.fade{opacity:.4}
    .overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,0.6);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .25s}
    .overlay.show{opacity:1;pointer-events:auto}
    .card{max-width:92vw;max-height:86vh;background:#fff;padding:18px;border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.25);overflow:auto;display:flex;flex-direction:column;gap:12px;text-align:center}
    .card img{max-width:100%;max-height:60vh;object-fit:contain;border-radius:6px;margin:auto}
    .card .text{white-space:pre-wrap;font-size:1rem;color:#111}
    .close{align-self:center;background:#eee;border:0;padding:6px 10px;border-radius:6px;cursor:pointer}
  </style>
</head>
<body>
  <main>
    <div id="grid" class="grid" style="--cols:2"></div>
  </main>

  <div id="overlay" class="overlay" aria-hidden="true">
    <div class="card" role="dialog" aria-modal="true">
      <button id="close" class="close">Fermer</button>
      <div id="media"></div>
      <div id="desc" class="text"></div>
    </div>
  </div>

  <script>
    const grid = document.getElementById('grid');
    const overlay = document.getElementById('overlay');
    const media = document.getElementById('media');
    const desc = document.getElementById('desc');
    const close = document.getElementById('close');

    const mots = [
      { mot: 'mot', texte: 'Texte pour le mot', image: '' },
      { mot: 'autre', texte: 'Description du second mot', image: '' },
      { mot: 'image', texte: 'Un mot qui mène à une image', image: 'https://picsum.photos/800/500?random=1' },
      { mot: 'clique', texte: 'Message personnalisé', image: '' },
      { mot: 'photo', texte: 'Un mot de démonstration', image: 'https://picsum.photos/800/600?random=2' }
    ];

    function genererMots() {
      grid.innerHTML = '';
      mots.forEach(item => {
        const btn = document.createElement('button');
        btn.className = 'word';
        btn.textContent = item.mot;
        btn.dataset.text = item.texte;
        btn.dataset.image = item.image;
        grid.appendChild(btn);
      });
    }
    genererMots();

    grid.addEventListener('click', e => {
      const btn = e.target.closest('.word');
      if (!btn) return;

      btn.classList.add('fade');
      setTimeout(() => btn.classList.remove('fade'), 380);

      const text = btn.dataset.text || '';
      const image = btn.dataset.image || '';

      if ((e.ctrlKey || e.metaKey) && image) {
        window.open(image, '_blank');
        return;
      }

      media.innerHTML = '';
      desc.textContent = text;

      if (image) {
        const img = document.createElement('img');
        img.src = image;
        img.alt = text || btn.textContent || '';
        media.appendChild(img);
      }

      overlay.classList.add('show');
      overlay.setAttribute('aria-hidden', 'false');
    });

    close.addEventListener('click', () => {
      overlay.classList.remove('show');
      overlay.setAttribute('aria-hidden', 'true');
    });

    overlay.addEventListener('click', e => {
      if (e.target === overlay) {
        overlay.classList.remove('show');
        overlay.setAttribute('aria-hidden', 'true');
      }
    });

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') overlay.classList.remove('show');
    });
  </script>
</body>
</html>
