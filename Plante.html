<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Jardin de Basile</title>

  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital@0;1&family=Merriweather:wght@300;400&display=swap" rel="stylesheet">

  <style>
    :root{--cols:2}

    *{box-sizing:border-box;margin:0;padding:0}

    html,body{
      height:100%;
      font-family:"Merriweather","EB Garamond",serif;
      background:#fff;
      color:#111;
      display:flex;
      align-items:center;
      justify-content:center;
      transition:opacity 1s ease;
      letter-spacing:0.4px;
    }

    #banniere{
      width:100%;
      max-height:25vh;
      object-fit:cover;
      margin-bottom:2vh;
      border-radius:6px;
    }

    main{
      width:100%;
      padding:4vh 6vw;
      text-align:center;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(var(--cols),1fr);
      gap:15px;
    }

    .word{
      background:transparent;
      border:0;
      padding:10px; /* ENCORE RÉDUIT */
      cursor:pointer;
      font-size:1.5rem;
      font-family:"EB Garamond",serif;
      transition:opacity .3s,transform .25s;
      letter-spacing:0.6px;
    }

    #detail{
      display:none;
      flex-direction:column;
      align-items:center;
      padding:5vh 8vw;
      text-align:center;
    }

    #detail img{
      max-width:100%;
      max-height:50vh; /* IMAGE RÉDUITE */
      object-fit:contain;
      border-radius:6px;
      margin:20px 0 35px 0;
    }

    #detail p{
      font-size:1.35rem;
      line-height:1.65;
      font-family:"EB Garamond",serif;
      letter-spacing:0.4px;
    }

    #retour{
      position:absolute;
      top:20px;
      left:20px;
      background:transparent;
      border:none;
      font-size:1.3rem;
      cursor:pointer;
      color:#111;
      display:flex;
      align-items:center;
      gap:6px;
    }
    #retour::before{
      content:"←";
    }
  </style>
</head>

<body>
  <main id="main">
    <img id="banniere" src="D hiver/Jardin de Basile.png" alt="bannière" />
    <div id="grid" class="grid" style="--cols:2"></div>
  </main>

  <section id="detail">
    <button id="retour">Retour</button>
    <img id="imageDetail" src="" alt="" />
    <p id="texteDetail"></p>
  </section>

  <script>
    const grid = document.getElementById('grid');
    const main = document.getElementById('main');
    const detail = document.getElementById('detail');
    const imgDetail = document.getElementById('imageDetail');
    const texteDetail = document.getElementById('texteDetail');
    const retour = document.getElementById('retour');

    const mots = [
      { mot: 'Basilic Eternel', texte: 'Basilic Eternel', image: 'plante/Basilic.JPG' },
      { mot: 'Ciboulette', texte: 'Ciboulette', image: 'plante/Ciboulette.JPG' },
      { mot: 'Salvina', texte: 'Salvina', image: 'plante/Salvina.JPG' },
      { mot: 'Trèfle Pourpre', texte: 'Trèfle Pourpre', image: 'plante/Trèfle Pourpre.JPG' },
      { mot: 'Poireau', texte: 'Poireau', image: 'plante/Poireau.JPG' },
      { mot: 'Avocat', texte: 'Avocat', image: 'D hiver/Screenshot_20240909_015144_Photos.jpg' },
      { mot: 'Oignon', texte: 'Oignon', image: 'D hiver/Screenshot_20240909_015011_Photos.jpg' }
    ];

    function genererMots() {
      grid.innerHTML = '';
      mots.forEach(item => {
        const btn = document.createElement('button');
        btn.className = 'word';
        btn.textContent = item.mot;
        btn.dataset.text = item.texte;
        btn.dataset.image = item.image;
        grid.appendChild(btn);
      });
    }
    genererMots();

    grid.addEventListener('click', e => {
      const btn = e.target.closest('.word');
      if (!btn) return;

      main.style.opacity = 0;

      setTimeout(() => {
        main.style.display = 'none';
        texteDetail.textContent = btn.dataset.text;
        imgDetail.src = btn.dataset.image;
        detail.style.display = 'flex';
      }, 380);
    });

    retour.addEventListener('click', () => {
      detail.style.display = 'none';
      main.style.display = 'block';
      setTimeout(() => { main.style.opacity = 1; }, 100);
    });
  </script>
</body>
</html>
