  <meta charset="UTF-8" />

  <title>Carte Personnalisable</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #f0f0f0;
      font-family: Arial, sans-serif;
    }

    /* Conteneur défilant */
    #mapContainer {
      width: 85vw;
      height: 85vh;
      overflow: auto;
      border: 2px solid #aaa;
      background-color: #fff;
      padding: 10px;
      box-sizing: border-box;
    }

    #map {
      display: grid;
      grid-template-columns: repeat(8, 100px);
      gap: 2px;
      justify-content: center;
    }

    .cell {
      width: 100px;
      height: 50px;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #bebff1;

      border: 1px solid #ccc;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    .cell:hover {
      background-color: #e0e0e0;
    }
    #infoBox {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 10px;
      background-color: #ffffff;
      border: 1px solid #ccc;
      display: none;
      max-width: 200px;
    }
  </style>
</head>
