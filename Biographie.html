<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carte Personnalisable</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #f0f0f0;
      font-family: Arial, sans-serif;
    }
    #map {
      display: grid;
      grid-template-columns: repeat(5, 100px);
      gap: 2px;
    }
    .cell {
      width: 100px;
      height: 50px;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #ffffff;
      border: 1px solid #ccc;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    .cell:hover {
      background-color: #e0e0e0;
    }
    #infoBox {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 10px;
      background-color: #ffffff;
      border: 1px solid #ccc;
      display: none;
      max-width: 200px;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="infoBox"></div>

  <script>
    // Configuration des cellules
    const cellsData = [
      { text: "Zone 1 : Information détaillée.", color: "#ffcccc" },
      { text: "Zone 2 : Description unique.", color: "#ccffcc" },
      { text: "Zone 3 : Données utiles.", color: "#ccccff" },
      { text: "Zone 4 : Autre info.", color: "#ffffcc" },
      { text: "Zone 5 : À compléter.", color: "#ffccff" },
      // Ajouter d'autres zones ici
    ];

    const map = document.getElementById("map");
    const infoBox = document.getElementById("infoBox");

    cellsData.forEach((cell, index) => {
      const div = document.createElement("div");
      div.className = "cell";
      div.style.backgroundColor = cell.color;
      div.textContent = `Case ${index + 1}`;
      div.onclick = () => {
        infoBox.textContent = cell.text;
        infoBox.style.display = "block";
      };
      map.appendChild(div);
    });
  </script>
</body>
</html>
