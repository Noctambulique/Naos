<!doctype html>
<meta charset="utf-8">
<style>
body{
  padding:20px;
  font-family:sans-serif;
}

#wrap{
  display:flex;
  gap:12px;
  transition:opacity .4s ease;
}

.r{
  width:320px;
  height:220px;
  background-size:cover;
  background-position:center;
  border-radius:8px;
  cursor:pointer;
}

/* Écran blanc + texte */
#solo{
  position:fixed;
  inset:0;
  background:white;
  display:flex;
  align-items:center;
  justify-content:center;
  opacity:0;
  pointer-events:none;
  transition:opacity .4s ease;
  font-size:2rem;
  text-align:center;
  padding:20px;
}

#solo.show{
  opacity:1;
  pointer-events:auto;
}
</style>

<div id="wrap">
  <div class="r" data-img="D hiver/AERO_IN_20240322161510.png" data-text="Sanctuary on the Moon\n \n C’est une capsule temporelle lunaire : l’idée est de déposer un objet sur la Lune pour “témoigner” de l’humanité, aujourd’hui, pour les générations futures (ou même des civilisations intelligentes). \n \n Le plan : envoyer 24 disques en saphir (diamètre ~10 cm) optiquement gravés, avec des milliards de “pixels” d’informations par disque. Ces disques contiendront du contenu varié : des connaissances en sciences (mathématiques, physique, biologie), des représentations du génome humain, des œuvres culturelles, des images, des textes, de l’art, des diagrammes. \n \n Le saphir est choisi parce que c’est un matériau très durable : les gravures sont faites de façon à être lisibles avec une loupe ou simplement à l’œil, et résisteront aux conditions lunaires pendant des millions d’années. La capsule (1,4 kg) sera déposée sur la Lune via une mission de la NASA (programme Artemis). \n \n L’objectif philosophique : “mettre l’information dans la peau d’un archéologue du futur” — c’est-à-dire que ces disques pourraient être analysés dans des millions d’années."></div
  <div class="r" data-img="D hiver/cover.jpg" data-text="We Feel Fine est un projet artistique et numérique lancé en 2005 par Jonathan Harris et Sep Kamvar. Il explore les émotions humaines en collectant automatiquement des phrases contenant “I feel” ou “I am feeling” sur des blogs, puis en les organisant sous forme de visualisations interactives. Le système transforme ces fragments de vie en un vaste paysage émotionnel, permettant de parcourir des milliers de sentiments exprimés en ligne, classés par thèmes, lieux, âges ou types d’émotions.\n \n Au-delà de la collecte de données, le projet se veut une réflexion sur l’intimité à l’ère du numérique et sur la manière dont les émotions individuelles composent une sorte de portrait collectif. Grâce à une interface sensible et ludique, We Feel Fine propose une expérience immersive où l’utilisateur navigue à travers des « particules d’émotions », révélant la diversité, la fragilité et la richesse des sentiments humains partagés sur Internet."></div
</div>

<div id="solo"></div>

<script>
const wrap = document.getElementById('wrap');
const solo = document.getElementById('solo');

// applique les images
wrap.querySelectorAll('.r').forEach(r=>{
  r.style.backgroundImage = `url(${r.dataset.img})`;
  r.addEventListener('click', ()=> showText(r.dataset.text));
});

function showText(txt){
  wrap.style.opacity = 0; // fade-out du contenu SEULEMENT

  setTimeout(()=>{
    solo.textContent = txt;
    solo.classList.add('show');
  }, 400);
}

// retour au contenu
solo.addEventListener('click', ()=>{
  solo.classList.remove('show');
  wrap.style.opacity = 1;
});
</script>
