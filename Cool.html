<!doctype html>
<meta charset="utf-8">
<style>
body{
  padding:20px;
  font-family:sans-serif;
}

#wrap{
  display:flex;
  gap:12px;
  transition:opacity .4s ease;
}

.r{
  width:320px;
  height:220px;
  background-size:cover;
  background-position:center;
  border-radius:8px;
  cursor:pointer;
}

/* Écran blanc + texte */
#solo{
  position:fixed;
  inset:0;
  background:white;
  display:flex;
  align-items:center;
  justify-content:center;
  opacity:0;
  pointer-events:none;
  transition:opacity .4s ease;
  font-size:2rem;
  text-align:center;
  padding:20px;
}

#solo.show{
  opacity:1;
  pointer-events:auto;
}
</style>

<div id="wrap">
  <div class="r" data-img="https://picsum.photos/800/600?1" data-text="Voici le texte 1"></div>
  <div class="r" data-img="https://picsum.photos/800/600?2" data-text="Voici le texte 2"></div>
  <div class="r" data-img="https://picsum.photos/800/600?3" data-text="Voici le texte 3"></div>
</div>

<div id="solo"></div>

<script>
const wrap = document.getElementById('wrap');
const solo = document.getElementById('solo');

// applique les images
wrap.querySelectorAll('.r').forEach(r=>{
  r.style.backgroundImage = `url(${r.dataset.img})`;
  r.addEventListener('click', ()=> showText(r.dataset.text));
});

function showText(txt){
  wrap.style.opacity = 0; // fade-out du contenu SEULEMENT

  setTimeout(()=>{
    solo.textContent = txt;
    solo.classList.add('show');
  }, 400);
}

// retour au contenu
solo.addEventListener('click', ()=>{
  solo.classList.remove('show');
  wrap.style.opacity = 1;
});
</script>
