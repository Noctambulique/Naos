<!doctype html>
<meta charset="utf-8">
<style>
body{display:flex;gap:8px;padding:20px;font-family:sans-serif}
.r{width:120px;height:80px;background-size:cover;border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.r.text{background:none;color:#000}
</style>
<div id=wrap>
  <div class=r data-img="https://picsum.photos/300/200?1" data-text="Texte 1"></div>
  <div class=r data-img="https://picsum.photos/300/200?2" data-text="Texte 2"></div>
  <div class=r data-img="https://picsum.photos/300/200?3" data-text="Texte 3"></div>
</div>
<script>
document.querySelectorAll('.r').forEach(r=>{
  r.style.backgroundImage=`url(${r.dataset.img})`;
  r.addEventListener('click',()=>{
    if(!r.classList.contains('text')){ r.textContent=r.dataset.text; r.classList.add('text') }
    else{ r.textContent=''; r.style.backgroundImage=`url(${r.dataset.img})`; r.classList.remove('text') }
  })
})
</script>
