<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Rectangles cliquables — affiche texte</title>
  <style>
    :root{--gap:18px;--radius:14px}
    html,body{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,'Helvetica Neue',Arial}
    body{background:#f3f4f6;padding:30px;box-sizing:border-box}
    .wrap{max-width:1100px;margin:0 auto}

    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:var(--gap)}
    .card{background:white;border-radius:var(--radius);overflow:hidden;cursor:pointer;display:flex;align-items:center;justify-content:center;min-height:150px;box-shadow:0 6px 18px rgba(2,6,23,0.08);transition:transform .18s,box-shadow .18s}
    .card:hover{transform:translateY(-6px);box-shadow:0 12px 30px rgba(2,6,23,0.12)}
    .card img{width:100%;height:100%;object-fit:cover;display:block}
    .title{font-weight:700;margin:0 0 12px 0}

    /* zone qui remplacera les images pour afficher le texte sur fond blanc */
    .reader{background:#fff;padding:28px;border-radius:12px;min-height:320px;box-shadow:0 10px 30px rgba(2,6,23,0.08)}
    .reader .content{white-space:pre-wrap;line-height:1.5;color:#111}

    .controls{margin:18px 0 10px 0;display:flex;gap:12px}
    .btn{background:#0b5cff;color:white;padding:8px 14px;border-radius:10px;border:0;cursor:pointer}
    .btn--ghost{background:transparent;color:#0b5cff;border:1px solid rgba(11,92,255,0.12)}

    /* responsive smaller spacing */
    @media (max-width:520px){:root{--gap:12px}}
  </style>
</head>
<body>
  <div class="wrap">
    <h1 class="title">Rectangles cliquables — clique pour afficher un texte</h1>
    <p>Les rectangles contiennent des images. En cliquant sur un rectangle, les images sont supprimées et le texte apparaît sur fond blanc. Utilisez <code>\n \n</code> dans le texte (deux backslash + n) pour sauter une ligne.</p>

    <div class="controls">
      <button id="resetBtn" class="btn btn--ghost">Réinitialiser les vignettes</button>
    </div>

    <div id="container" class="grid">
      <!-- chaque carte contient une image et un attribut data-text qui contient le texte à afficher -->
      <div class="card" data-text="Voici le texte du premier rectangle.\n \nIl contient deux paragraphes séparés par \"\\n \\n\".\n\nVous pouvez aussi écrire plusieurs lignes avec des \"\\n\" simples.">
        <img src="https://picsum.photos/seed/1/600/400" alt="image 1">
      </div>

      <div class="card" data-text="Deuxième carte :\n \nExemple avec sauts de ligne.\n- Puce 1\n- Puce 2\n \nFin du texte.">
        <img src="https://picsum.photos/seed/2/600/400" alt="image 2">
      </div>

      <div class="card" data-text="Troisième :\n \nUn long texte qui sera automatiquement mis en page et convertira les séquences \\n en sauts de ligne visuels.\n\nAmusez-vous !">
        <img src="https://picsum.photos/seed/3/600/400" alt="image 3">
      </div>

      <div class="card" data-text="Carte 4\n \nTexte court.">
        <img src="https://picsum.photos/seed/4/600/400" alt="image 4">
      </div>
    </div>
  </div>

  <script>
    const container = document.getElementById('container');
    const resetBtn = document.getElementById('resetBtn');


      const initialHTML = container.innerHTML;

    // fonction qui transforme les séquences littérales "\\n \\n" ou "\\n\\n" en <br><br>, et les "\\n" simples en <br>
    function formatTextLiteral(str){
      if(!str) return '';
      // remplace les doubles backslash-n (avec éventuellement des espaces entre) en <br><br>
      let s = str.replace(/\\n\s*\\n/g, '<br><br>');
      // puis remplace les simples backslash-n restants en <br>
      s = s.replace(/\\n/g, '<br>');
      return s;
    }

    // événement sur les rectangles
    container.addEventListener('click', e => {
      const card = e.target.closest('.card');
      if(!card) return;

      // récupère le texte depuis l'attribut data-text (le texte peut contenir des séquences \n)
      const raw = card.getAttribute('data-text') || '';
      const html = formatTextLiteral(raw);

      // remplace toute la grille par une zone blanche affichant le texte
      // ceci "chasse" les images (elles ne sont plus dans le DOM)
      container.innerHTML = `
        <div class="reader">
          <div class="content">${html}</div>
        </div>
      `;

      // met aussi le fond de la page en blanc (optionnel) pour que ce soit bien lisible
      document.body.style.background = '#ffffff';

      // scroll en haut pour mettre le texte en vue
      window.scrollTo({top:0,behavior:'smooth'});
    });

    // bouton réinitialiser : remet les images en place et restaure le fond d'origine
    resetBtn.addEventListener('click', () => {
      container.innerHTML = initialHTML;
      document.body.style.background = '#f3f4f6';
    });

    // --- Astuce pour éditer : si vous voulez mettre des "retours à la ligne" dans l'attribut data-text,
    // écrivez littéralement "\\n" (backslash + n). Pour obtenir un saut de paragraphe, écrivez "\\n \\n".
  </script>
</body>
</html>
