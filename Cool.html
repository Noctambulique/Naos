<!doctype html>
<meta charset="utf-8">
<style>
body{display:flex;gap:12px;padding:20px;font-family:sans-serif}
#wrap{display:flex;gap:12px}
.r{width:320px;height:220px;background-size:cover;background-position:center;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6);font-weight:700}
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#00000088}
.overlay .card{width:80vmin;height:50vmin;background-size:cover;background-position:center;border-radius:10px;display:flex;align-items:center;justify-content:center}
.overlay .card .txt{background:rgba(255,255,255,0.85);padding:18px;border-radius:8px;color:#000;font-size:1.6rem;text-align:center;max-width:85%}
</style>
<div id=wrap>
  <div class=r data-img="https://picsum.photos/800/600?1" data-text="Voici le texte 1"></div>
  <div class=r data-img="https://picsum.photos/800/600?2" data-text="Voici le texte 2"></div>
  <div class=r data-img="https://picsum.photos/800/600?3" data-text="Voici le texte 3"></div>
</div>
<script>
const wrap=document.getElementById('wrap');
wrap.querySelectorAll('.r').forEach(r=>{ r.style.backgroundImage=`url(${r.dataset.img})`; r.addEventListener('click',()=>openFull(r.dataset.img,r.dataset.text)) })
function openFull(img,txt){
  const ov=document.createElement('div'); ov.className='overlay';
  ov.innerHTML=`<div class="card" style="background-image:url(${img})"><div class="txt">${txt}</div></div>`;
  ov.addEventListener('click',()=>ov.remove()); document.body.appendChild(ov);
}
</script>
