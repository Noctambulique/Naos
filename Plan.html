<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Zoom 2×2 — Images zoomables</title>
<style>
  :root{
    --gap: 8px;
    --transition: 450ms cubic-bezier(.2,.9,.2,1);
    --card-radius: 12px;
    --card-shadow: 0 8px 30px rgba(0,0,0,0.35);
  }

  html,body{
    height:100%;
    margin:0;
  }

  body{
    background:
      linear-gradient(180deg, rgba(0,0,0,0.25), rgba(0,0,0,0.25)),
      url('D hiver/Fond.png');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    font-family: system-ui;
    color: #fff;
    display:flex;
  }

  .grid{
    display:grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: var(--gap);
    width:100vw;
    height:100vh;
    padding: var(--gap);
    box-sizing:border-box;
  }

  .card{
    position:relative;
    overflow:hidden;
    border-radius: var(--card-radius);
    box-shadow: var(--card-shadow);
    cursor:pointer;
    transition: transform var(--transition), opacity var(--transition), box-shadow var(--transition);
    display:flex;
    align-items:center;
    justify-content:center;
    background: rgba(0,0,0,0.15);
    backdrop-filter: blur(4px);
  }

 /* L’image ne déborde jamais : elle garde des marges internes */
.card img{
  width: 85%;
  height: 85%;
  object-fit: contain;
  pointer-events: none;
  user-select:none;
  transition: width var(--transition), height var(--transition);
}

/* Quand la carte est zoomée, l’image garde un cadre intérieur */
.card.active img{
  width: 95%;
  height: 95%;
  object-fit: contain;
}

  .grid.zoomed .card:not(.active){
    opacity: 0;
    pointer-events: none;
    transform: scale(0.98);
  }

  .card.active{
    position: fixed;
    top: 50%;
    left: 50%;
    width: calc(100vw - (var(--gap) * 2));
    height: calc(100vh - (var(--gap) * 2));
    transform: translate(-50%, -50%);
    border-radius: 8px;
    box-shadow: 0 30px 70px rgba(0,0,0,0.6);
    cursor: default;
    z-index:60;
  }

  .card.animating{
    transition:none;
  }

  .close-btn{
    position:absolute;
    right: 14px;
    top: 14px;
    background: rgba(0,0,0,0.45);
    border: none;
    color: #fff;
    padding:8px 10px;
    border-radius: 8px;
    font-size: 14px;
    cursor:pointer;
    z-index:70;
    backdrop-filter: blur(4px);
  }

</style>
</head>
<body>
  <main class="grid" id="grid">

    <section class="card" data-id="1" tabindex="0">
      <img src="D hiver/Carreau.png" alt="">
    </section>

    <section class="card" data-id="2" tabindex="0">
      <img src="D hiver/Plan2.png" alt="">
    </section>

    <section class="card" data-id="3" tabindex="0">
      <img src="D hiver/Plan3.png" alt="">
    </section>

    <section class="card" data-id="4" tabindex="0">
      <img src="D hiver/Plan4.png" alt="">
    </section>

  </main>

  <button id="closeBtn" class="close-btn" style="display:none">Fermer ✕</button>

<script>
(function(){
  const grid = document.getElementById('grid');
  const cards = Array.from(document.querySelectorAll('.card'));
  const closeBtn = document.getElementById('closeBtn');

  let activeCard = null;
  let isAnimating = false;

  function openCard(card){
    if(isAnimating || activeCard === card) return;
    isAnimating = true;

    const rect = card.getBoundingClientRect();

    card.style.width = rect.width + 'px';
    card.style.height = rect.height + 'px';
    card.style.left = rect.left + 'px';
    card.style.top = rect.top + 'px';
    card.classList.add('animating');

    card.getBoundingClientRect();

    card.classList.add('active');
    grid.classList.add('zoomed');

    requestAnimationFrame(() => {
      card.classList.remove('animating');
      card.style.width = '';
      card.style.height = '';
      card.style.left = '';
      card.style.top = '';

      closeBtn.style.display = 'block';
      activeCard = card;
      isAnimating = false;
    });
  }

  function closeActive(){
    if(!activeCard || isAnimating) return;
    isAnimating = true;

    const card = activeCard;
    const original = document.querySelector(`.card[data-id="${card.dataset.id}"]`);
    const targetRect = original.getBoundingClientRect();

    const rect = card.getBoundingClientRect();
    card.style.left = rect.left + 'px';
    card.style.top = rect.top + 'px';
    card.style.width = rect.width + 'px';
    card.style.height = rect.height + 'px';

    card.getBoundingClientRect();

    card.classList.add('animating');

    requestAnimationFrame(() => {
      card.style.left = targetRect.left + 'px';
      card.style.top = targetRect.top + 'px';
      card.style.width = targetRect.width + 'px';
      card.style.height = targetRect.height + 'px';

      setTimeout(() => {
        card.classList.remove('active','animating');
        card.style.left = '';
        card.style.top = '';
        card.style.width = '';
        card.style.height = '';
        grid.classList.remove('zoomed');
        activeCard = null;
        closeBtn.style.display = 'none';
        isAnimating = false;
      }, 420);
    });
  }

  cards.forEach(card => {
    card.addEventListener('click', () => {
      if(activeCard === card) closeActive();
      else openCard(card);
    });
  });

  closeBtn.addEventListener('click', closeActive);

  window.addEventListener('keydown', e => {
    if(e.key === 'Escape') closeActive();
  });
})();
</script>
</body>
</html>
