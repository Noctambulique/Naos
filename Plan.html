<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Plan de Naos</title>

<style>
  :root{
    --gap: 2px;
    --transition: 450ms cubic-bezier(.2,.9,.2,1);
    --card-radius: 10px;
    --card-shadow: 0 4px 15px rgba(0,0,0,0.25);
  }

  html,body{
    height:100%;
    margin:0;
  }

  body{
    background:
      linear-gradient(180deg, rgba(0,0,0,0.25), rgba(0,0,0,0.25)),
      url('D hiver/Fond.png');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    font-family: system-ui;
    color: #fff;
    display:flex;
  }

  .grid{
    display:grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: var(--gap);
    width:100vw;
    height:100vh;
    padding: var(--gap);
    box-sizing:border-box;
  }

  .card{
    position:relative;
    overflow:hidden;
    border-radius: var(--card-radius);
    cursor:pointer;
    transition: transform var(--transition), opacity var(--transition), box-shadow var(--transition);
    display:flex;
    align-items:center;
    justify-content:center;
    background: rgba(0,0,0,0.10);
    backdrop-filter: blur(3px);
    box-shadow: inset 0 0 12px rgba(0,0,0,0.10), var(--card-shadow);
  }

  .card img{
    width: 85%;
    height: 85%;
    object-fit: contain;
    pointer-events: none;
    user-select:none;
    transition: width var(--transition), height var(--transition);
  }

  .card.active img{
    width: 95%;
    height: 95%;
  }

  .grid.zoomed .card:not(.active){
    opacity: 0;
    pointer-events: none;
    transform: scale(0.98);
  }

  .card.active{
    position: fixed;
    top: 50%;
    left: 50%;
    width: calc(100vw - (var(--gap) * 2));
    height: calc(100vh - (var(--gap) * 2));
    transform: translate(-50%, -50%);
    border-radius: 8px;
    box-shadow: 0 30px 70px rgba(0,0,0,0.55);
    cursor: default;
    z-index:60;
  }

  .card.animating{
    transition:none;
  }

  .close-btn{
    position:absolute;
    right: 14px;
    top: 14px;
    background: rgba(0,0,0,0.45);
    border: none;
    color: #fff;
    padding:8px 10px;
    border-radius: 8px;
    font-size: 14px;
    cursor:pointer;
    z-index:70;
    backdrop-filter: blur(4px);
  }
</style>
</head>


<body>
  <main class="grid" id="grid">

    <!-- Chaque carte a maintenant une image zoom personnalisée via data-full -->
    <section class="card" data-id="1" data-full="D hiver/Coeur.PNG" tabindex="0">
      <img src="D hiver/Plan3.png" alt="" data-original="D hiver/Plan3.png">
    </section>

    <section class="card" data-id="2" data-full="D hiver/Trèfle.PNG" tabindex="0">
      <img src="D hiver/Plan2.png" alt="" data-original="D hiver/Plan2.png">
    </section>

     <section class="card" data-id="3" data-full="D hiver/Pique.PNG" tabindex="0">
      <img src="D hiver/Plan4.png" alt="" data-original="D hiver/Plan4.png">
    </section>

    <section class="card" data-id="4" data-full="D hiver/Carreau.PNG" tabindex="0">
      <img src="D hiver/Carreau.png" alt="" data-original="D hiver/Carreau.png">
    </section>

  </main>

  <button id="closeBtn" class="close-btn" style="display:none">Fermer ✕</button>


<script>
(function(){

  const grid = document.getElementById('grid');
  const cards = Array.from(document.querySelectorAll('.card'));
  const closeBtn = document.getElementById('closeBtn');

  let activeCard = null;
  let isAnimating = false;

  function openCard(card){
    if(isAnimating || activeCard === card) return;
    isAnimating = true;

    const rect = card.getBoundingClientRect();

    card.style.width = rect.width + 'px';
    card.style.height = rect.height + 'px';
    card.style.left = rect.left + 'px';
    card.style.top = rect.top + 'px';
    card.classList.add('animating');

    card.getBoundingClientRect();

    card.classList.add('active');
    grid.classList.add('zoomed');

    requestAnimationFrame(() => {
      card.classList.remove('animating');
      card.style.width = '';
      card.style.height = '';
      card.style.left = '';
      card.style.top = '';

      closeBtn.style.display = 'block';
      activeCard = card;

      /* Remplacement de l'image par celle définie dans data-full */
      const img = card.querySelector('img');
      const newSrc = card.dataset.full;
      if(newSrc) img.src = newSrc;

      isAnimating = false;
    });
  }

  function closeActive(){
    if(!activeCard || isAnimating) return;
    isAnimating = true;

    const card = activeCard;
    const targetRect = document.querySelector(`.card[data-id="${card.dataset.id}"]`).getBoundingClientRect();

    const rect = card.getBoundingClientRect();
    card.style.left = rect.left + 'px';
    card.style.top = rect.top + 'px';
    card.style.width = rect.width + 'px';
    card.style.height = rect.height + 'px';

    card.getBoundingClientRect();
    card.classList.add('animating');

    requestAnimationFrame(() => {

      card.style.left = targetRect.left + 'px';
      card.style.top = targetRect.top + 'px';
      card.style.width = targetRect.width + 'px';
      card.style.height = targetRect.height + 'px';

      setTimeout(() => {

        /* Remet l'image d'origine */
        const img = card.querySelector('img');
        img.src = img.dataset.original;

        card.classList.remove('active','animating');
        card.style.left = '';
        card.style.top = '';
        card.style.width = '';
        card.style.height = '';

        grid.classList.remove('zoomed');
        activeCard = null;
        closeBtn.style.display = 'none';
        isAnimating = false;

      }, 420);
    });
  }


  cards.forEach(card => {
    card.addEventListener('click', () => {
      if(activeCard === card) closeActive();
      else openCard(card);
    });
  });

  closeBtn.addEventListener('click', closeActive);

  window.addEventListener('keydown', e => {
    if(e.key === 'Escape') closeActive();
  });

})();
</script>

</body>
</html>
