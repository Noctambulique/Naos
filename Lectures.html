<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Bibliothèque</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #fafafa;
            margin: 0;
            padding: 40px;
        }

        .bibliotheque {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .bibliotheque img {
            width: 150px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .bibliotheque img:hover {
            transform: scale(1.05);
        }

        .texte {
            display: none;
            max-width: 800px;
            margin: auto;
            white-space: pre-line; /* gère les \n */
            font-size: 16px;
            line-height: 1.6;
        }

        .retour {
            margin-top: 40px;
            cursor: pointer;
            color: #555;
            font-size: 14px;
        }

        .retour:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="bibliotheque" id="bibliotheque"></div>

<div class="texte" id="texte">
    <div id="contenuTexte"></div>
    <div class="retour" id="retour">← Retour à la bibliothèque</div>
</div>

            image: "Livre./61wwRqRzcyL._AC_UF1000,1000_QL80_ (1).jpg",
            texte: "•	Première définition de la science : La science comme sensation\n \n 1.	Socrate engage Théétète dans une discussion sur la nature de la science.\n \n o	Il pose la question fondamentale : "Qu'est-ce que la science ?"\n o	Il invite Théétète à exprimer sa propre compréhension de ce concept complexe.\n \n 2.	Théétète propose que la science est la sensation, reprenant ainsi la thèse de Protagoras : "L'homme est la mesure de toutes choses" (= la doxa).\n o	Théétète suggère que la science se réduit à la perception sensorielle, chaque individu étant la mesure de sa propre réalité.\n o	Cette définition s'inscrit dans la tradition relativiste de Protagoras, qui remet en question l'existence d'une vérité objective.\n \n 3.	Socrate examine cette thèse en utilisant des exemples de perceptions variables (vent, couleurs).\n o	Il met en évidence la relativité des perceptions sensorielles en montrant que le même vent peut sembler chaud à l'un et froid à l'autre.\n o	Il souligne que les couleurs peuvent être perçues différemment selon les individus et les circonstances.\n \n 4.	Ils concluent que si la sensation est la science, alors la perception est toujours vraie, ce qui semble paradoxal.\n o	Si la science se limite à la sensation, alors chaque perception individuelle est nécessairement vraie pour celui qui la perçoit.\n o	Cette conclusion soulève des difficultés, car elle implique que la vérité est relative et subjective, ce qui contredit l'idée d'une connaissance universelle et objective.\n \n 5.	Socrate introduit la doctrine d'Héraclite sur le flux universel pour renforcer l'idée que la perception est relative.\n o	Il évoque la philosophie d'Héraclite, selon laquelle tout est en perpétuel changement, pour appuyer l'idée que la réalité est fluide et insaisissable.\n o	Cette doctrine renforce la thèse relativiste en suggérant que la perception est constamment en mouvement, rendant difficile l'établissement d'une vérité stable.\n •	Objection à la première définition et introduction de l'art maïeutique\n \n 1.	Socrate soulève des objections à la thèse de Protagoras, notamment en ce qui concerne les rêves, les maladies et les erreurs de perception\n o	Il met en évidence les limites de la perception sensorielle en montrant qu'elle peut être trompeuse dans certaines situations, comme les rêves, les hallucinations ou les illusions d'optique\n o	Il souligne que la maladie peut altérer la perception, remettant en question l'idée que la sensation est toujours vraie\n \n 2.	Théétète reconnaît la difficulté de distinguer le rêve de la veille et la vérité de l'erreur\n o	Il admet que la frontière entre le rêve et la réalité peut être floue, et qu'il est parfois difficile de discerner le vrai du faux\n o	Cette prise de conscience ouvre la voie à une réflexion plus approfondie sur la nature de la connaissance et de la vérité\n \n 3.	Socrate présente son "art maïeutique", l'art d'accoucher les esprits, pour aider Théétète à clarifier ses idées\n o	Il explique sa méthode philosophique, qui consiste à poser des questions et à guider l'interlocuteur dans sa propre réflexion, afin de l'aider à "accoucher" de ses idées et à les examiner de manière critique\n o	Cette approche pédagogique vise à stimuler l'autonomie intellectuelle et à favoriser la recherche de la vérité par soi-même\n \n 4.	Il souligne l'importance de distinguer les opinions chimériques des opinions valables\n o	Il met en garde contre les opinions superficielles et illusoires, qui peuvent entraver la quête de la vérité\n o	Il encourage Théétète à développer un esprit critique et à rechercher des opinions fondées sur la raison et l'examen attentif des faits\n \n •	Deuxième définition de la science : La science comme opinion vraie\n \n 1.	Théétète propose une nouvelle définition : la science est l'opinion vraie\n o	Après avoir abandonné la première définition, Théétète avance une nouvelle proposition, suggérant que la science consiste à avoir des opinions conformes à la réalité\n \n 2.	Socrate remet en question cette définition en montrant que les juges peuvent avoir des opinions vraies sans avoir la science des faits\n o	Il utilise l'exemple des juges qui, bien que prononçant des verdicts justes, peuvent le faire sur la base de témoignages et de preuves, sans avoir une connaissance directe des faits\n o	Cet exemple illustre que l'opinion vraie, même si elle correspond à la réalité, ne garantit pas nécessairement la possession de la science\n \n 3.	Théétète se souvient d'une distinction entre l'opinion vraie avec raison (science) et l'opinion vraie sans raison (non-science)\n o	Il se remémore une discussion antérieure qui établit une distinction cruciale entre deux types d'opinions vraies : celles qui sont fondées sur la raison et la compréhension, et celles qui sont le fruit du hasard ou de la simple croyance\n o	Cette distinction ouvre la voie à une troisième définition de la science, qui intègre la notion de "raison" ou "logos". Le logos apporte la compréhension, l'explication et la capacité de rendre compte de son opinion.\n \n •	E. Troisième définition de la science : La science comme opinion vraie accompagnée de raison\n \n 1.	Socrate examine la notion de "raison" (logos)\n \n o	Il entreprend une analyse approfondie du concept de "raison", qui est central dans la nouvelle définition de la science proposée par Théétète\n o	Il cherche à clarifier ce que l'on entend par "raison" et comment elle se distingue de la simple opinion\n \n 2.	Il propose trois interprétations possibles de la raison\n \n o	a. L'expression de la pensée par la parole : la raison comme capacité à communiquer et à expliquer ses idées de manière claire et cohérente\n o	b. La décomposition d'un objet en ses éléments : la raison comme capacité à analyser et à comprendre la structure d'un objet ou d'un concept, en identifiant ses parties constitutives\n o	c. La capacité de distinguer un objet de tous les autres : la raison comme capacité à définir et à identifier un objet de manière précise, en le différenciant de tout autre objet similaire\n \n •	F. Examen de la deuxième interprétation de la raison\n \n 1.	Socrate et Théétète discutent de l'idée que connaître un objet, c'est connaître ses éléments constitutifs\n \n o	Ils explorent l'idée que la connaissance d'un tout repose sur la connaissance de ses parties, en utilisant l'exemple des lettres et des syllabes\n o	Ils se demandent si la connaissance des lettres suffit pour connaître les syllabes, et si la connaissance des syllabes suffit pour connaître les mots\n 2.	Ils utilisent l'exemple des lettres et des syllabes pour montrer que la connaissance des éléments est nécessaire pour connaître le tout\n o	Ils analysent la relation entre les lettres et les syllabes, en soulignant que la connaissance des lettres est indispensable pour lire et comprendre les syllabes\n o	Ils montrent que la syllabe n'est pas simplement une juxtaposition de lettres, mais une entité nouvelle qui émerge de leur combinaison\n 3.	Ils concluent que la syllabe n'est pas simplement la somme de ses éléments, mais une entité unique\n o	Ils reconnaissent que la syllabe possède une réalité propre, qui dépasse la simple addition de ses éléments constitutifs\n o	Cette conclusion remet en question l'idée que la connaissance d'un tout se réduit à la connaissance de ses parties, et ouvre la voie à une réflexion plus complexe sur la nature de la connaissance\n \n •	G. Examen de la troisième interprétation de la raison\n 1.	Socrate examine l'idée que la raison est la capacité de distinguer un objet de tous les autres\n o	Il explore l'idée que la connaissance d'un objet implique la capacité à le définir et à le différencier de tout autre objet, en utilisant l'exemple du soleil\n 2.	Il utilise l'exemple de la définition du soleil comme "le plus brillant des corps célestes"\n o	Il analyse cette définition, en montrant qu'elle ne capture pas l'essence du soleil, mais seulement une de ses caractéristiques distinctives\n o	Il souligne que cette définition ne permet pas de comprendre la nature profonde du soleil, ni de le distinguer de manière absolue de tout autre objet céleste\n 3.	Il montre que cette définition ne donne pas la véritable essence du soleil, mais seulement une caractéristique distinctive\n o	Il met en évidence les limites de la définition par la différence, en soulignant qu'elle ne fournit qu'une connaissance partielle et relative de l'objet\n 4.	Ils concluent que l'opinion vraie accompagnée de la connaissance de la différence ne suffit pas à définir la science.\n o	Ils reconnaissent que la troisième interprétation de la raison, bien qu'utile, ne permet pas de définir la science de manière complète et satisfaisante\n o	Ils constatent que la connaissance de la différence, bien qu'importante, ne garantit pas la possession de la science, car elle peut être associée à une opinion vraie sans véritable compréhension.\n \n •	H. Retour sur la définition de l'opinion fausse\n \n 1.	Socrate revient sur la question de l'opinion fausse, soulignant l'importance de la définir avant de définir la science.\n o	Il propose de revenir à la question de l'opinion fausse, en considérant qu'il est essentiel de comprendre ce qu'est l'erreur avant de pouvoir définir la science, qui est la connaissance vraie\n o	Il suggère une nouvelle approche pour aborder cette question, en se concentrant sur la relation entre la perception et la connaissance\n 2.	Il propose une nouvelle approche pour expliquer l'opinion fausse, en distinguant entre ce que l'on sait et ce que l'on perçoit\n o	Il introduit une distinction fondamentale entre deux types de contenus mentaux : les objets de la connaissance (ce que l'on sait) et les objets de la perception (ce que l'on perçoit)\n o	Il suggère que l'opinion fausse résulte d'une confusion entre ces deux types de contenus\n 3.	Il utilise l'exemple de la confusion entre deux personnes pour illustrer comment l'opinion fausse peut se produire\n \n o	Il présente un exemple concret pour illustrer son propos : la confusion entre deux personnes que l'on connaît, Théodore et Théétète\n o	Il montre que cette confusion peut conduire à des jugements erronés, comme attribuer à Théodore une action réalisée par Théétète\n 2.	Ils concluent que l'opinion fausse résulte d'une mauvaise association entre la perception et la connaissance\n o	Ils arrivent à la conclusion que l'opinion fausse se produit lorsque l'on associe incorrectement un objet de la perception à un objet de la connaissance\n o	Cette explication permet de comprendre comment l'erreur est possible, même lorsque l'on possède une connaissance préalable des objets en question\n \n •	I. La cire et les empreintes : une analogie pour la mémoire et la connaissance\n 1.	Socrate introduit l'analogie de la cire pour expliquer la mémoire et la connaissance\n o	Il propose une analogie pour illustrer le fonctionnement de la mémoire et de la connaissance : l'âme est comparée à un bloc de cire, sur lequel les sensations et les pensées laissent des empreintes\n o	Cette analogie permet de visualiser le processus d'acquisition et de stockage des informations dans l'esprit\n 2.	Il décrit comment les sensations et les conceptions laissent des empreintes dans la cire de l'âme\n o	Il explique que chaque perception et chaque pensée laisse une trace dans la cire, comme un sceau qui imprime sa marque sur une surface malléable\n o	Ces empreintes constituent la mémoire, qui permet de se souvenir des expériences passées et des connaissances acquises\n 3.	Il explique que la qualité de la cire influence la capacité d'apprendre, de se souvenir et de former des jugements vrais\n o	Il souligne que la qualité de la cire, sa dureté ou sa mollesse, sa pureté ou son impureté, influence la capacité de l'âme à recevoir, conserver et utiliser les empreintes\n o	Une bonne cire permet de former des empreintes claires et durables, favorisant ainsi l'apprentissage, la mémoire et la formation de jugements vrais. L'empreinte laissée sur la cire représente le souvenir, et l'effacement de cette empreinte représente l'oubli.\n 4.	Il montre comment la confusion entre les empreintes peut conduire à des opinions fausses\n o	Il explique que l'opinion fausse peut résulter d'une confusion entre les empreintes, lorsque l'on associe une empreinte à un objet de connaissance erroné\n o	Cette confusion peut se produire lorsque les empreintes sont floues, superposées ou mal conservées, rendant difficile leur identification et leur interprétation correctes\n \n •	J. Conclusion provisoire et nouvelles difficultés\n 1.	Socrate résume les conclusions provisoires : l'opinion fausse existe, et elle se produit lorsque l'on confond les empreintes de la perception et de la connaissance\n o	Il récapitule les principaux points de leur discussion, en soulignant qu'ils ont établi l'existence de l'opinion fausse et ont proposé une explication de son mécanisme\n o	Il rappelle que l'opinion fausse résulte d'une mauvaise association entre les empreintes de la perception et de la connaissance, conduisant à des jugements erronés\n \n 1.	Il souligne cependant que cette explication soulève de nouvelles difficultés\n o	Il reconnaît que leur explication, bien que prometteuse, soulève de nouvelles questions et défis\n o	Il anticipe les objections potentielles et les paradoxes qui pourraient découler de leur théorie de l'opinion fausse\n 2.	Il s'interroge sur la possibilité de confondre la science et l'ignorance, ce qui conduirait à des paradoxes\n o	Il soulève une question cruciale : est-il possible de confondre la science (la connaissance vraie) avec l'ignorance, et si oui, comment expliquer ce phénomène ?\n o	Il entrevoit les difficultés logiques et conceptuelles que cette possibilité soulève, et invite à poursuivre l'enquête pour résoudre ces paradoxes\n \n •	K. Poursuite de l'enquête et critique de Protagoras\n \n 1.	Socrate propose de poursuivre l'enquête en examinant de plus près la nature de la science\n o	Face aux nouvelles difficultés rencontrées, Socrate propose de reprendre leur investigation sur la nature de la science\n o	Il suggère d'approfondir leur réflexion et d'explorer de nouvelles pistes pour tenter de résoudre les paradoxes et les contradictions\n 2.	Il critique à nouveau la doctrine de Protagoras, en montrant qu'elle conduit à l'idée que l'opinion de chacun est vraie, même si elle contredit l'opinion des autres\n o	Il revient sur la thèse relativiste de Protagoras, en soulignant ses implications problématiques\n o	Il montre que cette doctrine conduit à une conception subjective et contradictoire de la vérité, où chaque individu possède sa propre vérité, même si elle s'oppose à celle des autres\n 3.	Il souligne l'importance de distinguer entre la persuasion et l'enseignement, et de rechercher la vérité plutôt que la simple victoire dans la discussion\n o	Il met en garde contre la confusion entre la persuasion, qui vise à convaincre par tous les moyens, et l'enseignement, qui vise à transmettre la vérité\n o	Il insiste sur la nécessité de rechercher la vérité de manière désintéressée, sans se laisser influencer par les opinions dominantes ou les intérêts personnels\n \n •	L. Portraits contrastés du philosophe et de l'orateur\n \n 1.	Socrate et Théodore discutent des différences entre le philosophe et l'orateur\n o	Ils engagent une réflexion sur deux figures emblématiques de la vie intellectuelle grecque : le philosophe et l'orateur\n o	Ils cherchent à mettre en évidence leurs caractéristiques distinctives, leurs rôles sociaux et leurs contributions à la société\n 2.	Socrate décrit le philosophe comme un être détaché des affaires courantes, préoccupé par la recherche de la vérité universelle\n o	Il dresse le portrait du philosophe idéal, qui se consacre à la contemplation des idées éternelles et à la quête de la sagesse\n o	Il souligne son détachement des préoccupations matérielles et des ambitions politiques, qui lui permet de se consacrer pleinement à la recherche de la vérité\n 3.	Il dépeint l'orateur comme un être habile à persuader, mais souvent esclave des opinions et des intérêts particuliers\n o	Il présente l'orateur comme un maître de la rhétorique, capable de convaincre et de séduire par ses discours\n o	Il met en garde contre les dérives de l'éloquence, qui peut être utilisée à des fins manipulatrices ou pour défendre des intérêts particuliers au détriment de la vérité\n 4.	Il souligne l'importance de la philosophie pour accéder à une vie juste et heureuse, en se rapprochant de la divinité\n o	Il affirme que la philosophie est essentielle pour mener une vie vertueuse et épanouissante, car elle permet de se rapprocher de la divinité, qui est le modèle de la justice et de la sagesse\n o	Il invite à cultiver la philosophie pour atteindre le bonheur véritable, qui réside dans la connaissance de soi et dans la conformité à l'ordre divin\n \n •	M. La justice et le bonheur\n \n 1.	Socrate affirme que la véritable raison de poursuivre la vertu et d'éviter le vice n'est pas la réputation, mais la ressemblance avec Dieu, qui est la justice même\n o	Il soutient que la recherche de la vertu et le rejet du vice ne doivent pas être motivés par le désir de la gloire ou de l'approbation sociale, mais par le désir de ressembler à Dieu, qui incarne la justice parfaite\n o	Cette conception de la morale place la divinité au centre de la vie éthique, en faisant de la ressemblance à Dieu le but ultime de l'existence humaine\n 2.	Il explique que l'injustice conduit à une vie malheureuse, conforme au modèle auquel elle ressemble\n l'injustice, en éloignant l'âme de la divinité, conduit inévitablement au malheur, car elle la rend conforme au modèle de l'injustice, qui est source de désordre et de souffrance * Cette conception de la justice et du bonheur établit un lien direct entre la morale et le bien-être de l'âme, en montrant que le bonheur véritable ne peut être atteint que par la pratique de la vertu\n 3.	Il critique ceux qui se croient habiles en faisant le mal, et souligne l'importance de reconnaître sa propre ignorance pour progresser vers la sagesse \n o	Il dénonce l'illusion de ceux qui pensent pouvoir tirer profit de l'injustice, en soulignant que le véritable bonheur ne peut être fondé sur le mal\n o	Il rappelle l'importance de l'humilité intellectuelle et de la reconnaissance de sa propre ignorance, qui sont les premières étapes sur le chemin de la sagesse\n \n •	N. Retour à la question principale et critique d'Héraclite\n \n 1.	Socrate propose de revenir à la question principale : la nature de la science\n o	Après cette digression sur la justice et le bonheur, Socrate propose de revenir à leur question initiale : qu'est-ce que la science ?\n o	Il suggère d'explorer une nouvelle piste, en examinant la doctrine d'Héraclite sur le flux universel\n 2.	Il suggère d'examiner la doctrine d'Héraclite sur le flux universel\n o	Il propose d'analyser la philosophie d'Héraclite, qui affirme que tout est en perpétuel changement, pour voir si elle peut apporter un éclairage sur la nature de la science\n o	Cette doctrine remet en question la possibilité même de la connaissance, car si tout est en mouvement, comment peut-on connaître quelque chose qui ne cesse de se transformer ?\n 3.	Théodore souligne la difficulté de discuter avec les partisans d'Héraclite, qui sont en perpétuel mouvement et refusent toute stabilité\n o	Théodore exprime sa réticence à l'égard des disciples d'Héraclite, qu'il décrit comme des individus insaisissables et changeants, rendant difficile toute discussion sérieuse\n o	Cette remarque souligne les défis posés par la doctrine du flux, qui semble incompatible avec la recherche de la vérité et de la connaissance stable\n 4.	Socrate propose de les considérer comme un "problème" à résoudre\n o	Face à ces difficultés, Socrate adopte une attitude positive et propose de considérer les héraclitéens comme un défi intellectuel à relever\n o	Il invite à analyser leurs arguments et à examiner les implications de leur doctrine pour la compréhension de la science\n \n •	O. Examen de la doctrine du flux\n \n 1.	Socrate examine la doctrine d'Héraclite selon laquelle tout est en mouvement\n o	Il entreprend une analyse rigoureuse de la doctrine du flux, en cherchant à comprendre ses fondements et ses conséquences\n o	Il interroge la notion même de mouvement, en distinguant deux types de mouvement : le déplacement et l'altération\n 2.	Il distingue deux types de mouvement : le déplacement et l'altération\n o	Il établit une distinction cruciale entre deux formes de mouvement :\n 	Le déplacement : changement de lieu ou de position dans l'espace\n 	L'altération : changement de qualité ou de propriété d'un objet\n 3.	Il interroge la possibilité de nommer et de connaître les choses si elles sont en perpétuel changement\n o	Il soulève une question fondamentale : si tout est en constant mouvement, comment peut-on attribuer un nom à un objet et le connaître, alors qu'il ne cesse de se transformer ?\n o	Cette question met en lumière la difficulté de concilier la doctrine du flux avec la possibilité de la connaissance et du langage\n 4.	Il conclut que si tout est en mouvement, alors aucune réponse sur quoi que ce soit n'est plus vraie qu'une autre, ce qui remet en question la notion même de science\n o	Il aboutit à une conclusion radicale : si la doctrine du flux est vraie, alors il n'existe pas de vérité stable ni de connaissance objective, car toute affirmation est aussi vraie que son contraire\n o	Cette conclusion remet en cause la possibilité même de la science, qui repose sur l'idée qu'il existe des vérités universelles et immuables\n \n •	P. Conclusion : échec de la recherche et leçon d'humilité\n \n 1.	Socrate reconnaît l'échec de leur tentative de définir la science\n \n o	Après avoir exploré différentes pistes et rencontré de nombreuses difficultés, Socrate admet qu'ils n'ont pas réussi à trouver une définition satisfaisante de la science\n o	Cet aveu d'échec témoigne de l'honnêteté intellectuelle de Socrate et de sa volonté de reconnaître les limites de la connaissance humaine\n 2.	Il souligne l'importance de reconnaître son ignorance et de ne pas prétendre savoir ce que l'on ne sait pas\n o	Il rappelle la célèbre maxime de Socrate : "Je sais que je ne sais rien"\n o	Il insiste sur la nécessité de l'humilité intellectuelle et de la remise en question constante de ses propres connaissances\n 3.	Il conclut en rappelant la nature de son art maïeutique, qui consiste à aider les autres à accoucher de leurs propres idées\n o	Il réaffirme sa vocation de philosophe-accoucheur, qui consiste à aider les autres à donner naissance à leurs propres idées et à les examiner de manière critique\n o	Il souligne l'importance de la recherche de la vérité par soi-même, plutôt que de se contenter de recevoir des connaissances toutes faites\n"
        },
        {
            image: "images/livre2.jpg",

    const bibliotheque = document.getElementById("bibliotheque");
    const texteDiv = document.getElementById("texte");
    const contenuTexte = document.getElementById("contenuTexte");
    const retour = document.getElementById("retour");

    livres.forEach(livre => {
        const img = document.createElement("img");
        img.src = livre.image;

        img.addEventListener("click", () => {
            bibliotheque.style.display = "none";
            contenuTexte.textContent = livre.texte;
            texteDiv.style.display = "block";
        });

        bibliotheque.appendChild(img);
    });

    retour.addEventListener("click", () => {
        texteDiv.style.display = "none";
        bibliotheque.style.display = "flex";
    });
</script>
