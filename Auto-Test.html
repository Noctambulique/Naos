<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>État interne</title>

<style>
    body {
        font-family: serif;
        background: #ffffff;
        color: #111;
        max-width: 700px;
        margin: 80px auto;
        text-align: center;
    }

    h1 {
        font-weight: normal;
        margin-bottom: 40px;
    }

    .bar-container {
        width: 100%;
        height: 12px;
        background: #eee;
        position: relative;
        margin: 40px 0;
    }

    .bar {
        height: 100%;
        width: 50%;
        background: #000;
        transition: width 0.4s ease;
    }

    .buttons {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-top: 30px;
    }

    button {
        background: none;
        border: 1px solid #000;
        padding: 10px;
        font-size: 14px;
        cursor: pointer;
        transition: all 0.2s ease;
    }

    button:hover {
        background: #000;
        color: #fff;
    }

    .label {
        margin-top: 15px;
        font-size: 14px;
        color: #444;
    }
</style>
</head>

<body>

<h1>État intérieur</h1>

<div class="bar-container">
    <div id="bar" class="bar"></div>
</div>

<div class="label" id="value">Niveau : 50%</div>

<div class="buttons">
    <!-- Positifs -->
    <button onclick="changeState(8)">Bon sommeil</button>
    <button onclick="changeState(6)">Clarté mentale</button>
    <button onclick="changeState(5)">Mouvement physique</button>
    <button onclick="changeState(4)">Moment de calme</button>

    <!-- Négatifs -->
    <button onclick="changeState(-7)">Fatigue</button>
    <button onclick="changeState(-6)">Surcharge mentale</button>
    <button onclick="changeState(-5)">Manque de sens</button>
    <button onclick="changeState(-4)">Tension corporelle</button>
</div>

<script>
    let value = 50;

    function changeState(amount) {
        value += amount;
        if (value > 100) value = 100;
        if (value < 0) value = 0;

        document.getElementById("bar").style.width = value + "%";
        document.getElementById("value").textContent = "Niveau : " + value + "%";
    }
</script>

</body>
</html>
