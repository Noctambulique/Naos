<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>État émotionnel</title>

    <style>
        body {
            font-family: serif;
            background: #ffffff;
            color: #111;
            max-width: 600px;
            margin: 60px auto;
            line-height: 1.6;
        }

        h1 {
            font-weight: normal;
            font-size: 22px;
            margin-bottom: 30px;
        }

        .item {
            display: flex;
            align-items: center;
            margin-bottom: 14px;
            cursor: pointer;
        }

        input[type="checkbox"] {
            margin-right: 12px;
            transform: scale(1.1);
        }

        .label {
            font-size: 15px;
        }

        .bar-container {
            margin-top: 40px;
            height: 8px;
            background: #eee;
            position: relative;
        }

        .bar {
            height: 100%;
            width: 0%;
            background: #000;
            transition: width 0.4s ease;
        }

        .value {
            margin-top: 10px;
            font-size: 14px;
            color: #444;
        }
    </style>
</head>

<body>

<h1>État émotionnel</h1>

<div id="items"></div>

<div class="bar-container">
    <div class="bar" id="bar"></div>
</div>

<div class="value" id="valueText">Niveau : 0%</div>

<script>
    // --- CONFIGURATION PRINCIPALE ---
    const factors = [
        { label: "Sommeil réparateur", weight: 25 },
        { label: "Clarté mentale", weight: 20 },
        { label: "Mouvement / activité physique", weight: 15 },
        { label: "Stabilité émotionnelle", weight: 20 },
        { label: "Connexion sociale", weight: 10 },
        { label: "Sensation de sens", weight: 10 }
    ];

    const container = document.getElementById("items");
    const bar = document.getElementById("bar");
    const valueText = document.getElementById("valueText");

    function updateScore() {
        let score = 0;
        document.querySelectorAll("input[type='checkbox']").forEach(cb => {
            if (cb.checked) score += parseInt(cb.dataset.weight);
        });

        score = Math.min(score, 100);
        bar.style.width = score + "%";
        valueText.textContent = "Niveau : " + score + "%";
    }

    factors.forEach(factor => {
        const row = document.createElement("div");
        row.className = "item";

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.dataset.weight = factor.weight;
        checkbox.addEventListener("change", updateScore);

        const label = document.createElement("span");
        label.className = "label";
        label.textContent = factor.label;

        row.appendChild(checkbox);
        row.appendChild(label);
        container.appendChild(row);
    });
</script>

</body>
</html>
