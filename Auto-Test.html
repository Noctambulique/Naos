<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>État mental dynamique</title>
<style>
:root{
  --bg:#f8fafc; --panel:#fff;
  --blue:#2563eb; --red:#dc2626;
  --axis:#94a3b8; --text:#0f172a;
}
*{box-sizing:border-box}
body{
  margin:0; display:flex; height:100vh;
  font-family:system-ui,sans-serif;
  background:var(--bg); color:var(--text);
}
aside{
  width:300px; padding:16px;
  background:var(--panel);
  border-right:1px solid #e2e8f0;
}
.control{margin-bottom:10px;font-size:13px}
input{width:100%}
main{flex:1; position:relative}
canvas{width:100%; height:100%}
#etat{
  position:absolute; top:12px; right:12px;
  background:white; padding:12px 18px;
  border-radius:12px;
  box-shadow:0 4px 20px rgba(0,0,0,.08);
  font-weight:600; font-size:14px;
}
</style>
</head>
<body>

<aside>
<h3>Facteurs (Bonheur uniquement)</h3>
<div class="control">Sommeil<input id="sommeil" type="range" min="0" max="1" step="0.01" value="0.5"></div>
<div class="control">Nourriture<input id="nourriture" type="range" min="0" max="1" step="0.01" value="0.5"></div>
<div class="control">Soleil<input id="soleil" type="range" min="0" max="1" step="0.01" value="0.5"></div>
<div class="control">Musique<input id="musique" type="range" min="0" max="1" step="0.01" value="0.5"></div>
<div class="control">Sport<input id="sport" type="range" min="0" max="1" step="0.01" value="0.5"></div>
<div class="control">Imprévu<input id="imprevu" type="range" min="0" max="1" step="0.01" value="0.5"></div>
</aside>

<main>
<canvas id="c"></canvas>
<div id="etat">—</div>
</main>

<script>
const c = document.getElementById("c");
const ctx = c.getContext("2d");
const etatBox = document.getElementById("etat");

function resize(){
  const r = devicePixelRatio||1;
  c.width = c.clientWidth*r;
  c.height = c.clientHeight*r;
  ctx.setTransform(r,0,0,r,0,0);
}
resize(); addEventListener("resize",resize);

const mid = () => c.clientHeight/2;
const seuil = 35;

let x = 0;

/* =======================
   BONHEUR (ligne bleue)
   ======================= */
let yBonheur = mid();
let prevBonheur = yBonheur;

function bonheurImpact(){
  let d = 0;
  d += (sommeil.value-0.5)*2.2;
  d += (soleil.value-0.5)*1.8;
  d += (nourriture.value-0.5)*1.5;
  d += (musique.value-0.5)*0.8;
  d += (sport.value-0.5)*0.6;
  d -= (imprevu.value-0.5)*1.2;

  // retour naturel vers le centre
  d += (mid()-yBonheur)/600;
  return d;
}

/* =========================
   STIMULATION (ligne rouge)
   oscillation autonome
   ========================= */
let t = 0;

function stimulationY(){
  const amplitude = 120;          // grande amplitude
  const vitesse = 0.015;          // lente mais perceptible
  const bruit = Math.sin(t*0.47)*12; // légère irrégularité

  return mid() + Math.sin(t)*amplitude + bruit;
}

/* =======================
   INTERPRÉTATION
   ======================= */
function signe(y){
  if(y < mid()-seuil) return "+";
  if(y > mid()+seuil) return "-";
  return "0";
}

function definirEtat(b,s){
  if(b==="+" && s==="+") return "Euphorie";
  if(b==="-" && s==="-") return "Épuisement";
  if(b==="-" && s==="+") return "Apaisement";
  if(b==="0" && s==="0") return "Travail";
  if(b==="+") return "Heureux";
  if(b==="-") return "Tristesse";
  if(s==="+") return "Stimulé";
  if(s==="-") return "Fatigue";
  return "—";
}

/* =======================
   BOUCLE
   ======================= */
function loop(){
  ctx.fillStyle="rgba(248,250,252,0.06)";
  ctx.fillRect(0,0,c.clientWidth,c.clientHeight);

  // axe central
  ctx.strokeStyle="#94a3b8";
  ctx.beginPath();
  ctx.moveTo(0,mid());
  ctx.lineTo(c.clientWidth,mid());
  ctx.stroke();

  // bonheur
  yBonheur += bonheurImpact();
  yBonheur = Math.max(20,Math.min(c.clientHeight-20,yBonheur));

  // stimulation
  const yStim = stimulationY();
  t += 0.015;

  ctx.strokeStyle="#2563eb";
  ctx.lineWidth=3.5;
  ctx.beginPath();
  ctx.moveTo(x-1,prevBonheur);
  ctx.lineTo(x,yBonheur);
  ctx.stroke();

  ctx.strokeStyle="#dc2626";
  ctx.lineWidth=3;
  ctx.beginPath();
  ctx.moveTo(x,yStim);
  ctx.lineTo(x+1,yStim);
  ctx.stroke();

  etatBox.textContent = definirEtat(signe(yBonheur), signe(yStim));

  prevBonheur = yBonheur;
  x++;
  if(x > c.clientWidth){
    x = 0;
    prevBonheur = yBonheur = mid();
  }
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
