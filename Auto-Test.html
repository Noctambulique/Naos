<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>État mental dynamique</title>

<style>
:root{
  --bg1:#f1f5f9;
  --bg2:#e2e8f0;
  --panel:#ffffffee;
  --blue:#2563eb;
  --red:#dc2626;
  --axis:#94a3b8;
  --text:#0f172a;
  --radius:18px;
}

*{box-sizing:border-box}

body{
  margin:0;
  display:flex;
  height:100vh;
  font-family:system-ui,-apple-system,Segoe UI,Roboto;
  background:linear-gradient(160deg,var(--bg1),var(--bg2));
  color:var(--text);
}

/* ===== PANNEAU ===== */
aside{
  width:300px;
  padding:18px;
  background:var(--panel);
  backdrop-filter:blur(10px);
  border-right:1px solid #e2e8f0;
  box-shadow:4px 0 30px rgba(0,0,0,.05);
}

aside h3{
  margin-top:0;
  font-size:16px;
}

.control{
  margin-bottom:14px;
  font-size:12px;
  color:#475569;
}

input[type=range]{
  width:100%;
  accent-color:var(--blue);
}

/* ===== SCÈNE ===== */
main{
  flex:1;
  position:relative;
}

canvas{
  width:100%;
  height:100%;
}

/* ===== ÉTAT ===== */
#etat{
  position:absolute;
  top:14px;
  right:14px;
  background:var(--panel);
  padding:14px 20px;
  border-radius:var(--radius);
  box-shadow:0 10px 30px rgba(0,0,0,.12);
  font-weight:600;
  font-size:15px;
  text-align:center;
}

/* ===== LÉGENDE ===== */
#legende{
  position:absolute;
  bottom:14px;
  left:14px;
  background:var(--panel);
  padding:12px 16px;
  border-radius:var(--radius);
  box-shadow:0 10px 30px rgba(0,0,0,.12);
  font-size:12px;
}

#legende span{
  display:inline-block;
  width:10px;
  height:10px;
  border-radius:50%;
  margin-right:6px;
}

.bleu{background:var(--blue)}
.rouge{background:var(--red)}

.axe{
  margin-top:6px;
  color:#64748b;
  font-style:italic;
}
</style>
</head>

<body>

<aside>
<h3>Facteurs → Bonheur</h3>
<p style="font-size:12px;color:#64748b;margin-bottom:14px">
Les curseurs influencent le bonheur.<br>
La stimulation évolue lentement et seule.
</p>

<div class="control">Sommeil<input id="sommeil" type="range" min="0" max="1" step="0.01" value="0.5"></div>
<div class="control">Nourriture<input id="nourriture" type="range" min="0" max="1" step="0.01" value="0.5"></div>
<div class="control">Soleil<input id="soleil" type="range" min="0" max="1" step="0.01" value="0.5"></div>
<div class="control">Musique<input id="musique" type="range" min="0" max="1" step="0.01" value="0.5"></div>
<div class="control">Sport<input id="sport" type="range" min="0" max="1" step="0.01" value="0.5"></div>
<div class="control">Imprévu<input id="imprevu" type="range" min="0" max="1" step="0.01" value="0.5"></div>
</aside>

<main>
<canvas id="c"></canvas>

<div id="etat">—</div>

<div id="legende">
  <div><span class="bleu"></span> Bonheur</div>
  <div><span class="rouge"></span> Stimulation</div>
  <div class="axe">Haut : + | Centre : neutre | Bas : –</div>
</div>
</main>

<script>
/* ===== CANVAS ===== */
const c = document.getElementById("c");
const ctx = c.getContext("2d");
const etatBox = document.getElementById("etat");

function resize(){
  const r = devicePixelRatio || 1;
  c.width = c.clientWidth * r;
  c.height = c.clientHeight * r;
  ctx.setTransform(r,0,0,r,0,0);
}
resize();
addEventListener("resize", resize);

const mid = () => c.clientHeight / 2;
const seuil = 40;

/* ===== TEMPS ===== */
let x = 0;
let t = 0;

/* ===== BONHEUR ===== */
let yBonheur = mid();
let prevBonheur = yBonheur;

function bonheurImpact(){
  let d = 0;

  d += (sommeil.value   - 0.5) * 1.6;
  d += (soleil.value    - 0.5) * 1.4;
  d += (nourriture.value- 0.5) * 1.2;
  d += (musique.value   - 0.5) * 0.6;
  d += (sport.value     - 0.5) * 0.5;
  d -= (imprevu.value   - 0.5) * 1.0;

  d += (mid() - yBonheur) / 900;
  return d * 0.35; // ralentissement global
}

/* ===== STIMULATION (PLUS LENTE) ===== */
function stimulationY(){
  const amplitude = 100;
  const drift = Math.sin(t * 0.15) * 18;
  return mid() + Math.sin(t * 0.35) * amplitude + drift;
}

/* ===== INTERPRÉTATION ===== */
function signe(y){
  if (y < mid() - seuil) return "+";
  if (y > mid() + seuil) return "-";
  return "0";
}

function definirEtat(b,s){
  if (b==="+"&&s==="-") return "Apaisement";
  if (b==="+"&&s==="+") return "Euphorie";
  if (b==="-"&&s==="+") return "Tension";
  if (b==="-"&&s==="-") return "Abattement";
  if (b==="0"&&s==="0") return "Travail";
  if (b==="+") return "Heureux";
  if (b==="−") return "Tristesse";
  if (s==="+") return "Stimulé";
  if (s==="-") return "Fatigue";
  return "—";
}

/* ===== BOUCLE ===== */
function loop(){
  ctx.fillStyle = "rgba(241,245,249,0.08)";
  ctx.fillRect(0,0,c.clientWidth,c.clientHeight);

  ctx.strokeStyle = "#cbd5e1";
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, mid());
  ctx.lineTo(c.clientWidth, mid());
  ctx.stroke();

  yBonheur += bonheurImpact();
  yBonheur = Math.max(30, Math.min(c.clientHeight-30, yBonheur));

  const yStim = stimulationY();
  t += 0.008; // TEMPS RALENTI

  ctx.strokeStyle = "#2563eb";
  ctx.lineWidth = 3.2;
  ctx.beginPath();
  ctx.moveTo(x-1, prevBonheur);
  ctx.lineTo(x, yBonheur);
  ctx.stroke();

  ctx.strokeStyle = "#dc2626";
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(x, yStim);
  ctx.lineTo(x+1, yStim);
  ctx.stroke();

  const b = signe(yBonheur);
  const s = signe(yStim);

  etatBox.innerHTML = `
    <div>${definirEtat(b,s)}</div>
    <div style="font-size:11px;color:#64748b;margin-top:4px">
      Bonheur ${b} | Stimulation ${s}
    </div>
  `;

  prevBonheur = yBonheur;
  x++;

  if(x > c.clientWidth){
    x = 0;
    prevBonheur = yBonheur = mid();
  }

  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
