<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>État mental dynamique</title>

<style>
:root{
  --sky1:#dff3ff;
  --sky2:#b9e6ff;
  --glass:rgba(255,255,255,.55);
  --border:rgba(255,255,255,.9);
  --blue:#2b8cff;
  --red:#ff4b4b;
  --text:#0b1a2b;
  --radius:20px;
}

*{box-sizing:border-box}

body{
  margin:0;
  display:flex;
  height:100vh;
  font-family:"Segoe UI",Tahoma,sans-serif;
  background:
    radial-gradient(circle at 20% 20%, #ffffff 0%, transparent 40%),
    linear-gradient(160deg,var(--sky1),var(--sky2));
  color:var(--text);
}

/* ===== PANNEAU GAUCHE ===== */
aside{
  width:310px;
  padding:20px;
  background:linear-gradient(
    to bottom,
    rgba(255,255,255,.75),
    rgba(255,255,255,.45)
  );
  backdrop-filter:blur(14px);
  border-right:1px solid var(--border);
  box-shadow:6px 0 30px rgba(0,0,0,.15);
}

aside h3{
  margin-top:0;
  font-size:17px;
  text-shadow:0 1px 0 #fff;
}

aside p{
  font-size:12px;
  color:#35526b;
}

/* ===== SLIDERS ===== */
.control{
  margin-bottom:16px;
  font-size:12px;
}

input[type=range]{
  width:100%;
  height:6px;
  border-radius:10px;
  background:linear-gradient(to right,#93c5fd,#60a5fa);
  appearance:none;
}

input[type=range]::-webkit-slider-thumb{
  appearance:none;
  width:18px;
  height:18px;
  border-radius:50%;
  background:
    radial-gradient(circle at 30% 30%, #ffffff, #dbeafe);
  border:1px solid #93c5fd;
  box-shadow:0 2px 6px rgba(0,0,0,.3);
}

/* ===== SCÈNE ===== */
main{
  flex:1;
  position:relative;
}

canvas{
  width:100%;
  height:100%;
}

/* ===== ÉTAT ===== */
#etat{
  position:absolute;
  top:16px;
  right:16px;
  background:
    linear-gradient(
      to bottom,
      rgba(255,255,255,.9),
      rgba(255,255,255,.6)
    );
  padding:14px 22px;
  border-radius:var(--radius);
  border:1px solid var(--border);
  box-shadow:
    inset 0 1px 0 #fff,
    0 10px 25px rgba(0,0,0,.2);
  font-weight:600;
  font-size:15px;
  text-align:center;
}

/* ===== LÉGENDE ===== */
#legende{
  position:absolute;
  bottom:16px;
  left:16px;
  background:
    linear-gradient(
      to bottom,
      rgba(255,255,255,.85),
      rgba(255,255,255,.55)
    );
  padding:12px 16px;
  border-radius:var(--radius);
  border:1px solid var(--border);
  box-shadow:
    inset 0 1px 0 #fff,
    0 10px 25px rgba(0,0,0,.2);
  font-size:12px;
}

#legende span{
  display:inline-block;
  width:10px;
  height:10px;
  border-radius:50%;
  margin-right:6px;
}

.bleu{background:var(--blue)}
.rouge{background:var(--red)}

.axe{
  margin-top:6px;
  color:#35526b;
  font-style:italic;
}
</style>
</head>

<body>

<aside>
<h3>🌱 Facteurs du bonheur</h3>
<p>
Les curseurs influencent la ligne bleue.<br>
La stimulation évolue librement.
</p>

<div class="control">Sommeil<input id="sommeil" type="range" min="0" max="1" step="0.01" value="0.5"></div>
<div class="control">Nourriture<input id="nourriture" type="range" min="0" max="1" step="0.01" value="0.5"></div>
<div class="control">Soleil<input id="soleil" type="range" min="0" max="1" step="0.01" value="0.5"></div>
<div class="control">Musique<input id="musique" type="range" min="0" max="1" step="0.01" value="0.5"></div>
<div class="control">Sport<input id="sport" type="range" min="0" max="1" step="0.01" value="0.5"></div>
<div class="control">Imprévu<input id="imprevu" type="range" min="0" max="1" step="0.01" value="0.5"></div>
</aside>

<main>
<canvas id="c"></canvas>

<div id="etat">—</div>

<div id="legende">
  <div><span class="bleu"></span> Bonheur</div>
  <div><span class="rouge"></span> Stimulation</div>
  <div class="axe">Haut : + | Centre : neutre | Bas : –</div>
</div>
</main>

<script>
const c = document.getElementById("c");
const ctx = c.getContext("2d");
const etatBox = document.getElementById("etat");

function resize(){
  const r = devicePixelRatio || 1;
  c.width = c.clientWidth * r;
  c.height = c.clientHeight * r;
  ctx.setTransform(r,0,0,r,0,0);
}
resize();
addEventListener("resize", resize);

const mid = () => c.clientHeight/2;
const seuil = 40;

let x = 0;
let t = 0;

let yBonheur = mid();
let prevBonheur = yBonheur;

function bonheurImpact(){
  let d = 0;
  d += (sommeil.value-0.5)*1.4;
  d += (soleil.value-0.5)*1.3;
  d += (nourriture.value-0.5)*1.1;
  d += (musique.value-0.5)*0.6;
  d += (sport.value-0.5)*0.5;
  d -= (imprevu.value-0.5)*0.9;
  d += (mid()-yBonheur)/1000;
  return d*0.35;
}

function stimulationY(){
  return mid()
    + Math.sin(t*0.3)*95
    + Math.sin(t*0.12)*22;
}

function signe(y){
  if(y<mid()-seuil) return "+";
  if(y>mid()+seuil) return "-";
  return "0";
}

function definirEtat(b,s){
  if(b==="+"&&s==="-") return "Apaisement";
  if(b==="+"&&s==="+") return "Euphorie";
  if(b==="-"&&s==="+") return "Tension";
  if(b==="-"&&s==="-") return "Abattement";
  if(b==="0"&&s==="0") return "Stabilité";
  if(b==="+") return "Heureux";
  if(b==="−") return "Tristesse";
  if(s==="+") return "Stimulé";
  if(s==="-") return "Fatigue";
  return "—";
}

function loop(){
  ctx.fillStyle = "rgba(223,243,255,0.10)";
  ctx.fillRect(0,0,c.clientWidth,c.clientHeight);

  ctx.strokeStyle = "rgba(255,255,255,.8)";
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(0,mid());
  ctx.lineTo(c.clientWidth,mid());
  ctx.stroke();

  yBonheur += bonheurImpact();
  yBonheur = Math.max(30,Math.min(c.clientHeight-30,yBonheur));

  const yStim = stimulationY();
  t += 0.007;

  ctx.strokeStyle = "#2b8cff";
  ctx.lineWidth = 3.2;
  ctx.beginPath();
  ctx.moveTo(x-1,prevBonheur);
  ctx.lineTo(x,yBonheur);
  ctx.stroke();

  ctx.strokeStyle = "#ff4b4b";
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(x,yStim);
  ctx.lineTo(x+1,yStim);
  ctx.stroke();

  const b = signe(yBonheur);
  const s = signe(yStim);

  etatBox.innerHTML = `
    <div>${definirEtat(b,s)}</div>
    <div style="font-size:11px;color:#35526b;margin-top:4px">
      Bonheur ${b} | Stimulation ${s}
    </div>
  `;

  prevBonheur = yBonheur;
  x++;

  if(x>c.clientWidth){
    x=0;
    prevBonheur=yBonheur=mid();
  }

  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
