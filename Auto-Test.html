<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Courbes dynamiques – visibles</title>
  <style>
    :root{--bg:#fff;--panel:#f1f5f9;--c1:#2563eb;--c2:#dc2626;--axis:#94a3b8;--text:#0f172a}
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);display:flex;height:100vh}
    .controls{width:260px;padding:16px;background:var(--panel);border-right:1px solid #e2e8f0}
    .control{font-size:13px;margin-bottom:8px}
    canvas{flex:1}
  </style>
</head>
<body>
<aside class="controls">
  <div class="control">Imprévu <input id="imprevu" type="range" min="0" max="1" step="0.01" value="0"></div>
  <div class="control">Rejet <input id="rejet" type="range" min="0" max="1" step="0.01" value="0"></div>
  <div class="control">Sommeil <input id="sommeil" type="range" min="0" max="1" step="0.01" value="0.5"></div>
  <div class="control">Sport <input id="sport" type="range" min="0" max="1" step="0.01" value="0"></div>
  <div class="control">Musique <input id="musique" type="range" min="0" max="1" step="0.01" value="0"></div>
  <div class="control">Nourriture <input id="nourriture" type="range" min="0" max="1" step="0.01" value="0.5"></div>
  <div class="control">Soleil <input id="soleil" type="range" min="0" max="1" step="0.01" value="0"></div>
  <div class="control">Dehors <input id="dehors" type="range" min="0" max="1" step="0.01" value="0"></div>
</aside>
<canvas id="chart"></canvas>
<script>
const c=document.getElementById('chart');
const ctx=c.getContext('2d');
function resize(){c.width=c.clientWidth;c.height=c.clientHeight}
window.onresize=resize;resize();

let x=0;let y1=c.height/2;let y2=c.height/2;

function impact(){
  let d=0;
  d-=imprevu.value*2.5;
  d-=rejet.value*2;
  d+=(sommeil.value-0.5)*3;
  d+=sport.value*0.5;
  d+=(c.height/2-y1)/300*musique.value;
  if(nourriture.value<0.3)d-=1;
  d+=soleil.value*2;
  d+=dehors.value*1;
  return d;
}

function loop(){
  ctx.fillStyle='rgba(255,255,255,0.05)';
  ctx.fillRect(0,0,c.width,c.height);

  ctx.strokeStyle=axis='#94a3b8';
  ctx.beginPath();ctx.moveTo(0,c.height/2);ctx.lineTo(c.width,c.height/2);ctx.stroke();

  y1+=impact();
  y2+=(Math.random()-0.5)*1.5+(c.height/2-y2)/600;
  y1=Math.max(10,Math.min(c.height-10,y1));
  y2=Math.max(10,Math.min(c.height-10,y2));

  ctx.strokeStyle='#2563eb';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(x,y1);ctx.lineTo(x+1,y1);ctx.stroke();

  ctx.strokeStyle='#dc2626';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(x,y2);ctx.lineTo(x+1,y2);ctx.stroke();

  x+=1;if(x>c.width)x=0;
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
