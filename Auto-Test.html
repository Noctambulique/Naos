<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>État interne</title>

<style>
    body {
        font-family: serif;
        color: #111;
        max-width: 700px;
        margin: 80px auto;
        text-align: center;

        /* IMAGE DE FOND */
        background-image: url("Map/télécharger (35).jpg");
        background-size: cover;
        background-position: center;
        background-attachment: fixed;

        /* Effet de lisibilité */
        background-color: rgba(255, 255, 255, 0.85);
        background-blend-mode: lighten;
    }

    h1 {
        font-weight: normal;
        margin-bottom: 40px;
    }

    .bar-container {
        width: 100%;
        height: 12px;
        background: #eee;
        position: relative;
        margin: 40px 0;
    }

    .bar {
        height: 100%;
        width: 50%;
        background: #000;
        transition: width 0.4s ease;
    }

    .buttons {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-top: 30px;
    }

.buttons {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-top: 30px;
}

button {
    width: 100%;
    height: 48px;
    background: rgba(255,255,255,0.85);
    border: 1px solid #000;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
}

button:hover {
    background: #000;
    color: #fff;
}


    .label {
        margin-top: 15px;
        font-size: 14px;
        color: #333;
    }
</style>

</head>

<body>

<h1>État intérieur</h1>

<div class="bar-container">
    <div id="bar" class="bar"></div>
</div>

<div class="label" id="value">Niveau : 50%</div>

<div class="buttons">
    <!-- Positifs -->
<div class="buttons">
<div class="buttons">
    <button onclick="changeState(8)">Bon sommeil</button>
    <button onclick="changeState(3)">Bonne nourriture</button>
    <button onclick="changeState(4)">Musique</button>
    <button onclick="changeState(5)">Soleil</button>
    <button onclick="changeState(5)">Sport</button>

    <button onclick="changeState(-5)">Imprévu</button>
    <button onclick="changeState(-8)">Fatigue</button>
    <button onclick="changeState(-5)">Manque de temps</button>
</div>


<script>
    let value = 50;

    function changeState(amount) {
        value += amount;
        if (value > 100) value = 100;
        if (value < 0) value = 0;

        document.getElementById("bar").style.width = value + "%";
        document.getElementById("value").textContent = "Niveau : " + value + "%";
    }
</script>

</body>
</html>
