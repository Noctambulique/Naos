<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Courbes dynamiques</title>
  <style>
    :root {
      --bg: #ffffff;
      --panel: #f1f5f9;
      --curve1: #2563eb;
      --curve2: #dc2626;
      --axis: #94a3b8;
      --text: #0f172a;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Panneau de contrôle (gauche) */
    .controls {
      width: 220px;
      padding: 16px;
      background: var(--panel);
      border-right: 1px solid #e2e8f0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .controls h2 {
      margin: 0 0 8px 0;
      font-size: 16px;
      font-weight: 600;
    }

    .controls button {
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #cbd5f5;
      background: white;
      cursor: pointer;
      font-size: 14px;
    }

    .controls button:hover {
      background: #eef2ff;
    }

    /* Zone graphique */
    .chart-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

  <aside class="controls">
    <h2>Contrôles</h2>
    <!-- Boutons factices : comportement à définir plus tard -->
    <button id="btn-speed">Modifier vitesse</button>
    <button id="btn-amplitude">Modifier amplitude</button>
    <button id="btn-noise">Ajouter bruit</button>
  </aside>

  <main class="chart-container">
    <canvas id="chart"></canvas>
  </main>

  <script>
    const canvas = document.getElementById('chart');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = canvas.clientWidth * window.devicePixelRatio;
      canvas.height = canvas.clientHeight * window.devicePixelRatio;
      ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
    }

    window.addEventListener('resize', resize);
    resize();

    // Paramètres des courbes
    let time = 0;
    let speed = 0.02;
    let amplitude = 80;
    let noise = 0;

    // Gestion des boutons (logique minimale, modifiable)
    document.getElementById('btn-speed').onclick = () => {
      speed *= 1.3;
    };

    document.getElementById('btn-amplitude').onclick = () => {
      amplitude += 20;
    };

    document.getElementById('btn-noise').onclick = () => {
      noise = noise === 0 ? 10 : 0;
    };

    function drawAxes(width, height) {
      ctx.strokeStyle = '#94a3b8';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(40, height / 2);
      ctx.lineTo(width - 20, height / 2);
      ctx.stroke();
    }

    function drawCurve(color, fn) {
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.beginPath();

      const width = canvas.clientWidth;
      const height = canvas.clientHeight;
      const midY = height / 2;

      for (let x = 0; x < width; x++) {
        const y = fn(x);
        if (x === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }

      ctx.stroke();
    }

    function loop() {
      const width = canvas.clientWidth;
      const height = canvas.clientHeight;

      ctx.clearRect(0, 0, width, height);
      drawAxes(width, height);

      drawCurve('#2563eb', (x) => {
        return height / 2 + Math.sin(x * 0.02 + time) * amplitude
               + (Math.random() - 0.5) * noise;
      });

      drawCurve('#dc2626', (x) => {
        return height / 2 + Math.cos(x * 0.015 + time * 1.3) * (amplitude * 0.7)
               + (Math.random() - 0.5) * noise;
      });

      time += speed;
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
