<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>État dynamique – lisible</title>
  <style>
    :root{
      --bg:#f8fafc;
      --panel:#ffffff;
      --c1:#2563eb;
      --c2:#dc2626;
      --axis:#94a3b8;
      --text:#0f172a;
      --muted:#64748b;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
      background:var(--bg);
      color:var(--text);
      display:flex;
      height:100vh;
      overflow:hidden;
    }
    aside{
      width:300px;
      padding:18px;
      background:var(--panel);
      border-right:1px solid #e2e8f0;
      box-shadow:2px 0 8px rgba(0,0,0,.04);
      display:flex;
      flex-direction:column;
      gap:14px;
    }
    h2{margin:0;font-size:16px}
    .control{font-size:13px}
    .control label{display:flex;justify-content:space-between;margin-bottom:4px;color:var(--muted)}
    input[type=range]{width:100%}
    main{flex:1;position:relative}
    canvas{width:100%;height:100%}
    .legend{
      position:absolute;top:12px;left:12px;
      background:rgba(255,255,255,.85);
      backdrop-filter:blur(6px);
      padding:8px 12px;border-radius:10px;
      font-size:12px;color:var(--muted)
    }
  </style>
</head>
<body>
<aside>
  <h2>Facteurs (neutre au centre)</h2>
  <div class="control"><label>Imprévu <span>–</span></label><input id="imprevu" type="range" min="0" max="1" step="0.01" value="0.5"></div>
  <div class="control"><label>Rejet social</label><input id="rejet" type="range" min="0" max="1" step="0.01" value="0.5"></div>
  <div class="control"><label>Sommeil</label><input id="sommeil" type="range" min="0" max="1" step="0.01" value="0.5"></div>
  <div class="control"><label>Sport</label><input id="sport" type="range" min="0" max="1" step="0.01" value="0.5"></div>
  <div class="control"><label>Musique</label><input id="musique" type="range" min="0" max="1" step="0.01" value="0.5"></div>
  <div class="control"><label>Nourriture</label><input id="nourriture" type="range" min="0" max="1" step="0.01" value="0.5"></div>
  <div class="control"><label>Soleil</label><input id="soleil" type="range" min="0" max="1" step="0.01" value="0.5"></div>
  <div class="control"><label>Dehors</label><input id="dehors" type="range" min="0" max="1" step="0.01" value="0.5"></div>
</aside>
<main>
  <canvas id="chart"></canvas>
  <div class="legend">
    ↑ ça va<br>— état neutre<br>↓ ça ne va pas
  </div>
</main>
<script>
const canvas=document.getElementById('chart');
const ctx=canvas.getContext('2d');

function resize(){
  const r=window.devicePixelRatio||1;
  canvas.width=canvas.clientWidth*r;
  canvas.height=canvas.clientHeight*r;
  ctx.setTransform(r,0,0,r,0,0);
}
window.addEventListener('resize',resize);resize();

let x=0;
let y1=canvas.clientHeight/2;
let y2=canvas.clientHeight/2;
let prevY1=y1, prevY2=y2;

function impact(){
  let d=0;
  d+=(sommeil.value-0.5)*3;
  d+=(sport.value-0.5)*0.8;
  d+=(soleil.value-0.5)*2.5;
  d+=(dehors.value-0.5)*1.2;
  d-=(0.5-imprevu.value)*2;
  d-=(0.5-rejet.value)*1.8;
  if(nourriture.value<0.4)d-=(0.4-nourriture.value)*3;
  d+=(canvas.clientHeight/2-y1)/350*musique.value;
  return d;
}

function loop(){
  ctx.fillStyle='rgba(248,250,252,0.04)';
  ctx.fillRect(0,0,canvas.clientWidth,canvas.clientHeight);

  const mid=canvas.clientHeight/2;
  ctx.strokeStyle='#94a3b8';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(0,mid);ctx.lineTo(canvas.clientWidth,mid);ctx.stroke();

  y1+=impact();
  y2+=(Math.random()-0.5)*1.2+(mid-y2)/600;

  y1=Math.max(20,Math.min(canvas.clientHeight-20,y1));
  y2=Math.max(20,Math.min(canvas.clientHeight-20,y2));

  ctx.strokeStyle='#2563eb';ctx.lineWidth=2.5;
  ctx.beginPath();ctx.moveTo(x-1,prevY1);ctx.lineTo(x,y1);ctx.stroke();

  ctx.strokeStyle='#dc2626';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(x-1,prevY2);ctx.lineTo(x,y2);ctx.stroke();

  prevY1=y1; prevY2=y2;
  x+=1;
  if(x>canvas.clientWidth){x=0;prevY1=y1=mid;prevY2=y2=mid;}
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
