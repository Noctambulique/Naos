<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Modèle dynamique – Santé mentale</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  margin: 0;
  font-family: system-ui, sans-serif;
  background: #0f172a;
  color: #e5e7eb;
  display: flex;
  height: 100vh;
}

#controls {
  width: 260px;
  padding: 20px;
  background: #020617;
  box-shadow: inset -1px 0 0 #1e293b;
}

.control {
  margin-bottom: 18px;
}

label {
  display: block;
  font-size: 13px;
  margin-bottom: 6px;
  opacity: 0.85;
}

input[type="range"] {
  width: 100%;
}

#canvas-container {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
}

canvas {
  background: #020617;
  border-radius: 12px;
}
</style>
</head>

<body>

<div id="controls"></div>

<div id="canvas-container">
  <canvas id="graph" width="900" height="500"></canvas>
</div>

<script>
/* ===========================
   1) PARAMÈTRES PSYCHOLOGIQUES
   =========================== */

/*
Chaque paramètre :
- label : texte affiché
- value : valeur initiale du curseur
- impact : influence sur les courbes
  - curve1 : poids sur la courbe A
  - curve2 : poids sur la courbe B
*/

const PARAMETERS = {
  sleep: {
    label: "Sommeil",
    value: 70,
    impact: { curve1: 0.6, curve2: 0.3 }
  },
  nutrition: {
    label: "Nutrition",
    value: 60,
    impact: { curve1: 0.3, curve2: 0.5 }
  },
  stress: {
    label: "Stress",
    value: 40,
    impact: { curve1: -0.7, curve2: -0.4 }
  },
  social: {
    label: "Interactions sociales",
    value: 50,
    impact: { curve1: 0.5, curve2: 0.2 }
  },
  meaning: {
    label: "Sens / Motivation",
    value: 55,
    impact: { curve1: 0.2, curve2: 0.6 }
  }
};

/* ===========================
   2) CONFIGURATION GLOBALE
   =========================== */

const TIME_STEP = 0.02;      // vitesse d’avancement du temps
const BASE_DRIFT = 0.02;    // tendance naturelle (inertie psychique)
const SMOOTHING = 0.03;     // inertie émotionnelle

/* ===========================
   3) INITIALISATION UI
   =========================== */

const controls = document.getElementById("controls");

for (const key in PARAMETERS) {
  const p = PARAMETERS[key];

  const div = document.createElement("div");
  div.className = "control";

  const label = document.createElement("label");
  label.textContent = p.label;

  const input = document.createElement("input");
  input.type = "range";
  input.min = 0;
  input.max = 100;
  input.value = p.value;

  input.oninput = () => {
    p.value = Number(input.value);
  };

  div.appendChild(label);
  div.appendChild(input);
  controls.appendChild(div);
}

/* ===========================
   4) MOTEUR DES COURBES
   =========================== */

const canvas = document.getElementById("graph");
const ctx = canvas.getContext("2d");

let t = 0;
let curve1 = 0;
let curve2 = 0;

const history1 = [];
const history2 = [];
const MAX_POINTS = canvas.width;

function computeInfluence() {
  let inf1 = 0;
  let inf2 = 0;

  for (const key in PARAMETERS) {
    const p = PARAMETERS[key];
    const normalized = (p.value - 50) / 50; // -1 → +1

    inf1 += normalized * p.impact.curve1;
    inf2 += normalized * p.impact.curve2;
  }

  return { inf1, inf2 };
}

function update() {
  const { inf1, inf2 } = computeInfluence();

  curve1 += (inf1 - curve1) * SMOOTHING + BASE_DRIFT;
  curve2 += (inf2 - curve2) * SMOOTHING + BASE_DRIFT;

  history1.push(curve1);
  history2.push(curve2);

  if (history1.length > MAX_POINTS) {
    history1.shift();
    history2.shift();
  }

  t += TIME_STEP;
}

/* ===========================
   5) RENDU VISUEL
   =========================== */

function drawCurve(data, color) {
  ctx.beginPath();
  ctx.strokeStyle = color;
  ctx.lineWidth = 2;

  data.forEach((v, i) => {
    const x = i;
    const y = canvas.height / 2 - v * 80;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  });

  ctx.stroke();
}

function render() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Axe central
  ctx.strokeStyle = "#1e293b";
  ctx.beginPath();
  ctx.moveTo(0, canvas.height / 2);
  ctx.lineTo(canvas.width, canvas.height / 2);
  ctx.stroke();

  drawCurve(history1, "#38bdf8"); // courbe A
  drawCurve(history2, "#f472b6"); // courbe B
}

/* ===========================
   6) BOUCLE TEMPORELLE
   =========================== */

function loop() {
  update();
  render();
  requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
