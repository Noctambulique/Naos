<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Courbes dynamiques – états</title>
  <style>
    :root{
      --bg:#ffffff;--panel:#f1f5f9;--c1:#2563eb;--c2:#dc2626;--axis:#94a3b8;--text:#0f172a
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);display:flex;height:100vh;overflow:hidden}
    .controls{width:260px;padding:16px;background:var(--panel);border-right:1px solid #e2e8f0;display:flex;flex-direction:column;gap:10px}
    .controls h2{margin:0 0 6px;font-size:15px;font-weight:600}
    .control{font-size:13px}
    .control label{display:flex;justify-content:space-between}
    .control input{width:100%}
    .chart-container{flex:1;display:flex}
    canvas{width:100%;height:100%}
  </style>
</head>
<body>
  <aside class="controls">
    <h2>Facteurs (courbe 1)</h2>
    <div class="control"><label>Imprévu <span id="v0"></span></label><input type="range" min="0" max="1" step="0.01" value="0" id="imprevu"></div>
    <div class="control"><label>Rejet social <span id="v1"></span></label><input type="range" min="0" max="1" step="0.01" value="0" id="rejet"></div>
    <div class="control"><label>Sommeil <span id="v2"></span></label><input type="range" min="0" max="1" step="0.01" value="0.5" id="sommeil"></div>
    <div class="control"><label>Sport <span id="v3"></span></label><input type="range" min="0" max="1" step="0.01" value="0" id="sport"></div>
    <div class="control"><label>Musique <span id="v4"></span></label><input type="range" min="0" max="1" step="0.01" value="0" id="musique"></div>
    <div class="control"><label>Nourriture <span id="v5"></span></label><input type="range" min="0" max="1" step="0.01" value="0.5" id="nourriture"></div>
    <div class="control"><label>Soleil <span id="v6"></span></label><input type="range" min="0" max="1" step="0.01" value="0" id="soleil"></div>
    <div class="control"><label>Dehors <span id="v7"></span></label><input type="range" min="0" max="1" step="0.01" value="0" id="dehors"></div>
  </aside>
  <main class="chart-container"><canvas id="chart"></canvas></main>

<script>
const canvas=document.getElementById('chart');
const ctx=canvas.getContext('2d');
function resize(){const r=window.devicePixelRatio||1;canvas.width=canvas.clientWidth*r;canvas.height=canvas.clientHeight*r;ctx.setTransform(r,0,0,r,0,0)}
window.addEventListener('resize',resize);resize();

let x=0;const step=1;const mid=()=>canvas.clientHeight/2;
let y1=mid(),y2=mid();

const sliders={imprevu,rejet,sommeil,sport,musique,nourriture,soleil,dehors};
Object.values(sliders).forEach(s=>s.oninput=()=>updateLabels());
function updateLabels(){Object.values(sliders).forEach((s,i)=>document.getElementById('v'+i).textContent=s.value)}updateLabels();

function impactCourbe1(){
  let dy=0;
    let dy=0;
  dy-= sliders.imprevu.value*3;                  // choc négatif fort mais contenu
  dy-= sliders.rejet.value*2.5;                  // rejet social
  dy+= (sliders.sommeil.value-0.5)*4;            // sommeil majeur mais borné
  dy+= sliders.sport.value*0.6;                  // sport léger
  dy+= (mid()-y1)/300*sliders.musique.value;    // musique : recentrage doux
  if(sliders.nourriture.value<0.3) dy-=1.5;      // nourriture critique
  dy+= sliders.soleil.value*2.5;                 // soleil positif, transitoire
  dy+= sliders.dehors.value*1.2;                 // dehors moyen
  return dy;
}

function loop(){
  ctx.fillStyle='rgba(255,255,255,0.03)';         // trace plus longue         // effacement progressif
  ctx.fillRect(0,0,canvas.clientWidth,canvas.clientHeight);

  // axes et indications
  ctx.strokeStyle='#94a3b8';ctx.lineWidth=1;
  ctx.beginPath();
  ctx.moveTo(0,mid());ctx.lineTo(canvas.clientWidth,mid());
  ctx.stroke();

  ctx.fillStyle='#64748b';ctx.font='12px system-ui';
  ctx.fillText('Ça va ↑',8,mid()-8);
  ctx.fillText('Ça ne va pas ↓',8,mid()+18);

  // courbe 1 (pilotée)
  y1+=impactCourbe1();
  y1=Math.max(20,Math.min(canvas.clientHeight-20,y1));

  // courbe 2 (dérive aléatoire)
  y2+= (Math.random()-0.5)*2 + (mid()-y2)/500;()-0.5)*3 + (mid()-y2)/400;

  ctx.fillStyle='#2563eb';ctx.fillRect(x,y1,2,2);
  ctx.fillStyle='#dc2626';ctx.fillRect(x,y2,2,2);

  x+=step;
  if(x>canvas.clientWidth){x=0;y1=mid();y2=mid();}
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
