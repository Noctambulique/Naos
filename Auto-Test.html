<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>État intérieur</title>

<style>
    body {
        font-family: serif;
        color: #111;
        max-width: 700px;
        margin: 80px auto;
        text-align: center;

        background-image: url("Map/télécharger (35).jpg");
        background-size: cover;
        background-position: center;
        background-attachment: fixed;

        background-color: rgba(255, 255, 255, 0.65);
        background-blend-mode: overlay;
    }

    h1 {
        font-weight: normal;
        margin-bottom: 40px;
    }

    .bar-container {
        width: 100%;
        height: 12px;
        background: rgba(0,0,0,0.15);
        margin: 35px 0 8px;
    }

    .bar {
        height: 100%;
        width: 50%;
        background: #000;
        transition: width 0.4s ease;
    }

    .label {
        font-size: 14px;
        color: #222;
        margin-bottom: 15px;
    }

    .buttons {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 14px;
        margin-top: 40px;
    }

    button {
        height: 50px;
        background: rgba(255,255,255,0.75);
        border: 1px solid rgba(0,0,0,0.4);
        font-size: 14px;
        cursor: pointer;
        transition: all 0.25s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        backdrop-filter: blur(2px);
    }

    button:hover {
        background: rgba(0,0,0,0.85);
        color: white;
    }

    button.active {
        background: #000;
        color: #fff;
    }
</style>
</head>

<body>

<h1>État intérieur</h1>

<!-- Adéquation -->
<div class="bar-container">
    <div id="adequation" class="bar"></div>
</div>
<div class="label">Adéquation avec soi : <span id="adequationValue">50%</span></div>

<!-- Résilience -->
<div class="bar-container">
    <div id="resilience" class="bar"></div>
</div>
<div class="label">Résilience : <span id="resilienceValue">50%</span></div>

<!-- Motivation -->
<div class="bar-container">
    <div id="motivation" class="bar"></div>
</div>
<div class="label">Motivation : <span id="motivationValue">50%</span></div>

<!-- Clarté mentale -->
<div class="bar-container">
    <div id="clarte" class="bar"></div>
</div>
<div class="label">Clarté mentale : <span id="clarteValue">50%</span></div>

<!-- Boutons -->
<div class="buttons">
    <button
        data-adequation="10"
        data-resilience="5"
        data-motivation="15"
        data-clarte="5">
        Bon sommeil
    </button>

    <button
        data-adequation="5"
        data-resilience="0"
        data-motivation="10"
        data-clarte="15">
        Bonne nourriture
    </button>

    <button
        data-adequation="5"
        data-resilience="10"
        data-motivation="10"
        data-clarte="0">
        Sport
    </button>

    <button
        data-adequation="0"
        data-resilience="5"
        data-motivation="15"
        data-clarte="10">
        Musique
    </button>

    <button
        data-adequation="10"
        data-resilience="15"
        data-motivation="5"
        data-clarte="10">
        Voir des amis
    </button>

    <button
        data-adequation="-10"
        data-resilience="-20"
        data-motivation="-15"
        data-clarte="-25">
        Fatigue
    </button>

    <button
        data-adequation="-15"
        data-resilience="-10"
        data-motivation="-10"
        data-clarte="-5">
        Manque de temps
    </button>

    <button
        data-adequation="-20"
        data-resilience="-15"
        data-motivation="-20"
        data-clarte="-15">
        Imprévu
    </button>
</div>

<script>
    const bars = {
        adequation: 50,
        resilience: 50,
        motivation: 50,
        clarte: 50
    };

    function clamp(value) {
        return Math.max(0, Math.min(100, value));
    }

    function updateUI() {
        for (const key in bars) {
            bars[key] = clamp(bars[key]);
            document.getElementById(key).style.width = bars[key] + "%";
            document.getElementById(key + "Value").textContent = bars[key] + "%";
        }
    }

    document.querySelectorAll("button").forEach(button => {
        button.addEventListener("click", () => {

            const active = button.classList.toggle("active");

            for (const key in bars) {
                const delta = parseInt(button.dataset[key] || 0);
                bars[key] += active ? delta : -delta;
            }

            updateUI();
        });
    });

    updateUI();
</script>

</body>
</html>
