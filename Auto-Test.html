<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>État intérieur</title>

<style>
    body {
        font-family: serif;
        color: #111;
        max-width: 700px;
        margin: 80px auto;
        text-align: center;

        background-image: url("Map/télécharger (35).jpg");
        background-size: cover;
        background-position: center;
        background-attachment: fixed;

        background-color: rgba(255, 255, 255, 0.65);
        background-blend-mode: overlay;
    }

    h1 {
        font-weight: normal;
        margin-bottom: 40px;
    }

    .bar-container {
        width: 100%;
        height: 12px;
        background: rgba(0,0,0,0.15);
        margin: 40px 0;
    }

    .bar {
        height: 100%;
        width: 50%;
        background: #000;
        transition: width 0.4s ease;
    }

    .buttons {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 14px;
        margin-top: 30px;
    }

    button {
        height: 50px;
        background: rgba(255,255,255,0.75);
        border: 1px solid rgba(0,0,0,0.4);
        font-size: 14px;
        cursor: pointer;
        transition: all 0.25s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        backdrop-filter: blur(2px);
    }

    button:hover {
        background: rgba(0,0,0,0.85);
        color: white;
    }

    button.active {
        background: #000;
        color: #fff;
    }

    .label {
        margin-top: 15px;
        font-size: 14px;
        color: #222;
    }
</style>
</head>

<body>

<h1>État intérieur</h1>

<div class="bar-container">
    <div id="bar" class="bar"></div>
</div>

<div class="label" id="value">Niveau : 50%</div>

<div class="buttons">
    <button data-value="20">Bon sommeil</button>
    <button data-value="10">Bonne nourriture</button>
    <button data-value="15">Musique</button>
    <button data-value="25">Soleil</button>
    <button data-value="10">Sport</button>
    <button data-value="-25">Ne pas résoudre un problème</button>
    <button data-value="10">Voir des gens</button>

    <button data-value="-20">Imprévu</button>
    <button data-value="-35">Fatigue</button>
    <button data-value="-10">Manque de temps</button>
    <button data-value="10">Avoir rigolé</button>
    <button data-value="-10">Manque de diversité</button>
    <button data-value="15">Voir des amis</button>

    <!-- 🔹 Bouton spécial -->
    <button data-special="snap50">Réel insta</button>
</div>

<script>
    let value = 50;

    document.querySelectorAll("button").forEach(button => {
        button.addEventListener("click", () => {

            /* 🔹 Bouton spécial : Réel insta */
            if (button.dataset.special === "snap50") {
                const diff = 50 - value;

                if (Math.abs(diff) <= 15) {
                    value = 50;
                } else {
                    value += diff > 0 ? 15 : -15;
                }

                button.classList.add("active");
                setTimeout(() => button.classList.remove("active"), 300);

            } else {
                /* 🔹 Boutons classiques */
                const delta = parseInt(button.dataset.value);
                const active = button.classList.toggle("active");

                value += active ? delta : -delta;
            }

            value = Math.max(0, Math.min(100, value));

            document.getElementById("bar").style.width = value + "%";
            document.getElementById("value").textContent = "Niveau : " + value + "%";
        });
    });
</script>

</body>
</html>
