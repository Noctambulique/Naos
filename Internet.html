<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Interface Organique Numérique</title>

<style>
/* ------------------ FOND GÉNÉRAL ------------------ */
body {
    margin: 0;
    min-height: 100vh;
    font-family: "Segoe UI", Tahoma, sans-serif;
    color: #0a2a1f;
    background:
        radial-gradient(circle at 20% 30%, rgba(255,255,255,0.35), transparent 40%),
        radial-gradient(circle at 80% 60%, rgba(255,255,255,0.25), transparent 45%),
        linear-gradient(to bottom, #bfe8ff 0%, #c6f2c6 60%, #8fd6a3 100%);
    overflow-x: hidden;
}

/* ------------------ DÉCOR AQUATIQUE ------------------ */
.bubble {
    position: absolute;
    border-radius: 50%;
    background: rgba(255,255,255,0.25);
    border: 1px solid rgba(255,255,255,0.4);
    filter: blur(0.5px);
}

.bubble.b1 { width: 80px; height: 80px; top: 20%; left: 10%; }
.bubble.b2 { width: 40px; height: 40px; top: 65%; left: 70%; }
.bubble.b3 { width: 120px; height: 120px; top: 40%; left: 80%; }

.fish {
    position: absolute;
    width: 60px;
    height: 20px;
    background: linear-gradient(to right, #4fd1c5, #81e6d9);
    border-radius: 20px 40px 40px 20px;
    opacity: 0.6;
}
.fish::after {
    content: "";
    position: absolute;
    right: -10px;
    top: 5px;
    width: 0;
    height: 0;
    border-top: 5px solid transparent;
    border-bottom: 5px solid transparent;
    border-left: 10px solid #4fd1c5;
}
.fish.f1 { top: 30%; left: 60%; }
.fish.f2 { top: 55%; left: 20%; }

/* ------------------ CONTENEUR DES CASES ------------------ */
.container {
    position: relative;
    max-width: 900px;
    margin: 80px auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 20px;
    padding: 20px;
}

/* ------------------ CASES ------------------ */
.box {
    background: linear-gradient(
        to bottom,
        rgba(255,255,255,0.55),
        rgba(230,255,240,0.65)
    );
    border-radius: 14px;
    padding: 16px;
    box-shadow:
        inset 0 0 10px rgba(255,255,255,0.6),
        0 8px 20px rgba(0,0,0,0.08);
    backdrop-filter: blur(6px);
    transition: transform 0.2s ease;
}

.box:hover {
    transform: translateY(-4px);
}

.box a {
    text-decoration: none;
    color: #0c3b2e;
    font-weight: 500;
    font-size: 14px;
    line-height: 1.4;
}
</style>
</head>

<body>

<!-- éléments décoratifs -->
<div class="bubble b1"></div>
<div class="bubble b2"></div>
<div class="bubble b3"></div>

<div class="fish f1"></div>
<div class="fish f2"></div>

<!-- CONTENU -->
<div class="container">

    <div class="box">
        <a href="https://example.com">
            Archive personnelle – journal cognitif
        </a>
    </div>

    <div class="box">
        <a href="https://example.com">
            Cartographie émotionnelle quotidienne
        </a>
    </div>

    <div class="box">
        <a href="https://example.com">
            Notes sur l’observation du comportement
        </a>
    </div>

    <!-- Duplique simplement ce bloc pour en ajouter -->
    <div class="box">
        <a href="https://example.com">
            Dossier expérimental n°12
        </a>
    </div>

</div>

</body>
</html>
