<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Interface Frutiger Aero</title>

<link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@300;400;600&display=swap" rel="stylesheet">

<style>

/* ───────────── BASE GLOBALE ───────────── */

html, body {
  margin: 0;
  height: 100%;
  font-family: "Segoe UI", system-ui, sans-serif;
  background:
    radial-gradient(circle at top, #dff3ff 0%, #b7e3ff 40%, #9fd0e8 100%);
  overflow: hidden;
  color: #0f2a3a;
}

/* texture atmosphérique légère */
body::before {
  content:"";
  position:fixed;
  inset:0;
  background:
    url("https://i.imgur.com/8JZ8YwQ.png"); /* texture eau très fine */
  opacity:0.15;
  pointer-events:none;
}

/* bulles décoratives */
body::after {
  content:"";
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at 20% 30%, rgba(255,255,255,0.35), transparent 200px),
    radial-gradient(circle at 80% 60%, rgba(255,255,255,0.25), transparent 260px);
  pointer-events:none;
}

/* ───────────── PANNEAU PRINCIPAL ───────────── */

.panel {
  position:absolute;
  inset:70px 90px;
  border-radius:28px;

  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,0.55),
      rgba(220,245,255,0.45)
    );

  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);

  border:1px solid rgba(255,255,255,0.6);

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.8),
    0 30px 70px rgba(0,80,120,0.25);

  display:flex;
  justify-content:center;
  align-items:center;
}

/* ───────────── GRILLE ───────────── */

.grid {
  display:grid;
  grid-template-columns:repeat(3, 220px);
  gap:30px;
}

/* ───────────── TUILES ───────────── */

.tile {
  height:120px;
  border-radius:18px;

  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,0.95),
      rgba(210,240,255,0.75)
    );

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.9),
    0 15px 35px rgba(0,120,180,0.35);

  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;

  font-size:18px;
  font-weight:500;
  color:#0c3b52;

  transition:all .35s ease;
  position:relative;
  overflow:hidden;
}

/* reflet verre */
.tile::before {
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(
    120deg,
    rgba(255,255,255,0.65),
    rgba(255,255,255,0.05) 60%
  );
  opacity:.6;
  pointer-events:none;
}

/* effet au survol */
.tile:hover {
  transform: translateY(-6px) scale(1.02);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.9),
    0 25px 60px rgba(0,140,200,0.45);
}

/* sous-texte optionnel */
.tile small {
  margin-top:6px;
  font-size:12px;
  opacity:.65;
}

</style>
</head>

<body>

<div class="panel">
  <div class="grid">
    <div class="tile">Mail<small>Messages & échanges</small></div>
    <div class="tile">Calendrier<small>Temps & événements</small></div>
    <div class="tile">Chat<small>Communication</small></div>
    <div class="tile">Documents<small>Données personnelles</small></div>
    <div class="tile">Archives<small>Mémoire numérique</small></div>
    <div class="tile">Paramètres<small>Configuration</small></div>
  </div>
</div>

</body>
</html>
