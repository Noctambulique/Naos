<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grille Aero+</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>
:root{
  --bg1:#e8f1fb;
  --bg2:#cbdcf2;

  --glass: rgba(255,255,255,.55);
  --glass-soft: rgba(255,255,255,.35);
  --glass-strong: rgba(255,255,255,.75);

  --border: rgba(140,180,230,.45);
  --highlight: rgba(255,255,255,.9);

  --shadow-strong: 0 22px 40px rgba(0,60,120,.35);
  --shadow-soft: 0 10px 22px rgba(0,60,120,.22);

  --radius:16px;
  --text:#0b2a44;
  --muted:#5f7c99;
}

html{
  height:100%;
  background:
    radial-gradient(circle at top, #f7fbff 0%, transparent 65%),
    linear-gradient(180deg, var(--bg1), var(--bg2));
}

html::before{
  content:"";
  position:fixed;
  inset:0;
  background:url("https://uploads-ssl.webflow.com/5fbd9e08b4374f52b8cf23a0/6032e8dce1e52e2b63d72692_noise.png");
  opacity:.05;
  pointer-events:none;
}

body{
  margin:0;
  padding:20px 24px;
  font-family:"Inter", system-ui, sans-serif;
  color:var(--text);
}

/* ───────────── GRILLES ───────────── */

.grid-wrap{
  max-width:1200px;
  margin:auto;
}

.grid-main{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
  gap:18px;
  margin-bottom:26px;
}

.grid-secondary{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(110px,1fr));
  gap:12px;
  opacity:.92;
}

/* ───────────── CASES PRINCIPALES ───────────── */

.box{
  position:relative;
  height:140px;
  border-radius:var(--radius);
  background:
    linear-gradient(180deg,rgba(255,255,255,.9),rgba(255,255,255,.35)),
    var(--glass);
  backdrop-filter: blur(14px) saturate(1.4);
  border:1px solid var(--border);
  box-shadow:
    inset 0 1px 0 var(--highlight),
    var(--shadow-strong);
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  cursor:pointer;
  transition:.25s ease;
}

.box::after{
  content:"";
  position:absolute;
  inset:2px;
  border-radius:inherit;
  background:linear-gradient(135deg,rgba(255,255,255,.35),transparent 60%);
  pointer-events:none;
}

.box:hover{
  transform:translateY(-4px);
  box-shadow:0 25px 45px rgba(0,80,160,.45);
}

.content{
  font-size:20px;
  font-weight:500;
  padding:12px;
}

/* ───────────── CASES SECONDAIRES ───────────── */

.small{
  height:90px;
  border-radius:12px;
  background:
    linear-gradient(180deg,rgba(255,255,255,.65),rgba(255,255,255,.25));
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.7),
    0 8px 18px rgba(0,60,120,.25);
  font-size:15px;
}

.small .content{
  font-size:15px;
  color:var(--muted);
}

/* Interaction */
.box:active{ transform:translateY(1px); }
</style>
</head>

<body>

<div class="grid-wrap">

  <!-- PRINCIPAL -->
  <div class="grid-main">
    <div class="box" onclick="openSite('https://mail.google.com')"><div class="content">Mail</div></div>
    <div class="box" onclick="openSite('https://calendar.google.com')"><div class="content">Calendrier</div></div>
    <div class="box" onclick="openSite('https://chatgpt.com')"><div class="content">ChatGPT</div></div>
    <div class="box" onclick="openSite('https://www.reddit.com')"><div class="content">Reddit</div></div>
    <div class="box" onclick="openSite('https://github.com')"><div class="content">GitHub</div></div>
  </div>

  <!-- SECONDAIRE -->
  <div class="grid-secondary">
    <div class="box small" onclick="openSite('https://pdf24.org')"><div class="content">PDF24</div></div>
    <div class="box small" onclick="openSite('https://framapad.org')"><div class="content">Framapad</div></div>
    <div class="box small" onclick="openSite('https://lelscans.net')"><div class="content">Scans</div></div>
    <div class="box small" onclick="openSite('https://drive.google.com')"><div class="content">Drive</div></div>
  </div>

</div>

<script>
function openSite(url){
  window.open(url,'_blank');
}
</script>

</body>
</html>
