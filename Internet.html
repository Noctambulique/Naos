<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Windows 6 — Nature Interface</title>

<style>
    /* ===== FOND GLOBAL ===== */
    body {
        margin: 0;
        padding: 0;
        font-family: "Segoe UI", Tahoma, Arial, sans-serif;
        background: linear-gradient(
            180deg,
            #cfe9f3 0%,
            #dff5e3 40%,
            #bfe3c6 100%
        );
        background-attachment: fixed;
        color: #1b2a1f;
    }

    /* LÉGER FLOU LUMINEUX AMBIANT */
    body::before {
        content: "";
        position: fixed;
        inset: 0;
        background: radial-gradient(circle at top, rgba(255,255,255,0.5), transparent 70%);
        pointer-events: none;
    }

    /* CONTENEUR PRINCIPAL */
    .desktop {
        max-width: 1100px;
        margin: 80px auto;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 22px;
        padding: 20px;
    }

    /* CASES */
    .tile {
        background: linear-gradient(
            180deg,
            rgba(255,255,255,0.75),
            rgba(220,240,225,0.85)
        );
        border-radius: 10px;
        border: 1px solid rgba(120,160,130,0.35);
        box-shadow:
            inset 0 1px 0 rgba(255,255,255,0.6),
            0 6px 16px rgba(0,0,0,0.12);
        padding: 16px;
        min-height: 120px;
        transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .tile:hover {
        transform: translateY(-3px);
        box-shadow:
            0 10px 22px rgba(0,0,0,0.18),
            inset 0 1px 0 rgba(255,255,255,0.8);
    }

    .tile h3 {
        margin: 0 0 6px 0;
        font-size: 16px;
        font-weight: 600;
        color: #1e3a2a;
    }

    .tile p {
        font-size: 13px;
        line-height: 1.4;
        color: #2f4a3a;
    }

    .tile a {
        display: inline-block;
        margin-top: 8px;
        font-size: 12px;
        color: #1b5f3a;
        text-decoration: none;
        border-bottom: 1px solid rgba(27,95,58,0.4);
    }

    .tile a:hover {
        color: #0f3b24;
        border-bottom-color: #0f3b24;
    }
</style>
</head>

<body>

<div class="desktop">

    <!-- CASE 1 -->
    <div class="tile">
        <h3>Journal interne</h3>
        <p>Notes quotidiennes sur l’état mental, la perception et l’énergie cognitive.</p>
        <a href="#">Ouvrir</a>
    </div>

    <!-- CASE 2 -->
    <div class="tile">
        <h3>Cartographie émotionnelle</h3>
        <p>Fragments d’observations émotionnelles classées par intensité.</p>
        <a href="#">Explorer</a>
    </div>

    <!-- CASE 3 -->
    <div class="tile">
        <h3>Archive biologique</h3>
        <p>Données lentes, cycles, rythmes, stabilité corporelle.</p>
        <a href="#">Accéder</a>
    </div>

    <!-- AJOUTER D’AUTRES CASES ICI -->
    <!--
    <div class="tile">
        <h3>Titre</h3>
        <p>Texte descriptif</p>
        <a href="#">Lien</a>
    </div>
    -->

</div>

</body>
</html>
