<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Interface Windows Classique</title>

<style>
    body {
        background-color: #c0c0c0;
        font-family: Tahoma, Verdana, Arial, sans-serif;
        margin: 0;
        padding: 30px;
    }

    .window {
        background: #d4d0c8;
        border: 2px solid #000;
        box-shadow: inset -2px -2px 0 #808080,
                    inset 2px 2px 0 #ffffff;
        padding: 16px;
        width: 900px;
        margin: auto;
    }

    .titlebar {
        background: linear-gradient(to right, #0a246a, #3a6ea5);
        color: white;
        font-weight: bold;
        padding: 6px 10px;
        margin-bottom: 12px;
        font-size: 14px;
    }

    .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 10px;
    }

    .box {
        background: #e4e4e4;
        border: 2px solid #000;
        box-shadow:
            inset -2px -2px 0 #7f7f7f,
            inset 2px 2px 0 #ffffff;
        padding: 10px;
        font-size: 13px;
        line-height: 1.3;
    }

    .box a {
        color: #0000ee;
        text-decoration: underline;
    }

    .box a:visited {
        color: #551a8b;
    }
</style>
</head>

<body>

<div class="window">
    <div class="titlebar">Dossier — Informations</div>

    <div class="grid">

        <!-- CASE 1 -->
        <div class="box">
            Texte libre ici.<br>
            <a href="https://example.com">Lien externe</a>
        </div>

        <!-- CASE 2 -->
        <div class="box">
            Autre contenu.<br>
            Tu peux écrire ce que tu veux.
        </div>

        <!-- CASE 3 -->
        <div class="box">
            Notes personnelles.<br>
            <a href="#">Lien interne</a>
        </div>

        <!-- AJOUTE AUTANT DE BLOCS QUE TU VEUX -->
        <div class="box">
            Nouvelle case ajoutée dans le code.
        </div>

    </div>
</div>

</body>
</html>
