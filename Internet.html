<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Interface Frutiger – Style Windows 7</title>

<style>
    body {
        margin: 0;
        padding: 40px;
        font-family: "Segoe UI", Tahoma, sans-serif;
        background: linear-gradient(#f2f5f7, #dfe4e8);
        color: #1e1e1e;
    }

    .container {
        max-width: 1100px;
        margin: auto;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 18px;
    }

    .tile {
        background: linear-gradient(#ffffff, #e9edf1);
        border: 1px solid #b9c2cc;
        box-shadow: inset 0 1px 0 #ffffff;
        padding: 16px;
        min-height: 110px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        transition: background 0.2s ease;
    }

    .tile:hover {
        background: linear-gradient(#f7f9fb, #e2e7ec);
    }

    .tile h3 {
        margin: 0 0 8px 0;
        font-size: 15px;
        font-weight: 600;
        color: #2a2a2a;
    }

    .tile p {
        font-size: 13px;
        line-height: 1.4;
        color: #3b3b3b;
        margin: 0;
    }

    .tile a {
        margin-top: 10px;
        font-size: 12px;
        color: #1a5fb4;
        text-decoration: none;
    }

    .tile a:hover {
        text-decoration: underline;
    }
</style>
</head>

<body>

<div class="container">

    <!-- CASE 1 -->
    <div class="tile">
        <h3>Module Alpha</h3>
        <p>Description textuelle libre. Contenu modifiable uniquement dans le code.</p>
        <a href="https://example.com">Ouvrir</a>
    </div>

    <!-- CASE 2 -->
    <div class="tile">
        <h3>Module Beta</h3>
        <p>Bloc d’information statique. Aucun réglage utilisateur.</p>
        <a href="https://example.com">Accéder</a>
    </div>

    <!-- CASE 3 -->
    <div class="tile">
        <h3>Données internes</h3>
        <p>Zone prévue pour affichage descriptif ou référentiel.</p>
        <a href="https://example.com">Voir plus</a>
    </div>

    <!-- AJOUTER D'AUTRES CASES ICI -->
    <!-- Copier / coller un bloc .tile -->

</div>

</body>
</html>
