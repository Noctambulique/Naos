<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Interface Frutiger Neutre</title>

<link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@300;400;600&display=swap" rel="stylesheet">

<style>

/* ───────────────────────── BASE ───────────────────────── */

html, body {
  margin: 0;
  height: 100%;
  font-family: "Segoe UI", system-ui, sans-serif;
  background:
    radial-gradient(circle at 50% 0%, #f1f1f1 0%, #d9d9d9 60%, #cfcfcf 100%);
  color:#1f1f1f;
  overflow:hidden;
}

/* grain très fin */
body::before{
  content:"";
  position:fixed;
  inset:0;
  background:url("https://uploads-ssl.webflow.com/5fbd9e08b4374f52b8cf23a0/6032e8dce1e52e2b63d72692_noise.png");
  opacity:.04;
  pointer-events:none;
}

/* ───────────────────────── CONTENEUR ───────────────────────── */

.panel {
  position:absolute;
  inset:60px 80px;
  border-radius:26px;
  background:
    linear-gradient(180deg,
      rgba(255,255,255,0.85),
      rgba(240,240,240,0.85)
    );

  border:1px solid rgba(255,255,255,0.6);

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.8),
    0 30px 60px rgba(0,0,0,0.25);

  display:flex;
  justify-content:center;
  align-items:center;
}

/* ───────────────────────── GRILLE ───────────────────────── */

.grid {
  display:grid;
  grid-template-columns:repeat(3, 220px);
  gap:28px;
}

/* ───────────────────────── TUILES ───────────────────────── */

.tile {
  height:110px;
  border-radius:16px;
  background:
    linear-gradient(180deg,
      rgba(255,255,255,0.95),
      rgba(230,230,230,0.85)
    );

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.9),
    0 12px 24px rgba(0,0,0,0.25);

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:18px;
  font-weight:500;
  color:#1e1e1e;

  transition:all .25s ease;
}

.tile:hover{
  transform:translateY(-4px);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.9),
    0 20px 40px rgba(0,0,0,0.35);
}

/* OPTION : texte plus discret */
.tile small {
  display:block;
  font-size:13px;
  opacity:.65;
}

</style>
</head>

<body>

<div class="panel">
  <div class="grid">
    <div class="tile">Mail</div>
    <div class="tile">Calendrier</div>
    <div class="tile">Chat</div>
    <div class="tile">Documents</div>
    <div class="tile">Archives</div>
    <div class="tile">Paramètres</div>
  </div>
</div>

</body>
</html>
