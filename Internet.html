<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Interface Frutiger Aero</title>

<style>
    /* --------- BASE GLOBALE --------- */
    body {
        margin: 0;
        padding: 60px;
        font-family: "Segoe UI", "Frutiger", Arial, sans-serif;
        background: linear-gradient(180deg, #cfe9ff 0%, #e8f6ff 40%, #ffffff 100%);
        color: #1b1b1b;
    }

    /* --------- CONTAINER PRINCIPAL --------- */
    .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 24px;
        max-width: 1200px;
        margin: auto;
    }

    /* --------- CASE FRUTIGER --------- */
    .tile {
        position: relative;
        padding: 18px 16px;
        border-radius: 14px;

        background: linear-gradient(
            180deg,
            rgba(255,255,255,0.85),
            rgba(220,240,255,0.85)
        );

        border: 1px solid rgba(255,255,255,0.9);
        box-shadow:
            inset 0 1px 0 rgba(255,255,255,0.9),
            0 6px 18px rgba(0, 90, 160, 0.15);

        backdrop-filter: blur(4px);
        transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .tile:hover {
        transform: translateY(-2px);
        box-shadow:
            inset 0 1px 0 rgba(255,255,255,1),
            0 10px 22px rgba(0, 90, 160, 0.25);
    }

    /* --------- TEXTE --------- */
    .tile h3 {
        margin: 0 0 8px 0;
        font-size: 15px;
        font-weight: 600;
        color: #1c3f5e;
    }

    .tile p {
        margin: 0;
        font-size: 13px;
        line-height: 1.4;
        color: #2b2b2b;
    }

    /* --------- LIEN --------- */
    .tile a {
        display: inline-block;
        margin-top: 10px;
        font-size: 12px;
        color: #0a5fd4;
        text-decoration: none;
    }

    .tile a:hover {
        text-decoration: underline;
    }
</style>
</head>

<body>

<div class="grid">

    <!-- CASE 1 -->
    <div class="tile">
        <h3>Journal cognitif</h3>
        <p>Notes quotidiennes sur l’état mental, la clarté et la charge cognitive.</p>
        <a href="journal.html">Ouvrir</a>
    </div>

    <!-- CASE 2 -->
    <div class="tile">
        <h3>Cartographie émotionnelle</h3>
        <p>Visualisation de tendances internes et variations d’humeur.</p>
        <a href="emotions.html">Explorer</a>
    </div>

    <!-- CASE 3 -->
    <div class="tile">
        <h3>Archives personnelles</h3>
        <p>Stockage structuré d’éléments de vie, pensées, fragments.</p>
        <a href="archives.html">Accéder</a>
    </div>

    <!-- AJOUTE AUTANT DE CASES QUE TU VEUX CI-DESSOUS -->
    <!--
    <div class="tile">
        <h3>Titre</h3>
        <p>Description</p>
        <a href="lien.html">Lien</a>
    </div>
    -->

</div>

</body>
</html>
