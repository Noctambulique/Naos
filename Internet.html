<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Interface Frutiger Organique</title>

<link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@300;400;600&display=swap" rel="stylesheet">

<style>

/* ─────────── BASE GLOBALE ─────────── */

html, body {
  margin: 0;
  height: 100%;
  font-family: "Segoe UI", system-ui, sans-serif;
  background:
    radial-gradient(circle at top,
      #f5ffe8 0%,
      #e2f2c8 45%,
      #d4e6b5 100%);
  overflow: hidden;
  color: #2a3a1f;
}

/* texture organique diffuse */
body::before {
  content:"";
  position:fixed;
  inset:0;
  background-image:
    url("https://i.imgur.com/0Jp4ZQq.png");
  opacity:0.12;
  pointer-events:none;
}

/* halo lumineux général */
body::after {
  content:"";
  position:fixed;
  inset:-20%;
  background:
    radial-gradient(circle at 50% 30%, rgba(255,255,255,0.45), transparent 60%);
  pointer-events:none;
}

/* ─────────── PANNEAU PRINCIPAL ─────────── */

.panel {
  position:absolute;
  inset:70px 90px;
  border-radius:32px;

  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,0.7),
      rgba(230,245,215,0.55)
    );

  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);

  border:1px solid rgba(255,255,255,0.7);

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.9),
    0 40px 80px rgba(120,160,80,0.35);

  display:flex;
  justify-content:center;
  align-items:center;
}

/* ─────────── GRILLE STYLE WINDOWS 7 ─────────── */

.grid {
  display:grid;
  grid-template-columns:repeat(3, 210px);
  gap:32px;
}

/* ─────────── TUILES ORGANIQUES ─────────── */

.tile {
  height:120px;
  border-radius:20px;

  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,0.85),
      rgba(210,240,190,0.75)
    );

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.9),
    0 18px 40px rgba(120,170,80,0.45);

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  font-size:18px;
  font-weight:500;
  color:#2f4a2a;

  position:relative;
  transition:all .35s ease;
}

/* reflet plastique */
.tile::before {
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(
    120deg,
    rgba(255,255,255,0.65),
    rgba(255,255,255,0.05) 60%
  );
  pointer-events:none;
}

/* effet survol "Windows 7" */
.tile:hover {
  transform: translateY(-6px) scale(1.03);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.9),
    0 30px 70px rgba(120,180,90,0.55);
}

/* sous-texte explicatif */
.tile small {
  margin-top:6px;
  font-size:12px;
  opacity:.7;
}

</style>
</head>

<body>

<div class="panel">
  <div class="grid">
    <div class="tile">Courrier<small>Messages personnels</small></div>
    <div class="tile">Agenda<small>Temps & rythme</small></div>
    <div class="tile">Contacts<small>Réseau humain</small></div>
    <div class="tile">Documents<small>Mémoire locale</small></div>
    <div class="tile">Archives<small>Historique vivant</small></div>
    <div class="tile">Préférences<small>Harmonie système</small></div>
  </div>
</div>

</body>
</html>
