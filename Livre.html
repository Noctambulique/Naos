<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Galerie</title>

<style>
  body{
    margin:0;
    padding:20px;
    background:linear-gradient(180deg, #2a80d7 0%, #0f4ea3 40%, #0e3569 100%);
    font-family:"Segoe UI", sans-serif;
    color:#fff;
    overflow-x:hidden;
  }

  h2{
    text-align:center;
    font-size:34px;
    font-weight:300;
    margin-bottom:25px;
    text-shadow:0 2px 8px rgba(0,0,0,0.7);
  }

  .zone{
    position:relative;
    width:100%;
    padding:40px 0;
    border-radius:18px;
    background:rgba(255,255,255,0.22);
    backdrop-filter:blur(14px) saturate(150%);
    -webkit-backdrop-filter:blur(14px) saturate(150%);
    border:1px solid rgba(255,255,255,0.55);
    box-shadow:
      inset 0 0 25px rgba(255,255,255,0.33),
      0 18px 35px rgba(0,0,0,0.45),
      0 0 40px rgba(40,130,255,0.35);
  }

  .zone img{
    position:absolute;
    max-width:260px;
    border-radius:8px;
    box-shadow:
      0 10px 25px rgba(0,0,0,0.65),
      0 0 15px rgba(160,200,255,0.35),
      inset 0 0 18px rgba(255,255,255,0.18);
    transform:rotate(-1deg);
    transition:transform 0.35s, filter 0.25s, box-shadow 0.3s;
    cursor:pointer;
    border:1px solid rgba(255,255,255,0.45);
  }

  .zone img:hover{
    transform:scale(1.2) rotate(1deg);
    filter:brightness(1.2);
    box-shadow:
      0 0 22px rgba(70,150,255,0.85),
      0 12px 35px rgba(0,0,0,0.55),
      inset 0 0 18px rgba(255,255,255,0.28);
    z-index:20;
  }

  /* ---------- TEXTE ---------- */
  #infoBox{
    position:fixed;
    bottom:40px;
    left:50%;
    transform:translateX(-50%);
    min-width:320px;
    max-width:600px;
    padding:22px 26px;
    background:rgba(255,255,255,0.22);
    backdrop-filter:blur(18px) saturate(160%);
    -webkit-backdrop-filter:blur(18px) saturate(160%);
    border:1px solid rgba(255,255,255,0.45);
    border-radius:18px;
    box-shadow:
      0 20px 40px rgba(0,0,0,0.45),
      inset 0 0 20px rgba(255,255,255,0.25);
    color:#fff;
    font-size:16px;
    line-height:1.6;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.35s ease, transform 0.35s ease;
  }

  #infoBox.active{
    opacity:1;
    pointer-events:auto;
    transform:translateX(-50%) translateY(-10px);
  }
</style>
</head>

<body>

<h2>Galerie Aero</h2>

<div class="zone" id="zone">

  <img src="D hiver/20200905_151240.jpg"
       data-text="Paysage hivernal silencieux.\nAtmosphère figée, presque irréelle.">

  <img src="D hiver/FB_IMG_1544732149112.jpg"
       data-text="Souvenir diffus.\nTexture froide.\nTemps suspendu.">

  <img src="D hiver/IMG_20210826_005412.jpg"
       data-text="Moment nocturne.\nPerception ralentie.\nPrésence intérieure.">

  <img src="D hiver/IMG_20211024_032129.jpg"
       data-text="Regard distant.\nLe monde devient surface.">

  <img src="D hiver/IMG_20211229_003419~2.jpg"
       data-text="Lumière d’hiver.\nSilence structuré.">

</div>

<div id="infoBox"><div id="infoContent"></div></div>

<script>
  const zone = document.getElementById("zone");
  const imgs = [...zone.querySelectorAll("img")];
  const infoBox = document.getElementById("infoBox");
  const infoContent = document.getElementById("infoContent");

  const cellW = 480;
  const cellH = 480;
  const zoneW = zone.clientWidth;
  const cols = Math.max(1, Math.floor(zoneW / cellW));

  zone.style.height = (Math.ceil(imgs.length / cols) * cellH + 300) + "px";

  async function layout(){
    let index = 0;
    for (const img of imgs){
      await img.decode();
      const col = index % cols;
      const row = Math.floor(index / cols);
      const baseX = col * cellW;
      const baseY = row * cellH;
      const maxOffsetX = Math.max(0, cellW - img.width - 80);
      const maxOffsetY = Math.max(0, cellH - img.height - 80);
      img.style.left = (baseX + Math.random() * maxOffsetX) + "px";
      img.style.top  = (baseY + Math.random() * maxOffsetY) + "px";
      index++;
    }
  }

  layout();

  imgs.forEach(img => {
    img.addEventListener("click", e => {
      e.stopPropagation();
      const raw = img.dataset.text || "";
      infoContent.innerHTML = raw.replace(/\n/g, "<br>");
      infoBox.classList.add("active");
    });
  });

  document.addEventListener("click", () => {
    infoBox.classList.remove("active");
  });
</script>

</body>
</html>
