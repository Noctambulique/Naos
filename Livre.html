<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Images → Texte</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f5f5f5;
        color: #111;
    }

    .gallery {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 20px;
        padding: 40px;
    }

    .item img {
        width: 100%;
        cursor: pointer;
    }

    .text-view {
        display: none;
        padding: 60px;
        max-width: 900px;
        margin: auto;
        line-height: 1.7;
        white-space: pre-wrap; /* sécurité supplémentaire */
    }

    .back {
        margin-bottom: 30px;
        cursor: pointer;
        text-decoration: underline;
        color: #444;
    }
</style>
</head>

<body>

<div class="gallery" id="gallery">

    <div class="item" onclick="openText(this)">
        <img src="image1.jpg">
        <div class="text" style="display:none;">
Premier paragraphe\n Deuxième paragraphe\n Troisième paragraphe plus long.
        </div>
    </div>

    <div class="item" onclick="openText(this)">
        <img src="image2.jpg">
        <div class="text" style="display:none;">
Un autre texte\n
Avec plusieurs lignes\n
Et une vraie respiration visuelle.
        </div>
    </div>

</div>

<div class="text-view" id="textView">
    <div class="back" onclick="closeText()">← Retour</div>
    <div id="textContent"></div>
</div>

<script>
function openText(element) {
    const rawText = element.querySelector(".text").innerText;
    const formatted = rawText.replace(/\\n/g, "<br><br>");

    document.getElementById("textContent").innerHTML = formatted;
    document.getElementById("gallery").style.display = "none";
    document.getElementById("textView").style.display = "block";
}

function closeText() {
    document.getElementById("textView").style.display = "none";
    document.getElementById("gallery").style.display = "grid";
}
</script>

</body>
</html>
