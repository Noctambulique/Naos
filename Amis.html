<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Carnet de contacts — Fiches personnalisables</title>

<style>
:root{
  --bg:#e7e7eb;
  --card-radius:16px;
  --gap:18px;
  --max-width:1100px;
}
*{box-sizing:border-box}

body{
  margin:0;
  padding:28px;
  font-family:Inter, Arial, sans-serif;
  background:var(--bg);
  color:#111;
}

.wrap{width:100%; max-width:var(--max-width)}

.grid{
  display:grid;
  gap:var(--gap);
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
}

.card{
  border-radius:var(--card-radius);
  padding:18px;
  display:flex;
  gap:18px;
  align-items:flex-start;
  transition:transform .12s ease, box-shadow .2s;
  box-shadow:0 6px 20px rgba(20,20,20,0.12);
}
.card:hover{transform:translateY(-5px);}

.left{
  width:120px;
  display:flex;
  flex-direction:column;
  gap:10px;
  align-items:center;
}

.radar-wrap{
  width:100%;
  display:flex;
  justify-content:center;
}
canvas.radar{
  width:88px;
  height:88px;
}

.content{
  flex:1;
  display:flex;
  flex-direction:column;
  gap:12px;
}

.title-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.name{
  font-weight:600;
  font-size:16px;
  color:#fff;
}

.rects{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.rect{
  width:100%;
  min-height:52px;
  border-radius:12px;
  padding:10px;
  background:rgba(255,255,255,0.25);
  backdrop-filter:blur(3px);
  font-size:13px;
  font-weight:500;
  line-height:1.25;
  color:#fff;
  box-shadow:inset 0 0 6px rgba(0,0,0,0.12);
  border:1px solid rgba(255,255,255,0.35);
}

@media (max-width:520px){
  .grid{grid-template-columns:1fr}
  .left{width:100px}
}
</style>
</head>

<body>
<div class="wrap"></div>
<div id="cards" class="grid" aria-live="polite"></div>

<script>
/* ======================== CONTACTS ==========================*/
const contacts = [
  { id:'aldrin_n', name:'Aldrin N', rect1:'V', rect2:'N', rect3:'', radar:[15,30,40,55,70,90], radar2:[40,50,30,70,60,50], color:'#3F917F' },
  { id:'amandine_cp', name:'Amandine CP', rect1:'S', rect2:'MT', rect3:'', radar:[50,50,30,20,20,80], radar2:[50,50,50,50,50,50], color:'#3F917F' },
  { id:'chara_f', name:'Chara F', rect1:'?', rect2:'MT', rect3:'', radar:[40,60,80,50,20,50], radar2:[50,50,50,50,50,50], color:'#4F9359' },
  { id:'simon-n', name:'Simon N', rect1:'?', rect2:'?', rect3:'', radar:[20,30,50,65,80,95], radar2:[10,80,40,40,70,80], color:'#3F917F' }
];

/* =================== RENDER ====================*/
const cardsRoot = document.getElementById('cards');

function createCard(contact){
  const card = document.createElement('article');
  card.className = 'card';
  card.style.background = contact.color;
  card.dataset.id = contact.id;

  const left = document.createElement('div');
  left.className='left';

  const radarWrap = document.createElement('div');
  radarWrap.className='radar-wrap';
  const cvs = document.createElement('canvas');
  cvs.className='radar';
  cvs.width = 200; cvs.height = 200;
  radarWrap.appendChild(cvs);
  left.appendChild(radarWrap);

  const radarWrap2 = document.createElement('div');
  radarWrap2.className='radar-wrap';
  const cvs2 = document.createElement('canvas');
  cvs2.className='radar';
  cvs2.width = 200; cvs2.height = 200;
  radarWrap2.appendChild(cvs2);
  left.appendChild(radarWrap2);

  const content = document.createElement('div');
  content.className='content';

  const titleRow = document.createElement('div');
  titleRow.className='title-row';
  const name = document.createElement('div');
  name.className='name';
  name.textContent = contact.name;
  titleRow.appendChild(name);

  const rects = document.createElement('div');
  rects.className='rects';
  const r1 = document.createElement('div'); r1.className='rect'; r1.innerHTML = (contact.rect1||'').replace(/\n/g,'<br>');
  const r2 = document.createElement('div'); r2.className='rect'; r2.innerHTML = (contact.rect2||'').replace(/\n/g,'<br>');
  const r3 = document.createElement('div'); r3.className='rect'; r3.innerHTML = (contact.rect3||'').replace(/\n/g,'<br>');
  rects.appendChild(r1);
  rects.appendChild(r2);
  rects.appendChild(r3);

  content.appendChild(titleRow);
  content.appendChild(rects);

  card.appendChild(left);
  card.appendChild(content);

  drawRadar(cvs, contact.radar);
  drawRadar(cvs2, contact.radar2 || [0,0,0,0,0,0]);

  cvs.style.cursor='pointer';
  cvs.title='Modifier radar 1';
  cvs.addEventListener('click', ()=> editRadar(cvs, contact, 'radar'));

  cvs2.style.cursor='pointer';
  cvs2.title='Modifier radar 2';
  cvs2.addEventListener('click', ()=> editRadar(cvs2, contact, 'radar2'));

  return card;
}

/* =================== RADAR ====================*/
function drawRadar(canvas, values){
  const ctx = canvas.getContext('2d');
  const w=canvas.width, h=canvas.height;
  ctx.clearRect(0,0,w,h);
  const cx=w/2, cy=h/2;
  const radius=Math.min(w,h)*0.36;
  const N=6;

  const fill='rgba(255,255,255,0.2)';
  const stroke='#fff';

  ctx.strokeStyle='rgba(255,255,255,0.35)';
  ctx.lineWidth=1;

  for(let r=4;r>=1;r--){
    ctx.beginPath();
    const rr=radius*(r/4);
    for(let i=0;i<N;i++){
      const a=Math.PI/2 + i*(Math.PI*2/N);
      const x=cx+Math.cos(a)*rr;
      const y=cy-Math.sin(a)*rr;
      if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.closePath();
    ctx.stroke();
  }

  for(let i=0;i<N;i++){
    const a=Math.PI/2 + i*(Math.PI*2/N);
    const x=cx+Math.cos(a)*radius;
    const y=cy-Math.sin(a)*radius;
    ctx.beginPath();
    ctx.moveTo(cx,cy);
    ctx.lineTo(x,y);
    ctx.stroke();
  }

  ctx.beginPath();
  for(let i=0;i<N;i++){
    const v=(values[i]||0)/100;
    const a=Math.PI/2 + i*(Math.PI*2/N);
    const x=cx+Math.cos(a)*radius*v;
    const y=cy-Math.sin(a)*radius*v;
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.closePath();
  ctx.fillStyle=fill; ctx.fill();
  ctx.strokeStyle=stroke; ctx.lineWidth=2; ctx.stroke();
}

function editRadar(canvas, contact, key){
  const input = prompt("Entrez 6 valeurs (0-100) :", (contact[key] || []).join(', '));
  if(!input) return;
  const arr = input.split(',').map(s=>parseFloat(s.trim())).slice(0,6);
  if(arr.length!==6 || arr.some(v=>Number.isNaN(v))) return alert("Format incorrect");
  contact[key] = arr.map(v=>Math.max(0,Math.min(100,v)));
  drawRadar(canvas, contact[key]);
}

function renderAll(){
  cardsRoot.innerHTML='';
  contacts.forEach(c=> cardsRoot.appendChild(createCard(c)));
}
renderAll();
window.CARNET_CONTACTS = contacts;
</script>

</body>
</html>
