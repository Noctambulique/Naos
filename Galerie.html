<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Galerie irrégulière</title>

<style>
  body{
    margin:0;
    padding:20px;
    background:#fafafa;
    font-family:sans-serif;
  }

  .zone{
    position:relative;
    width:100%;
    border:2px dashed #ccc;
    overflow:visible; /* très important → la zone peut grandir */
    padding-bottom:200px;
  }

  .zone img{
    position:absolute;
    max-width:220px; /* un peu plus grand */
    border-radius:8px;
    transition:0.3s;
    cursor:pointer;
  }

  .zone img:hover{
    transform:scale(1.1);
  }
</style>
</head>

<body>

<h2>Galerie d’images placées aléatoirement</h2>

<div class="zone" id="zone">

  <img src="D hiver/20200905_151240.jpg">
  <img src="D hiver/FB_IMG_1544732149112.jpg">
  <img src="D hiver/IMG_20210826_005412.jpg">
  <img src="D hiver/IMG_20211024_032129.jpg">
  <img src="D hiver/IMG_20211229_003419~2.jpg">
  <img src="D hiver/IMG_20220703_150614.jpg">
  <img src="D hiver/Screenshot_20200815-211820_YouTube.jpg">
  <img src="D hiver/Screenshot_20190316-174745_Discord.jpg">
  <img src="D hiver/JPEG_20190805_045554.png">
  <img src="D hiver/Capture d'écran 2025-11-25 112449.png">

</div>

<script>
  const zone = document.getElementById("zone");
  const images = Array.from(zone.querySelectorAll("img"));
  const size = 220;              // largeur/hauteur approximative
  const padding = 40;            // marge entre les images
  const imgSpace = size + padding;

  // 👉 On calcule une hauteur suffisante pour accueillir toutes les images
  const columns = Math.floor(window.innerWidth / imgSpace);
  const rows = Math.ceil(images.length / columns);
  const neededHeight = rows * imgSpace + 200;

  zone.style.height = neededHeight + "px";

  function overlap(r1, r2){
    return !(
      r1.left + r1.width  < r2.left ||
      r2.left + r2.width  < r1.left ||
      r1.top  + r1.height < r2.top  ||
      r2.top  + r2.height < r1.top
    );
  }

  const placed = [];
  const zoneW = zone.clientWidth;
  const zoneH = zone.clientHeight;

  images.forEach(img => {
    let tries = 0;
    let rect;
    let ok = false;

    while(!ok && tries < 1000){
      tries++;

      const x = Math.random() * (zoneW - size);
      const y = Math.random() * (zoneH - size);

      rect = { left:x, top:y, width:size, height:size };

      ok = placed.every(p => !overlap(rect, p));
    }

    img.style.left = rect.left + "px";
    img.style.top = rect.top + "px";

    placed.push(rect);
  });
</script>

</body>
</html>
