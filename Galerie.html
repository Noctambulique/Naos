<title>Galerie</title>

<style>
  /* ------------------------- */
  /*      AERO GLOBAL STYLE     */
  /* ------------------------- */
  body{
    margin:0;
    padding:20px;
    background:linear-gradient(180deg, #2a80d7 0%, #0f4ea3 40%, #0e3569 100%);
    font-family:"Segoe UI", sans-serif;
    color:#fff;
    overflow-x:hidden;
  }

  h2{
    text-align:center;
    font-size:34px;
    font-weight:300;
    margin-bottom:25px;
    text-shadow:0 2px 8px rgba(0,0,0,0.7);
  }

  /* ------------------------- */
  /*     AERO GLASS PANEL      */
  /* ------------------------- */
  .zone{
    position:relative;
    width:100%;
    padding:40px 0;
    border-radius:18px;

    /* effet verre Windows 7 */
    background:rgba(255,255,255,0.22);
    backdrop-filter:blur(14px) saturate(150%);
    -webkit-backdrop-filter:blur(14px) saturate(150%);

    /* bordure lumineuse */
    border:1px solid rgba(255,255,255,0.55);
    box-shadow:
      inset 0 0 25px rgba(255,255,255,0.33),
      0 18px 35px rgba(0,0,0,0.45),
      0 0 40px rgba(40,130,255,0.35);
  }

  /* ------------------------- */
  /*     IMAGES AERO STYLE     */
  /* ------------------------- */
  .zone img{
    position:absolute;
    max-width:260px;
    border-radius:8px;

    /* effet glossy W7 */
    box-shadow:
      0 10px 25px rgba(0,0,0,0.65),
      0 0 15px rgba(160,200,255,0.35),
      inset 0 0 18px rgba(255,255,255,0.18);

    transform:rotate(-1deg) scale(1);
    transition:
      transform 0.35s cubic-bezier(0.16, 0.84, 0.44, 1),
      filter 0.25s,
      box-shadow 0.3s;
    cursor:pointer;

    /* bordure subtile */
    border:1px solid rgba(255,255,255,0.45);
  }

  .zone img:hover{
    transform:scale(1.2) rotate(1deg);
    filter:brightness(1.2);

    /* halo bleu façon “focus fenêtre” */
    box-shadow:
      0 0 22px rgba(70,150,255,0.85),
      0 12px 35px rgba(0,0,0,0.55),
      inset 0 0 18px rgba(255,255,255,0.28);

    z-index:20;
  }
</style>

<script>
  /* IDENTIQUE À TON SYSTÈME, JUSTE MIS EN AÉRO */
  const zone = document.getElementById("zone");
  const imgs = [...zone.querySelectorAll("img")];

  const cellW = 480;
  const cellH = 480;

  const zoneW = zone.clientWidth;
  const cols = Math.max(1, Math.floor(zoneW / cellW));
  const rows = Math.ceil(imgs.length / cols);

  zone.style.height = (rows * cellH + 300) + "px";

  async function layout(){
    let index = 0;

    for (const img of imgs){
      await img.decode();

      const col = index % cols;
      const row = Math.floor(index / cols);

      const baseX = col * cellW;
      const baseY = row * cellH;

      const maxOffsetX = Math.max(0, cellW - img.width - 80);
      const maxOffsetY = Math.max(0, cellH - img.height - 80);

      const offsetX = Math.random() * maxOffsetX;
      const offsetY = Math.random() * maxOffsetY;

      img.style.left = (baseX + offsetX) + "px";
      img.style.top  = (baseY + offsetY) + "px";

      index++;
    }
  }

  layout();
</script>
