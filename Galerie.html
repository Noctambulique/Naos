<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Galerie irrégulière</title>

<style>
  body{
    margin:0;
    padding:20px;
    background:#fafafa;
    font-family:sans-serif;
  }

  .zone{
    position:relative;
    width:100%;
    height:100vh; /* Tu peux augmenter si tu veux plus d’espace */
    border:2px dashed #ccc;
    overflow:hidden;
  }

  .zone img{
    position:absolute;
    max-width:200px;   /* taille max des images */
    border-radius:8px;
    transition:0.3s;
    cursor:pointer;
  }

  .zone img:hover{
    transform:scale(1.1);
  }
</style>
</head>

<body>

<h2>Galerie d’images placées aléatoirement</h2>

<div class="zone" id="zone">

  <!-- 👉 AJOUTE TES IMAGES ICI (autant que tu veux) -->
  <img src="D hiver/20200905_151240.jpg">
  <img src="D hiver/FB_IMG_1544732149112.jpg">
  <img src="D hiver/IMG_20210826_005412.jpg">
  <img src="D hiver/IMG_20211024_032129.jpg">
  <img src="D hiver/IMG_20211229_003419~2.jpg">
  <img src="D hiver/IMG_20220703_150614.jpg">
  <img src="D hiver/Screenshot_20200815-211820_YouTube.jpg">
  <img src="D hiver/Screenshot_20190316-174745_Discord.jpg">
  <img src="D hiver/JPEG_20190805_045554.png">
  <img src="D hiver/Capture d'écran 2025-11-25 112449.png">

</div>

<script>
  // Positionnement irrégulier automatique
  const zone = document.getElementById("zone");
  const images = zone.querySelectorAll("img");

  images.forEach(img =>{
    const zoneW = zone.clientWidth;
    const zoneH = zone.clientHeight;

    const x = Math.random() * (zoneW - 200); // 200px = largeur max
    const y = Math.random() * (zoneH - 200);

    img.style.left = x + "px";
    img.style.top = y + "px";
  });
</script>

</body>
</html>
