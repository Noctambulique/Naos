<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Galerie</title>

<style>
  body{
    margin:0;
    padding:20px;
    background:#fafafa;
    font-family:sans-serif;
  }

  .zone{
    position:relative;
    width:100%;
    border:2px dashed #ccc;
    overflow:visible;
  }

  .zone img{
    position:absolute;
    max-width:260px;
    border-radius:10px;
    transition:0.3s;
    cursor:pointer;
  }

  .zone img:hover{
    transform:scale(1.1);
  }
</style>
</head>

<body>

<h2>Galerie</h2>

<div class="zone" id="zone">

  <img src="D hiver/20200905_151240.jpg">
  <img src="D hiver/FB_IMG_1544732149112.jpg">
  <img src="D hiver/IMG_20210826_005412.jpg">
  <img src="D hiver/IMG_20211024_032129.jpg">
  <img src="D hiver/IMG_20211229_003419~2.jpg">
  <img src="D hiver/IMG_20220703_150614.jpg">
  <img src="D hiver/Screenshot_20200815-211820_YouTube.jpg">
  <img src="D hiver/Screenshot_20190316-174745_Discord.jpg">
  <img src="D hiver/20240101_154156.jpg">
  <img src="D hiver/JPEG_20190805_045554.png">
  <img src="D hiver/20240126_021823.jpg">
  <img src="D hiver/original_807d23e7-f9ee-477b-bd02-6e061991e824_Screenshot_20241012_173633_Gmail.jpg">
  <img src="D hiver/Screenshot_20241207_084201_Photos.jpg">
</div>

<script>
  const zone = document.getElementById("zone");
  const imgs = [...zone.querySelectorAll("img")];

  // Cellules beaucoup plus grandes pour espacer fortement
  const cellW = 480;
  const cellH = 480;

  const zoneW = zone.clientWidth;
  const cols = Math.max(1, Math.floor(zoneW / cellW));
  const rows = Math.ceil(imgs.length / cols);

  // Hauteur de la zone (grande marge supplémentaire)
  zone.style.height = (rows * cellH + 300) + "px";

  async function layout(){
    let index = 0;

    for (const img of imgs){
      await img.decode();

      const col = index % cols;
      const row = Math.floor(index / cols);

      const baseX = col * cellW;
      const baseY = row * cellH;

      // Grand espace interne dans chaque cellule
      const maxOffsetX = Math.max(0, cellW - img.width - 80);
      const maxOffsetY = Math.max(0, cellH - img.height - 80);

      const offsetX = Math.random() * maxOffsetX;
      const offsetY = Math.random() * maxOffsetY;

      img.style.left = (baseX + offsetX) + "px";
      img.style.top  = (baseY + offsetY) + "px";

      index++;
    }
  }

  layout();
</script>

</body>
</html>
