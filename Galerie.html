<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Galerie irrégulière</title>

<style>
  body{
    margin:0;
    padding:20px;
    background:#fafafa;
    font-family:sans-serif;
  }

  .zone{
    position:relative;
    width:100%;
    height:100vh; /* Tu peux augmenter si tu veux plus d’espace */
    border:2px dashed #ccc;
    overflow:hidden;
  }

  .zone img{
    position:absolute;
    max-width:200px;   /* taille max des images */
    border-radius:8px;
    transition:0.3s;
    cursor:pointer;
  }

  .zone img:hover{
    transform:scale(1.1);
  }
</style>
</head>

<body>

<h2>Galerie d’images placées aléatoirement</h2>

<div class="zone" id="zone">

  <!-- 👉 AJOUTE TES IMAGES ICI (autant que tu veux) -->
  <img src="images/photo1.jpg">
  <img src="images/photo2.jpg">
  <img src="images/photo3.jpg">
  <img src="images/photo4.jpg">

</div>

<script>
  // Positionnement irrégulier automatique
  const zone = document.getElementById("zone");
  const images = zone.querySelectorAll("img");

  images.forEach(img =>{
    const zoneW = zone.clientWidth;
    const zoneH = zone.clientHeight;

    const x = Math.random() * (zoneW - 200); // 200px = largeur max
    const y = Math.random() * (zoneH - 200);

    img.style.left = x + "px";
    img.style.top = y + "px";
  });
</script>

</body>
</html>
