<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Iceberg</title>
  <style>
    html,body{height:100%;margin:0;font-family:system-ui;background:#fff;display:flex;align-items:center;justify-content:center}
    #viewer img{max-width:90vw;max-height:90vh;display:block}

    /* colonne de contrôle minimaliste */
    #bar{position:fixed;right:16px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:18px}

    /* 3 boutons ronds = Iceberg */
    .dot{width:18px;height:18px;border-radius:50%;background:#bbb;cursor:pointer;transition:background .2s}
    .dot.active{background:#000}

    #label{font-size:13px;opacity:0.7;margin-top:10px}
  </style>
</head>
<body>

  <main id="viewer">
    <img id="display" src="img1.jpg" alt="cran 1">
  </main>

  <aside id="bar">
    <div class="dot active" data-cran="1"></div>
    <div class="dot" data-cran="2"></div>
    <div class="dot" data-cran="3"></div>
  </aside>

  <script>
    const images = ['img1.jpg','img2.jpg','img3.jpg']
    const display = document.getElementById('display')
    const label = document.getElementById('label')
    const dots = document.querySelectorAll('.dot')

    function setCran(n){
      display.src = images[n-1] || ''
      display.alt = 'cran ' + n
      label.textContent = 'Cran ' + n
      dots.forEach(d => d.classList.remove('active'))
      dots[n-1].classList.add('active')
    }

    dots.forEach(dot => {
      dot.addEventListener('click', () => {
        const n = Number(dot.dataset.cran)
        setCran(n)
      })
    })
  </script>

</body>
</html>
