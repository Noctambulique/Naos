<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Rectangles éditables</title>

<style>
    body {
        margin: 0;
        padding: 40px;
        background: #f2f2f2;
        font-family: Arial, Helvetica, sans-serif;
    }

    .container {
        max-width: 700px;
        margin: auto;
        display: flex;
        flex-direction: column;
        gap: 20px;
    }

    .rectangle {
        background: white;
        border: 2px solid #000;
        padding: 20px;
        min-height: 100px;
        font-size: 16px;
        line-height: 1.4;
        outline: none;
    }

    .rectangle:focus {
        background: #fffbe6;
    }
</style>
</head>

<body>

<div class="container">
    <div class="rectangle" contenteditable="true">
        Clique ici et écris.
    </div>

    <div class="rectangle" contenteditable="true">
        Un autre rectangle.
    </div>

    <div class="rectangle" contenteditable="true">
        Tu peux en ajouter autant que tu veux.
    </div>
</div>

</body>
</html>
