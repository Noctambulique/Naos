<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Rectangles statiques</title>

<style>
    body {
        margin: 0;
        padding: 40px;
        background: #f0f0f0;
        font-family: Arial, Helvetica, sans-serif;
    }

    .container {
        max-width: 700px;
        margin: auto;
        display: flex;
        flex-direction: column;
        gap: 20px;
    }

    .rectangle {
        background: white;
        border: 2px solid black;
        padding: 20px;
        min-height: 100px;
        font-size: 16px;
        line-height: 1.5;
    }
</style>
</head>

<body>

<div class="container">

    <div class="rectangle">
        Texte du rectangle 1.
        Tu modifies ce contenu directement ici dans le code.
    </div>

    <div class="rectangle">
        Rectangle 2.
        Peut contenir plusieurs lignes,
        des paragraphes,
        ou même des listes.
    </div>

    <div class="rectangle">
        Rectangle 3.
        Structure stable, sans interaction.
    </div>

</div>

</body>
</html>
