<!doctype html>
<html>
<head>
<meta charset="utf-8">

<style>
  html,body{
    height:100%;
    margin:0;
    font-family:system-ui;
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  #viewer img{
    max-width:90vw;
    max-height:90vh;
    display:block;
  }

  /* colonne de contrôle */
  #bar{
    position:fixed;
    right:16px;
    top:50%;
    transform:translateY(-50%);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:18px;
  }

  /* carrés */
  .dot{
    width:20px;
    height:20px;
    background:#d0d0d0;
    border:2px solid #888;
    cursor:pointer;
    transition:background .2s, transform .15s;
  }

  .dot:hover{
    transform:scale(1.15);
  }

  .dot.active{
    background:#000;
    border-color:#000;
  }

  /* supprimé : #label */
</style>
</head>

<body>

  <main id="viewer">
    <img id="display" src="">
  </main>

  <aside id="bar">
    <div class="dot active" data-id="1"></div>
    <div class="dot" data-id="2"></div>
    <div class="dot" data-id="3"></div>
  </aside>

  <script>
    const images = [
      'D hiver/Iceberg 1.png',
      'D hiver/Iceberg 2.png',
      'D hiver/Iceberg 3.png'
    ];

    const display = document.getElementById('display');
    const dots    = document.querySelectorAll('.dot');

    function show(n){
      if(images[n-1]) display.src = images[n-1];
      display.alt = ""; // plus de texte
      dots.forEach(d => d.classList.remove('active'));
      dots[n-1].classList.add('active');
    }

    dots.forEach(dot => {
      dot.addEventListener('click', () => {
        show(Number(dot.dataset.id));
      });
    });

    show(1);
  </script>

</body>
</html>
