
<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Éditeur : carrés connectables — Export HTML</title>
  <style>
    :root{font-family:system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial}
    body{margin:0;height:100vh;display:flex;flex-direction:column}
    .toolbar{display:flex;gap:8px;padding:10px;background:#111827;color:#fff;align-items:center}
    .toolbar button,input{height:36px;padding:6px 10px;border-radius:6px;border:0;background:#374151;color:white}
    .toolbar input[type="text"]{background:#fff;color:#000;height:36px}
    .container{position:relative;flex:1;background:linear-gradient(180deg,#f7fafc,#e6eef8);overflow:auto}
    .workspace{position:relative;min-height:800px;width:1600px;margin:20px}

    /* nodes (squares) */
    .node{position:absolute;width:180px;height:100px;border-radius:6px;background:#fff;border:2px solid #111827;box-shadow:0 6px 18px rgba(2,6,23,.12);display:flex;align-items:center;justify-content:center;padding:8px;cursor:grab;user-select:none}
    .node.editing{cursor:text;border-color:#2563eb}
    .node .content{width:100%;height:100%;outline:none;overflow:auto;text-align:center}

    /* selected visuals */
    .node.selected{box-shadow:0 8px 24px rgba(37,99,235,.18);border-color:#2563eb}

    /* small helper */
    .node .link-badge{position:absolute;right:6px;top:6px;background:#2563eb;color:white;padding:2px 6px;border-radius:4px;font-size:12px}

    svg.lines{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}

    /* export modal */
    .modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:white;padding:12px;border-radius:8px;box-shadow:0 12px 48px rgba(2,6,23,.2);z-index:9999;width:80%;max-width:900px}
    .modal textarea{width:100%;height:400px}

    .small{font-size:12px;color:#94a3b8}
  </style>
</head>
<body>
  <div class="toolbar">
    <button id="addNodeBtn">➕ Ajouter un carré</button>
    <button id="connectBtn">🔗 Mode connexion</button>
    <label class="small" style="margin-left:8px">URL (pour le carré sélectionné) :</label>
    <input id="linkInput" type="text" placeholder="https://..." />
    <button id="applyLinkBtn">Appliquer le lien</button>
    <button id="exportBtn">🖨️ Exporter en HTML</button>
    <button id="clearBtn" style="margin-left:auto;background:#ef4444">Supprimer tout</button>
  </div>

  <div class="container">
    <div class="workspace" id="workspace">
      <!-- SVG pour dessiner les lignes entre les carrés -->
      <svg class="lines" id="svgLines" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
  </div>

  <!-- Export modal (rempli dynamiquement) -->
  <div id="exportModal" style="display:none" class="modal">
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:6px">
      <strong>HTML exporté (copier / télécharger)</strong>
      <button id="downloadExportBtn" style="margin-left:auto">Télécharger .html</button>
      <button id="closeExportBtn">Fermer</button>
    </div>
    <textarea id="exportArea" spellcheck="false"></textarea>
  </div>

  <script>
    // État
    const workspace = document.getElementById('workspace');
    const svg = document.getElementById('svgLines');
    const addNodeBtn = document.getElementById('addNodeBtn');
    const connectBtn = document.getElementById('connectBtn');
    const linkInput = document.getElementById('linkInput');
    const applyLinkBtn = document.getElementById('applyLinkBtn');
    const exportBtn = document.getElementById('exportBtn');
    const clearBtn = document.getElementById('clearBtn');

    const exportModal = document.getElementById('exportModal');
    const exportArea = document.getElementById('exportArea');
    const closeExportBtn = document.getElementById('closeExportBtn');
    const downloadExportBtn = document.getElementById('downloadExportBtn');

    let nodes = []; // {id, x, y, text, link}
    let connections = []; // {fromId, toId}

    let modeConnect = false;
    let connectFrom = null;
    let selectedNodeId = null;

    // util
    function uid(){return 'n' + Math.random().toString(36).slice(2,9)}

    // créer un node DOM et ajouter à workspace
    function createNode({x=40,y=40,text='Double-cliquez pour éditer',link=''}={}){
      const id = uid();
      nodes.push({id,x,y,text,link});
      const el = renderNode({id,x,y,text,link});
      workspace.appendChild(el);
      drawAll();
      return id;
    }

    function renderNode(node){
      const {id,x,y,text,link} = node;
      const el = document.createElement('div');
      el.className = 'node';
      el.style.left = x + 'px';
      el.style.top = y + 'px';
      el.dataset.id = id;
      el.innerHTML = `
        <div class="content" contenteditable="true" spellcheck="false">${escapeHtml(text)}</div>
        ${link?'<div class="link-badge">🔗</div>':''}
      `;

      // dragging
      let offsetX=0,offsetY=0,dragging=false;
      const content = el.querySelector('.content');

      el.addEventListener('pointerdown', (e)=>{
        // if user clicks inside editable content, let them edit
        if(e.target.closest('.content')){
          el.classList.add('editing');
          return;
        }
        selectedNodeId = id; updateSelectionStyles();
        dragging = true; el.setPointerCapture(e.pointerId);
        offsetX = e.clientX - el.getBoundingClientRect().left;
        offsetY = e.clientY - el.getBoundingClientRect().top;
      });
      el.addEventListener('pointermove', (e)=>{
        if(!dragging) return;
        const rect = workspace.getBoundingClientRect();
        const newX = e.clientX - rect.left - offsetX;
        const newY = e.clientY - rect.top - offsetY;
        el.style.left = newX + 'px'; el.style.top = newY + 'px';
        // update model incrementally for smooth lines
        const nodeObj = nodes.find(n=>n.id===id);
        nodeObj.x = newX; nodeObj.y = newY;
        drawAll();
      });
      el.addEventListener('pointerup', (e)=>{dragging=false; el.releasePointerCapture(e.pointerId); el.classList.remove('editing');});

      // connect on click (if mode active)
      el.addEventListener('click', (e)=>{
        // avoid selecting when editing content
        if(e.target.closest('.content')) return;
        if(modeConnect){
          if(!connectFrom){ connectFrom = id; highlightTemporary(id); }
          else if(connectFrom===id){ connectFrom=null; clearTempHighlights(); }
          else { connections.push({fromId:connectFrom,toId:id}); connectFrom=null; clearTempHighlights(); drawAll(); }
        } else {
          // select node for link apply
          selectedNodeId = id; updateSelectionStyles();
          const model = nodes.find(n=>n.id===id);
          linkInput.value = model.link || '';
        }
      });

      // content editing -> update model
      content.addEventListener('input', ()=>{
        const model = nodes.find(n=>n.id===id);
        model.text = content.innerHTML;
      });

      // double click toggles editing focus
      el.addEventListener('dblclick', ()=>{ content.focus(); });

      return el;
    }

    function escapeHtml(s){
      return s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');
    }

    function drawAll(){
      // redraw lines
      svg.innerHTML = '';
      // draw each connection as a line between centers
      connections.forEach(conn=>{
        const a = nodes.find(n=>n.id===conn.fromId);
        const b = nodes.find(n=>n.id===conn.toId);
        if(!a||!b) return;
        const line = document.createElementNS('http://www.w3.org/2000/svg','line');
        const aCx = a.x + 90; // half node width (180/2)
        const aCy = a.y + 50; // half node height (100/2)
        const bCx = b.x + 90;
        const bCy = b.y + 50;
        line.setAttribute('x1', aCx);
        line.setAttribute('y1', aCy);
        line.setAttribute('x2', bCx);
        line.setAttribute('y2', bCy);
        line.setAttribute('stroke','#111827');
        line.setAttribute('stroke-width','3');
        line.setAttribute('stroke-linecap','round');
        svg.appendChild(line);
      });

      // update DOM nodes' link-badge visibility
      document.querySelectorAll('.node').forEach(el=>{
        const id = el.dataset.id; const model = nodes.find(n=>n.id===id);
        const badge = el.querySelector('.link-badge');
        if(model.link){ if(!badge) el.insertAdjacentHTML('beforeend','<div class="link-badge">🔗</div>'); }
        else if(badge) badge.remove();
        // selection style
        if(id===selectedNodeId) el.classList.add('selected'); else el.classList.remove('selected');
      });
    }

    function highlightTemporary(id){
      document.querySelectorAll('.node').forEach(el=>{ if(el.dataset.id===id) el.classList.add('selected'); else el.classList.remove('selected'); });
    }
    function clearTempHighlights(){ updateSelectionStyles(); }

    function updateSelectionStyles(){
      document.querySelectorAll('.node').forEach(el=>{ if(el.dataset.id===selectedNodeId) el.classList.add('selected'); else el.classList.remove('selected'); });
    }

    // UI hooks
    addNodeBtn.addEventListener('click', ()=>{ createNode({x:40 + nodes.length*20, y:40 + nodes.length*20}); });

    connectBtn.addEventListener('click', ()=>{
      modeConnect = !modeConnect; connectFrom=null; updateConnectBtn();
      if(modeConnect) { connectBtn.style.background='#10b981'; connectBtn.textContent='🔗 Mode connexion (ON)'; }
      else { connectBtn.style.background=''; connectBtn.textContent='🔗 Mode connexion'; }
    });

    applyLinkBtn.addEventListener('click', ()=>{
      if(!selectedNodeId){ alert('Sélectionnez d\u00e9j\u00e0 un carr\u00e9 en cliquant dessus.'); return; }
      const val = linkInput.value.trim();
      const model = nodes.find(n=>n.id===selectedNodeId);
      model.link = val;
      drawAll();
    });

    exportBtn.addEventListener('click', ()=>{
      const html = buildExportHTML();
      exportArea.value = html;
      exportModal.style.display = 'block';
    });
    closeExportBtn.addEventListener('click', ()=>{ exportModal.style.display='none'; });

    downloadExportBtn.addEventListener('click', ()=>{
      const blob = new Blob([exportArea.value],{type:'text/html'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href=url; a.download='mindmap-export.html'; a.click(); URL.revokeObjectURL(url);
    });

    clearBtn.addEventListener('click', ()=>{
      if(!confirm('Supprimer tous les carrés et connexions ?')) return;
      nodes=[]; connections=[]; selectedNodeId=null; connectFrom=null; workspace.querySelectorAll('.node').forEach(n=>n.remove()); drawAll();
    });

    // Build static exported HTML string from current model
    function buildExportHTML(){
      // export a simple, self-contained HTML with positioned boxes and svg lines; boxes with links become anchors
      const pageStyle = `
        body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial}
        .node{position:absolute;width:180px;height:100px;border-radius:6px;background:#fff;border:2px solid #111827;display:flex;align-items:center;justify-content:center;padding:8px;}
        .container{position:relative;width:100%;height:100vh;background:linear-gradient(180deg,#f7fafc,#e6eef8);overflow:auto}
      `;

      // build nodes HTML
      const nodesHtml = nodes.map(n=>{
        // sanitize simple allowed tags
        const safeContent = n.text; // we stored innerHTML already from editor
        const style = `left:${n.x}px;top:${n.y}px`;
        if(n.link){
          return `<div class="node" style="${style}"><a href="${escapeAttr(n.link)}" target="_blank" style="display:block;width:100%;height:100%;text-decoration:none;color:inherit;display:flex;align-items:center;justify-content:center">${safeContent}</a></div>`;
        } else {
          return `<div class="node" style="${style}">${safeContent}</div>`;
        }
      }).join('\n');

      // build lines SVG
      const linesSvg = connections.map(conn=>{
        const a = nodes.find(n=>n.id===conn.fromId);
        const b = nodes.find(n=>n.id===conn.toId);
        if(!a||!b) return '';
        const aCx = a.x + 90; const aCy = a.y + 50; const bCx = b.x + 90; const bCy = b.y + 50;
        return `<line x1="${aCx}" y1="${aCy}" x2="${bCx}" y2="${bCy}" stroke="#111827" stroke-width="3" stroke-linecap="round" />`;
      }).join('\n');

      const html = `<!doctype html>\n<html lang="fr">\n<head>\n<meta charset="utf-8"/>\n<meta name="viewport" content="width=device-width,initial-scale=1"/>\n<title>Export — Carr\u00e9s connect\u00e9s</title>\n<style>${pageStyle}</style>\n</head>\n<body>\n<div class="container">\n  <svg style="position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none">\n    ${linesSvg}\n  </svg>\n  <div style="position:relative;width:1600px;height:1200px">\n    ${nodesHtml}\n  </div>\n</div>\n</body>\n</html>`;

      return html;
    }

    function escapeAttr(s){ return s.replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll("'","&#39;"); }

    // Initialize with a couple of nodes
    createNode({x:60,y:60,text:'Idée principale',link:''});
    createNode({x:360,y:220,text:'Sous-id\u00e9e 1',link:''});
    createNode({x:360,y:60,text:'Sous-id\u00e9e 2',link:''});

    // small autosave: keep DOM in sync when scroll/resize etc
    window.addEventListener('resize', drawAll);

    // Keyboard: Delete key removes selected node
    window.addEventListener('keydown', (e)=>{
      if(e.key === 'Delete' && selectedNodeId){
        // remove node and related connections
        nodes = nodes.filter(n=>n.id!==selectedNodeId);
        connections = connections.filter(c=>c.fromId!==selectedNodeId && c.toId!==selectedNodeId);
        const el = workspace.querySelector(`.node[data-id="${selectedNodeId}"]`);
        if(el) el.remove();
        selectedNodeId = null; drawAll();
      }
    });

  </script>
</body>
</html>
