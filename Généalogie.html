<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Arbre généalogique — Minimal</title>
  <style>
    :root{font-family:system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial;}
    body{margin:18px;background:#f7f7f8;color:#111}
    header{display:flex;gap:8px;align-items:center;margin-bottom:12px}
    h1{font-size:16px;margin:0}
    .controls{display:flex;gap:6px}
    button{background:#111;color:#fff;border:0;padding:8px 10px;border-radius:8px;cursor:pointer}
    button.ghost{background:transparent;color:#111;border:1px solid #ddd}
    main{display:flex;gap:16px}
    .canvas{flex:1;padding:12px;border-radius:10px;background:#fff;min-height:320px;box-shadow:0 1px 0 rgba(0,0,0,0.04);overflow:auto;border:2px solid #e5e5e5}
    ul.tree{list-style:none;margin:8px 0 0 20px;padding-left:20px;border-left:2px solid #ddd}
    li.node{margin:6px 0;padding-left:12px;position:relative}
    li.node > .label{display:inline-block;padding:6px 10px;border-radius:8px;background:#f0f0f2;cursor:pointer}
    li.node.selected > .label{outline:2px solid #3b82f6;background:#eff6ff}
    .label[contenteditable]{min-width:64px}
    .export-area{width:420px;max-width:45%;display:flex;flex-direction:column;gap:8px}
    textarea{width:100%;height:320px;padding:8px;border-radius:8px;border:1px solid #ddd;font-family:monospace}
    .muted{color:#666;font-size:13px}
    footer{margin-top:10px}
    small.note{color:#666}
  </style>
</head>
<body>
  <header>
    <h1>Arbre généalogique — Minimal</h1>
    <div class="controls" style="margin-left:12px">
      <button id="addRoot">Ajouter personne racine</button>
      <button id="addParent" class="ghost">Ajouter parents</button>
      <button id="addChild" class="ghost">Ajouter enfant</button>
      <button id="delete" class="ghost">Supprimer</button>
      <button id="export">Exporter HTML</button>
      <button id="download" class="ghost">Télécharger page</button>
      <button id="addRoot">Ajouter personne racine</button>
      <button id="addChild" class="ghost">Ajouter enfant</button>
      <button id="delete" class="ghost">Supprimer</button>
      <button id="export">Exporter HTML</button>
      <button id="download" class="ghost">Télécharger page</button>
    </div>
  </header>

  <main>
    <section class="canvas" aria-label="Éditeur arbre">
      <div id="treeContainer">
        <!-- Arbre (ul/li) généré ici -->
      </div>
      <footer>
        <small class="note">Cliquez sur un nom pour le sélectionner. Double-cliquez pour éditer (ou appuyez Entrée).</small>
      </footer>
    </section>

    <aside class="export-area">
      <div class="muted">HTML généré (copiez/coller ou téléchargez la page complète) :</div>
      <textarea id="exportArea" readonly placeholder="Export HTML..."></textarea>
      <div style="display:flex;gap:8px;justify-content:flex-end">
        <button id="copy">Copier</button>
      </div>
    </aside>
  </main>

  <script>
    // Minimal tree editor: nested UL/LI. No frameworks. All in one file.
    const treeContainer = document.getElementById('treeContainer');
    const exportArea = document.getElementById('exportArea');
    const btnAddParent = document.getElementById('addParent');
    let selected = null;

    function createNode(name = 'Nouvelle personne'){
      const li = document.createElement('li');
      li.className = 'node';

      const span = document.createElement('span');
      span.className = 'label';
      span.textContent = name;
      span.tabIndex = 0;
      span.setAttribute('role','treeitem');
      span.setAttribute('contenteditable','false');

      const children = document.createElement('ul');
      children.className = 'tree';

      li.appendChild(span);
      li.appendChild(children);

      // click: select
      span.addEventListener('click', (e)=>{
        e.stopPropagation();
        selectNode(li);
      });

      // double click: enable edit
      span.addEventListener('dblclick', (e)=>{
        e.stopPropagation();
        span.setAttribute('contenteditable','true');
        span.focus();
        placeCaretAtEnd(span);
      });

      // finish editing on enter or blur
      span.addEventListener('keydown', (e)=>{
        if(e.key === 'Enter'){
          e.preventDefault();
          span.blur();
        }
      });
      span.addEventListener('blur', ()=>{
        span.setAttribute('contenteditable','false');
        if(!span.textContent.trim()) span.textContent = '—';
      });

      return li;
    }

    function placeCaretAtEnd(el){
      const range = document.createRange();
      range.selectNodeContents(el);
      range.collapse(false);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    }

    function selectNode(li){
      if(selected) selected.classList.remove('selected');
      selected = li;
      selected.classList.add('selected');
    }

    function addRoot(){
      const rootList = getRootUL();
      const node = createNode();
      rootList.appendChild(node);
      selectNode(node);
    }

    function addChild(){
      if(!selected){
        alert('Sélectionnez d\u00e9j\u00e0 une personne (cliquer sur un nom).');
        return;
      }
      const childrenUL = selected.querySelector(':scope > ul.tree');
      const child = createNode();
      childrenUL.appendChild(child);
      selectNode(child);
    }

    function addParent(){
      if(!selected){ alert('Sélectionnez une personne.'); return; }
      const current = selected;
      const parentUL = current.parentElement;
      const newParent = createNode('Nouveaux parents');
      // Insert newParent at the same level as current
      parentUL.insertBefore(newParent, current);
      // Move current inside newParent
      newParent.querySelector(':scope > ul.tree').appendChild(current);
      selectNode(newParent);
    }

    function deleteNode(){
      if(!selected){
        alert('Sélectionnez une personne à supprimer.');
        return;
      }
      const parentUL = selected.parentElement;
      parentUL.removeChild(selected);
      selected = null;
    }

    function getRootUL(){
      let root = treeContainer.querySelector('ul.root');
      if(!root){
        root = document.createElement('ul');
        root.className = 'tree root';
        treeContainer.appendChild(root);
      }
      return root;
    }

    // export: serialize the inner HTML of the root UL, but produce a clean, minimal HTML tree
    function exportHTML(){
      const root = getRootUL();
      // clone but strip behaviour attributes
      const clean = root.cloneNode(true);
      // remove classes and contenteditable attributes from spans
      clean.querySelectorAll('*').forEach(node => {
        node.removeAttribute('class');
        node.removeAttribute('tabindex');
        node.removeAttribute('role');
        node.removeAttribute('contenteditable');
      });
      // Convert spans to plain text inside <span> to maintain inline labels
      clean.querySelectorAll('span').forEach(s => {
        const text = document.createTextNode(s.textContent);
        const wrapper = document.createElement('span');
        wrapper.appendChild(text);
        s.replaceWith(wrapper);
      });

      // pretty-print by creating a wrapper
      const wrapper = document.createElement('div');
      wrapper.appendChild(clean);
      const html = wrapper.innerHTML;
      exportArea.value = html;
      navigator.clipboard?.writeText(html).catch(()=>{}); // best-effort copy
    }

    function downloadPage(){
      // create a full, standalone HTML which contains the exported tree
      const treeHTML = exportArea.value || (function(){ exportHTML(); return exportArea.value })();
      const page = `<!doctype html>\n<html lang=\"fr\">\n<head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>Arbre</title></head>\n<body>\n<h3>Arbre généalogique</h3>\n${treeHTML}\n</body>\n</html>`;
      const blob = new Blob([page], {type: 'text/html'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'arbre-genalogique.html';
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    // helpers: build initial sample
    function initSample(){
      const root = getRootUL();
      const p1 = createNode('Jean Dupont');
      const c1 = createNode('Marie Dupont');
      const c2 = createNode('Pierre Dupont');
      p1.querySelector(':scope > ul.tree').appendChild(c1);
      p1.querySelector(':scope > ul.tree').appendChild(c2);
      root.appendChild(p1);
    }

    // wire buttons
    document.getElementById('addRoot').addEventListener('click', addRoot);
    btnAddParent.addEventListener('click', addParent);
    document.getElementById('addChild').addEventListener('click', addChild);('click', addRoot);
    document.getElementById('addChild').addEventListener('click', addChild);
    document.getElementById('delete').addEventListener('click', deleteNode);
    document.getElementById('export').addEventListener('click', exportHTML);
    document.getElementById('download').addEventListener('click', downloadPage);
    document.getElementById('copy').addEventListener('click', ()=>{
      exportArea.select();
      document.execCommand('copy');
    });

    // click outside to deselect
    document.addEventListener('click', (e)=>{
      if(!e.target.closest('.node')){
        if(selected) selected.classList.remove('selected');
        selected = null;
      }
    });

    // Initialize — start with an empty tree
    getRootUL();(first);
  </script>
</body>
</html>
