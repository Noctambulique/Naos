<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
img{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);max-width:none;cursor:grab;user-select:none}
</style>
</head>
<body>
<img id="img" src="monimage.jpg">
<script>
const img=document.getElementById('img');
let s=1,tx=0,ty=0,d=false,px=0,py=0;
function apply(){img.style.transform=`translate(calc(-50%+${tx}px),calc(-50%+${ty}px)) scale(${s})`}
window.addEventListener('wheel',e=>{e.preventDefault();s*=e.deltaY<0?1.1:0.9;apply()});
img.addEventListener('mousedown',e=>{d=true;px=e.clientX-tx;py=e.clientY-ty});
window.addEventListener('mousemove',e=>{if(!d)return;tx=e.clientX-px;ty=e.clientY-py;apply()});
window.addEventListener('mouseup',()=>d=false);
</script>
</body>
</html>
