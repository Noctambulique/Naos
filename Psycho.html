<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Map avec Points</title>

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
  }

  #map {
    position: relative;
    width: 100%;
    height: 100vh;
    background: #e6e6e6 url("https://i.imgur.com/6pBq4kZ.jpeg") center/cover no-repeat; /* Image de fond (modifiable) */
  }

  .point {
    position: absolute;
    cursor: pointer;
    background: white;
    padding: 4px 7px;
    border-radius: 4px;
    font-size: 14px;
    transform: translate(-50%, -50%);
    border: 1px solid #000;
    white-space: nowrap;
    transition: 0.2s;
  }

  .point:hover {
    background: #ddd;
  }

  #textDisplay {
    display: none;
    padding: 30px;
    font-size: 20px;
    line-height: 1.6;
    white-space: pre-wrap; /* Gère les \n correctement */
  }
</style>
</head>
<body>

<div id="map"></div>
<div id="textDisplay"></div>

<script>
/* --- Déclare ici les points et textes --- */
const points = [
  { title: 'Tour Est', text: "Bienvenue à la Tour Est.\nIci commence votre aventure.\n\nPrenez garde aux ombres." },
  { title: 'Marché', text: "Le marché est animé.\nVous sentez les épices et le bruit des marchands.\n\nUn mystère plane..." },
  { title: 'Port Nord', text: "Le port s'étend devant vous.\nLes vagues claquent.\n\nUne silhouette vous observe." }
];

/* --- Génération du nuage de points --- */
const map = document.getElementById("map");

points.forEach((point, i) => {
  const el = document.createElement("div");
  el.className = "point";
  el.textContent = point.title;

  /* Position aléatoire — modifiable */
  el.style.left = (10 + Math.random() * 80) + "%";
  el.style.top = (10 + Math.random() * 80) + "%";

  /* Affichage du texte au clic */
  el.onclick = () => {
    map.style.display = "none";
    const display = document.getElementById("textDisplay");

    // Remplacements automatiques des \n
    const formattedText = point.text.replace(/\\n/g, "\n");

    display.textContent = formattedText;
    display.style.display = "block";
  };

  map.appendChild(el);
});
</script>

</body>
</html>
