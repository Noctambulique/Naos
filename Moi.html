<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ma Biographie</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #f0f0f0;
      font-family: Arial, sans-serif;
    }

    #map {
      display: grid;
      grid-template-columns: repeat(8, 100px);
      gap: 2px;
      justify-content: center;
    }

    .cell {
      width: 100px;
      height: 50px;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #bebff1;

      border: 1px solid #ccc;
      cursor: pointer;
      transition: background-color 0.3s;
    }
body {
  display: flex;
  justify-content: center;
  align-items: flex-start; /* Pour éviter que ça soit tout centré verticalement */
  padding: 20px;
  background-color: #f0f0f0;
  margin: 0;
}

#map {
  display: grid;
  grid-template-columns: repeat(8, 100px);
  gap: 4px;
  justify-content: center;
}

.cell {
  width: 100px;
  height: 50px;
  display: flex;
  justify-content: center;
  align-items: center;
  background-color: #bebff1;
  border: 1px solid #ccc;
  cursor: pointer;
  transition: background-color 0.3s;
}
    
    .cell:hover {
      background-color: #e0e0e0;
    }
    #infoBox {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 10px;
      background-color: #ffffff;
      border: 1px solid #ccc;
      display: none;
      max-width: 200px;
    }
  </style>
</head>
<body>
<div id="map"></div>
  <div id="infoBox"></div>

  <script>
    // Configuration des cellules (personnalise ici)
    const cellsData = [
      { label: "‎ ", text: "Vouloir sans cesse être ailleurs, ne pas s'oublier", color: "#bebff1" },
      { label: "‎ ", text: "Difficulté à exprimer la tristesse si elle n'est pas exprimée par autrui", color: "#bebff1" },
    ];

    const map = document.getElementById("map");
    const infoBox = document.getElementById("infoBox");

    cellsData.forEach((cell) => {
      const div = document.createElement("div");
      div.className = "cell";
      div.style.backgroundColor = cell.color;
      div.textContent = cell.label;
      div.onclick = () => {
        infoBox.textContent = cell.text;
        infoBox.style.display = "block";
      };
      map.appendChild(div);
    });
  </script>
</body>
</html>
