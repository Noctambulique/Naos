<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frutiger Aero Test</title>

<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: "Segoe UI", Tahoma, system-ui, sans-serif;
}

/* FOND FRUTIGER AERO */
body {
  background:
    radial-gradient(circle at top, rgba(255,255,255,0.45), transparent 55%),
    linear-gradient(180deg, #7fb6e6, #1f3b73);
}

/* LUMIÈRE GLOBALE */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background:
    radial-gradient(circle at 15% 20%, rgba(255,255,255,0.35), transparent 40%),
    radial-gradient(circle at 85% 10%, rgba(255,255,255,0.25), transparent 45%);
  pointer-events: none;
}

/* CONTENEUR */
#scene {
  position: relative;
  width: 100%;
  height: 100%;
  z-index: 1;
}

/* RECTANGLES AERO */
.rect {
  position: absolute;
  border-radius: 18px;
  padding: 18px;

  /* VISIBILITÉ GARANTIE */
  background: linear-gradient(
    180deg,
    rgba(255,255,255,0.85),
    rgba(255,255,255,0.55)
  );

  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);

  border: 1px solid rgba(255,255,255,0.6);

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.9),
    0 12px 30px rgba(0,0,0,0.25);

  color: #0a2540;
  font-size: 18px;
  line-height: 1.4;
  white-space: pre-wrap;

  z-index: 5;
}

/* HOVER LÉGER */
.rect:hover {
  transform: translateY(-2px);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,1),
    0 18px 45px rgba(0,0,0,0.35);
}
</style>
</head>

<body>

<div id="scene"></div>

<script>
/* =========================
   PERSONNALISATION SIMPLE
   (MODIFIE UNIQUEMENT ICI)
========================= */

const RECTANGLES = [
  {
    x: 80,
    y: 120,
    w: 280,
    h: 140,
    text: "TEST 1\nRectangle visible"
  },
  {
    x: 420,
    y: 200,
    w: 300,
    h: 160,
    text: "TEST 2\nFrutiger Aero"
  },
  {
    x: 220,
    y: 420,
    w: 260,
    h: 130,
    text: "TEST 3\nTout est dans le code"
  }
]

/* =========================
   GÉNÉRATION AUTOMATIQUE
========================= */

const scene = document.getElementById("scene")

RECTANGLES.forEach(r => {
  const el = document.createElement("div")
  el.className = "rect"

  el.style.left = r.x + "px"
  el.style.top = r.y + "px"
  el.style.width = r.w + "px"
  el.style.height = r.h + "px"

  el.textContent = r.text
  scene.appendChild(el)
})
</script>

</body>
</html>
