<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Artefact</title>

  <style>
    html,body{
      height:100%;
      margin:0;
      font-family:system-ui;
      background:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    #viewer img{
      max-width:90vw;
      max-height:90vh;
      display:block;
    }

    /* colonne de contrôle */
    #bar{
      position:fixed;
      right:16px;
      top:50%;
      transform:translateY(-50%);
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:18px;
    }

    /* points simples */
    .dot{
      width:20px;
      height:20px;
      border-radius:50%;
      background:#d0d0d0;
      border:2px solid #888;
      cursor:pointer;
      transition:background .2s, transform .15s;
    }
    .dot:hover{
      transform:scale(1.15);
    }
  </style>
</head>

<body>

  <main id="viewer">
    <img id="display" src="" alt="">
  </main>

  <aside id="bar">
    <div class="dot" data-img="1"></div>
    <div class="dot" data-img="2"></div>
    <div class="dot" data-img="3"></div>
    <div class="dot" data-img="4"></div>
    <div class="dot" data-img="5"></div>
  </aside>

  <script>
    const images = [
      'D hiver/A1.png',
      'D hiver/A2.png',
      'D hiver/A3.png',
      'D hiver/A4.png',
      'D hiver/A5.png'
    ];

    const display = document.getElementById('display');
    const dots    = document.querySelectorAll('.dot');

    function showImage(n){
      if(images[n-1]) display.src = images[n-1];
    }

    dots.forEach(dot => {
      dot.addEventListener('click', () => {
        const n = Number(dot.dataset.img);
        showImage(n);
      });
    });

    // image initiale
    showImage(1);
  </script>

</body>
</html>
