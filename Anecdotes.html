<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Carrés minimalistes</title>
  <style>
    :root{
      --bg:#ffffff;
      --text:#000000;
      --square-bg:#ffffff;
      --square-border:#000;
      --square-size:130px;
      --gap:14px;
      --radius:6px;
      --font:system-ui, sans-serif;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      background:var(--bg);
      color:var(--text);
      font-family:var(--font);
      padding:40px;
      display:flex;justify-content:center;align-items:center;
    }
    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(var(--square-size),1fr));
      gap:var(--gap);
      width:100%;max-width:900px;
      transition:opacity .35s ease;
    }
    .square{
      border:1px solid var(--square-border);
      height:var(--square-size);
      display:flex;align-items:center;justify-content:center;
      border-radius:var(--radius);
      cursor:pointer;
      padding:10px;
      user-select:none;
    }
    .title{font-size:14px;text-align:center}
    .viewer{
      position:fixed;inset:0;
      background:#fff;
      display:flex;align-items:center;justify-content:center;
      padding:40px;
      opacity:0;pointer-events:none;
      transition:opacity .3s ease;
    }
    .viewer.open{opacity:1;pointer-events:auto}
    .card{max-width:700px;width:100%}
    .card h1{font-size:24px;margin-bottom:10px}
    .card p{white-space:pre-wrap;line-height:1.5;font-size:15px}
    .btn{border:1px solid #000;background:none;padding:6px 12px;cursor:pointer;margin-top:20px}
  </style>
</head>
<body>
  <div id="grid" class="grid"></div>

  <div id="viewer" class="viewer">
    <div class="card">
      <h1 id="viewerTitle"></h1>
      <p id="viewerText"></p>
      <button class="btn" id="closeViewer">Fermer</button>
    </div>
  </div>

<script>
  let data=[
    {title:'Pierre Sanglier',text:'En Moselle, Guy Grandjean, 76 ans, affirme avoir identifié 6 400 pierres en forme de sanglier, qu'il pense avoir été sculptée par une tribue gauloise. Il les entrepose chez lui, les classe dans son excel, et pense que les rechercheurs font une omerta contre lui.'},
    {title:'Infirmier',text:'Vision d'une fille qu'il pense être une entité méchante, homme qui transfère la couleur et imagine un système de paix avec les extaterrestres'},
  ];

  const grid=document.getElementById('grid');
  const viewer=document.getElementById('viewer');
  const viewerTitle=document.getElementById('viewerTitle');
  const viewerText=document.getElementById('viewerText');
  const closeViewer=document.getElementById('closeViewer');

  function render(){
    grid.innerHTML='';
    data.forEach((item,i)=>{
      const s=document.createElement('div');
      s.className='square';
      s.innerHTML=`<div class="title">${item.title}</div>`;
      s.onclick=()=>openViewer(i);
      s.ondblclick=()=>edit(i,s);
      grid.appendChild(s);
    });
  }

  function edit(i,el){
    el.contentEditable=true;
    el.focus();
    el.onblur=()=>{
      el.contentEditable=false;
      data[i].title=el.innerText.trim()||data[i].title;
      render();
    };
  }

  function openViewer(i){
    viewerTitle.innerText=data[i].title;
    viewerText.innerText=data[i].text;
    grid.style.opacity=0;
    viewer.classList.add('open');
  }

  function close(){
    viewer.classList.remove('open');
    grid.style.opacity=1;
  }

  closeViewer.onclick=close;
  document.onkeydown=e=>{if(e.key==='Escape') close();};

  render();
</script>
</body>
</html>
