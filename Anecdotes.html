<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Rectangles empilés</title>
  <style>
    body {
      background: #fafafa;
      color: #333;
      font-family: Georgia, serif;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .stack {
      width: 420px;
    }

    .card {
      background: white;
      border: 1px solid #ccc;
      border-radius: 4px;
      margin-top: -18px;
      padding: 20px 18px 24px 18px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .card:hover {
      background: #f2f2f2;
    }

    .title {
      font-weight: bold;
      font-size: 16px;
      margin: 0;
    }

    .content {
      display: none;
      font-size: 14px;
      line-height: 1.5;
      margin-top: 10px;
    }

    .card.open .content {
      display: block;
    }
  </style>
</head>
<body>
  <main class="stack" id="stack"></main>
  <script>
    const items = [
      { title: 'Carte 1 — Intro', text: 'Ceci est un texte de démonstration.\nIl contient plusieurs lignes.\n\nEt un saut de paragraphe après.' },
      { title: 'Carte 2 — Détails', text: 'Une deuxième carte.\nUtilisez \\n pour revenir à la ligne simple.' },
      { title: 'Carte 3 — Simple', text: 'Un style plus classique, moins moderne.\n\nFacile à modifier.' }
    ];

    function formatText(raw){
      raw = String(raw || '');
      const pars = raw.split('\n\n').map(p => p.replace(/\n/g, '<br>'));
      return pars.map(p => `<p>${p}</p>`).join('');
    }

    const stack = document.getElementById('stack');

    items.forEach((it, idx) => {
      const card = document.createElement('article');
      card.className = 'card';

      const title = document.createElement('div');
      title.className = 'title';
      title.textContent = it.title || `Carte ${idx+1}`;

      const content = document.createElement('div');
      content.className = 'content';
      content.innerHTML = formatText(it.text);

      card.appendChild(title);
      card.appendChild(content);

      card.addEventListener('click', () => {
        card.classList.toggle('open');
      });

      stack.appendChild(card);
    });
  </script>
</body>
</html>
