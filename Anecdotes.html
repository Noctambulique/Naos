<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Carrés minimalistes</title>
<style>
:root {
  --gap: 22px;
  --radius: 14px;

  --aero-white: #e8faff;
  --aero-glass: rgba(255,255,255,.55);

  --shadow-dark: 0 8px 22px rgba(0,0,0,.45);
}

/* Fond Frutiger Aero */
html, body {
  margin: 0;
  height: 100%;
  font-family: "Segoe UI", Tahoma, sans-serif;
  background: radial-gradient(circle at 70% 20%, #bafffc 0%, #5dc8ff 35%, #0074d9 100%);
  background-attachment: fixed;
  color: #002242;
  overflow-x: hidden;
}

/* Nuages */
html::before {
  content:"";
  position: fixed;
  inset:0;
  pointer-events:none;
  background:url('https://frutiger-aero.org/img/frutiger-aero-6.webp') center/cover no-repeat;
  opacity: .22;
  filter: blur(2px);
}

/* Mise en page */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: var(--gap);
  padding: 40px;
  max-width: 1150px;
  margin:auto;
}

/* → Les items deviennent de vraies cartes */
.card {
  position: relative;
  border-radius: var(--radius);
  overflow:hidden;
  min-height: 160px;
  padding: 16px;
  border: 1px solid rgba(255,255,255,0.8);
  background: linear-gradient(
    135deg,
    var(--aero-white) 0%,
    rgba(255,255,255,.75) 40%,
    var(--aero-glass) 100%
  );
  box-shadow:
    var(--shadow-dark),
    inset 0 0 20px rgba(255,255,255,0.7);
  cursor: pointer;
  transition: .18s ease-out;
  backdrop-filter: blur(4px);
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
}

/* Reflet glossy */
.card::before {
  content:"";
  position:absolute;top:0;left:0;
  width:100%;height:45%;
  background:linear-gradient(rgba(255,255,255,.85),rgba(255,255,255,.1));
  pointer-events:none;
}

.card:hover {
  transform: translateY(-6px) scale(1.03);
  box-shadow:
    0 12px 26px rgba(0,0,0,.5),
    inset 0 0 26px rgba(255,255,255,.92);
}

/* Viewer */
#viewer {
  position:fixed;
  inset:0;
  backdrop-filter: blur(16px);
  background:rgba(0,0,0,0.35);
  display:flex;
  justify-content:center;
  align-items:center;
  opacity:0;
  pointer-events:none;
  transition:.25s;
}

/* Ouverture */
#viewer.open {
  opacity:1;
  pointer-events:auto;
}

/* Carte dans viewer */
#viewer .card {
  width: 480px;
  min-height: 300px;
  transform: scale(0.8);
  opacity:0;
  animation: pop .3s forwards ease;
}

@keyframes pop {
 from { opacity:0; transform:scale(.8) translateY(10px);}
 to   { opacity:1; transform:scale(1) translateY(0);}
}

/* Titre */
.card .title,
#viewerTitle {
  font-size: 21px;
  font-weight:600;
  color:#004a82;
  text-shadow:0 1px 0 rgba(255,255,255,.8);
  margin-bottom:8px;
}

/* Texte */
#viewerText {
  font-size:16px;
  line-height:1.55;
  padding:0 10px;
}

/* Bouton */
.btn {
  margin-top:18px;
  padding:10px 24px;
  background:linear-gradient(#70e6ff,#0094d8);
  border:none;
  border-radius:var(--radius);
  cursor:pointer;
  font-size:16px;
  color:#002543;
  box-shadow:0 4px 10px rgba(0,0,0,.3);
  text-shadow:0 1px 0 rgba(255,255,255,.8);
}
.btn:hover {
  transform:translateY(-3px);
}
</style>
</head>
<body>
  <div id="grid" class="grid"></div>

  <div id="viewer" class="viewer">
    <div class="card">
      <h1 id="viewerTitle"></h1>
      <p id="viewerText"></p>
      <button class="btn" id="closeViewer">Fermer</button>
    </div>
  </div>

<script>
  let data=[
    {title:'Pierre Sanglier',text:'En Moselle, Guy Grandjean, 76 ans, affirme avoir identifié 6 400 pierres en forme de sanglier, et spécule que ces pierront ont été sculptée par une tribue gauloise. Il les entrepose chez lui, les classe dans son excel, et pense que les rechercheurs font une omerta contre lui.'},
    {title:'Infirmier',text:'Un homme voit une fille et pense que cette dernière est une entité méchante, homme qui transfère la couleur et imagine un système de paix avec les extaterrestres'},
  ];

  const grid=document.getElementById('grid');
  const viewer=document.getElementById('viewer');
  const viewerTitle=document.getElementById('viewerTitle');
  const viewerText=document.getElementById('viewerText');
  const closeViewer=document.getElementById('closeViewer');

  function render(){
    grid.innerHTML='';
    data.forEach((item,i)=>{
      const s=document.createElement('div');
      s.className='square';
      s.innerHTML=`<div class="title">${item.title}</div>`;
      s.onclick=()=>openViewer(i);
      s.ondblclick=()=>edit(i,s);
      grid.appendChild(s);
    });
  }

  function edit(i,el){
    el.contentEditable=true;
    el.focus();
    el.onblur=()=>{
      el.contentEditable=false;
      data[i].title=el.innerText.trim()||data[i].title;
      render();
    };
  }

  function openViewer(i){
    viewerTitle.innerText=data[i].title;
    viewerText.innerText=data[i].text;
    grid.style.opacity=0;
    viewer.classList.add('open');
  }

  function close(){
    viewer.classList.remove('open');
    grid.style.opacity=1;
  }

  closeViewer.onclick=close;
  document.onkeydown=e=>{if(e.key==='Escape') close();};

  render();
</script>
</body>
</html>
