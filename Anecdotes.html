<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Carrés minimalistes</title>

  <style>
 :root{
  --text:#003255;
  --square-size:150px;
  --gap:22px;
  --radius:18px;
  --font:"Segoe UI", Tahoma, sans-serif;
}

/* Reset */
*{margin:0;padding:0;box-sizing:border-box}

body{
  min-height:100vh;
  background:url("https://i.redd.it/frutiger-aero-bliss-windows-xp-wallpaper-v0-e1qk8viiotge1.jpg?width=3500&format=pjpg&auto=webp&s=77817de61b5375d2dbc623c1c14096934364322c")
    center/cover fixed no-repeat;
  font-family:var(--font);
  color:var(--text);
  padding:80px 30px;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  backdrop-filter:saturate(145%);
  overflow:hidden;
}

/* Halo lumineux façon W7 */
body::before{
  content:"";
  position:fixed;inset:0;
  background:radial-gradient(circle at 50% -20%,
    rgba(255,255,255,.85),
    rgba(255,255,255,0) 70%);
  filter:blur(45px);
  pointer-events:none;
  opacity:.85;
}

/* Grille */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(var(--square-size),1fr));
  gap:var(--gap);
  width:100%;
  max-width:1100px;
  transition:opacity .35s ease;
}

/* Tuiles AERO GLASS */
.square{
  background:linear-gradient(130deg,
    rgba(255,255,255,.92) 0%,
    rgba(185,235,255,.78) 50%,
    rgba(115,210,255,.75) 100%);
  border-radius:var(--radius);
  border:1px solid rgba(255,255,255,.95);
  backdrop-filter:blur(7px) saturate(180%);
  height:var(--square-size);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  padding:10px;
  box-shadow:
    0 8px 26px rgba(0,70,130,.28),
    inset 0 1px 0 rgba(255,255,255,.85),
    inset 0 -6px 14px rgba(0,100,200,.28);
  transition:.25s cubic-bezier(.19,.65,.23,1.2);
}

/* Hover dynamique + lumière */
.square:hover{
  transform:translateY(-10px) scale(1.1);
  box-shadow:
    0 16px 40px rgba(0,70,130,.38),
    inset 0 2px 1px rgba(255,255,255,.96);
  background:linear-gradient(130deg,
    rgba(255,255,255,.96),
    rgba(205,245,255,.90),
    rgba(135,230,255,.88));
}

/* Texte tuile */
.title{
  font-size:18px;
  font-weight:700;
  text-align:center;
  text-shadow:0 1px 0 rgba(255,255,255,1),
              0 0 6px rgba(255,255,255,.75);
}

/* Viewer */
.viewer{
  position:fixed;inset:0;
  background:rgba(0,50,100,.35);
  backdrop-filter:blur(10px) saturate(160%);
  display:flex;
  justify-content:center;
  align-items:center;
  padding:50px;
  opacity:0;
  pointer-events:none;
  transition:opacity .35s ease;
}
.viewer.open{
  opacity:1;
  pointer-events:auto;
}

/* Fenêtre style Windows Aero */
.card{
  width:100%;
  max-width:780px;
  padding:40px 45px;
  border-radius:20px;
  background:linear-gradient(to bottom,
    rgba(255,255,255,.95),
    rgba(225,245,255,.88));
  border:1px solid rgba(255,255,255,.92);
  box-shadow:
    0 18px 48px rgba(0,0,0,.45),
    inset 0 2px 0 rgba(255,255,255,.9),
    inset 0 -8px 20px rgba(50,120,200,.2);
  animation:pop .32s cubic-bezier(.19,.75,.35,1) both;
}

@keyframes pop{
  from{transform:scale(.85) translateY(30px);opacity:0;}
  to{transform:none;opacity:1;}
}

.card h1{
  font-size:28px;
  margin-bottom:18px;
  color:#0057a8;
  text-shadow:0 1px 0 rgba(255,255,255,.9);
}
.card p{
  font-size:18px;
  line-height:1.6;
  color:#002d50;
  white-space:pre-wrap;
}

/* Bouton Windows 7 */
.btn{
  margin-top:28px;
  padding:10px 24px;
  background:linear-gradient(#dfffff,#9ae4ff);
  border:1px solid #0076c9;
  border-radius:12px;
  font-weight:600;
  cursor:pointer;
  color:#005091;
  box-shadow:0 5px 14px rgba(0,0,0,.28);
  text-shadow:0 1px 0 rgba(255,255,255,1);
  transition:.2s ease;
}
.btn:hover{
  transform:translateY(-3px);
  background:linear-gradient(#ffffff,#c4f1ff);
}


  </style>

</head>

<body>
  <div id="grid" class="grid"></div>

  <div id="viewer" class="viewer">
    <div class="card">
      <h1 id="viewerTitle"></h1>
      <p id="viewerText"></p>
      <button class="btn" id="closeViewer">Fermer</button>
    </div>
  </div>

<script>
  let data=[
    {title:'Pierre Sanglier',text:'En Moselle, Guy Grandjean, 76 ans, affirme avoir identifié 6 400 pierres en forme de sanglier, et spécule que ces pierront ont été sculptée par une tribue gauloise. Il les entrepose chez lui, les classe dans son excel, et pense que les rechercheurs font une omerta contre lui.'},
    {title:'Infirmier',text:'Un homme voit une fille et pense que cette dernière est une entité méchante, homme qui transfère la couleur et imagine un système de paix avec les extaterrestres'},
    {title:'X',text:'X'},
  ];

  const grid=document.getElementById('grid');
  const viewer=document.getElementById('viewer');
  const viewerTitle=document.getElementById('viewerTitle');
  const viewerText=document.getElementById('viewerText');
  const closeViewer=document.getElementById('closeViewer');

  function render(){
    grid.innerHTML='';
    data.forEach((item,i)=>{
      const s=document.createElement('div');
      s.className='square';
      s.innerHTML=`<div class="title">${item.title}</div>`;
      s.onclick=()=>openViewer(i);
      s.ondblclick=()=>edit(i,s);
      grid.appendChild(s);
    });
  }

  function edit(i,el){
    el.contentEditable=true;
    el.focus();
    el.onblur=()=>{
      el.contentEditable=false;
      data[i].title=el.innerText.trim()||data[i].title;
      render();
    };
  }

function openViewer(i){
  viewerTitle.innerText = data[i].title;
  viewerText.innerHTML = data[i].text.replace(/\n/g, '<br>');
  grid.style.opacity = 0;
  viewer.classList.add('open');
}


  function close(){
    viewer.classList.remove('open');
    grid.style.opacity=1;
  }

  closeViewer.onclick=close;
  document.onkeydown=e=>{if(e.key==='Escape') close();};

  render();
</script>
</body>
</html>
