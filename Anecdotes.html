<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Carrés minimalistes</title>
<style>
:root {
  --radius: 12px;
  --gap: 20px;
  --square-size: 150px;

  --win7-blue1: #e8f5ff;
  --win7-blue2: #cbe8ff;
  --win7-blue3: #a5d7ff;
  --win7-glass: rgba(255,255,255,0.5);

  --shadow: 0 10px 26px rgba(0,0,0,0.35);
}

/* FOND AERO */
body {
  margin: 0;
  height: 100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:
    linear-gradient(145deg,#c9eaff 0%,#75b7ff 50%,#0073d0 100%);
  font-family: "Segoe UI", Tahoma, sans-serif;
  overflow:hidden;
}

/* EFFET LUMIÈRE AERO */
body::before {
  content:"";
  position: fixed;
  inset:0;
  pointer-events:none;
  background: radial-gradient(circle at 60% 20%, rgba(255,255,255,.45), transparent 65%);
}

/* GRILLE */
.grid {
  width:100%;
  max-width:900px;
  display:grid;
  gap: var(--gap);
  grid-template-columns: repeat(auto-fill, minmax(var(--square-size),1fr));
  transition: opacity .3s ease-out;
  padding:20px;
}

/* CARTES WINDOWS 7 */
.square {
  position:relative;
  height: var(--square-size);
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  cursor:pointer;
  padding:12px;
  border-radius: var(--radius);

  /* Glass Aero */
  background: linear-gradient(
      145deg,
      var(--win7-blue1) 0%,
      var(--win7-blue2) 45%,
      var(--win7-blue3) 100%
  );

  border:1px solid rgba(255,255,255,0.85);
  box-shadow:
    var(--shadow),
    inset 0 0 10px rgba(255,255,255,.8);

  backdrop-filter: blur(8px) saturate(130%);
  transition:.2s ease-in-out;
}

/* REFLET GLOSSY */
.square::before {
  content:"";
  position:absolute;
  top:0;
  width:100%; height:45%;
  border-radius:inherit;
  background: linear-gradient(
    rgba(255,255,255,.8),
    rgba(255,255,255,.05)
  );
  pointer-events:none;
}

.square:hover {
  transform: translateY(-6px);
  box-shadow:
    0 12px 30px rgba(0,0,0,0.5),
    inset 0 0 15px rgba(255,255,255,.95);
}

/* TITRE DANS LES CARTES */
.title {
  font-size: 15px;
  font-weight: 600;
  color: #004b81;
  text-shadow: 0 1px 1px rgba(255,255,255,.85);
}

/* VIEWER = FENÊTRE AERO */
.viewer {
  position:fixed;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  background: rgba(0,0,0,0.45);
  backdrop-filter: blur(6px);
  opacity:0;
  pointer-events:none;
  transition:.25s ease-in-out;
}

.viewer.open {
  opacity:1;
  pointer-events:auto;
}

/* CONTENU DE LA FENÊTRE */
.card {
  background: linear-gradient(
    rgba(255,255,255,.92),
    rgba(210,240,255,.88)
  );
  border-radius: var(--radius);
  padding: 34px;
  width: 550px;
  max-width: 90vw;
  border:1px solid rgba(255,255,255,.9);
  box-shadow:
    0 0 0 2px rgba(0,160,255,.45),
    0 18px 38px rgba(0,0,0,.55);
  animation: zoom .28s ease-out;
}

@keyframes zoom {
  from {opacity:0; transform:scale(.8) translateY(10px);}
  to   {opacity:1; transform:scale(1) translateY(0);}
}

/* TITRE VIEWER */
.card h1 {
  font-size: 23px;
  margin-bottom: 12px;
  color: #003f70;
  text-shadow:0 1px 0 rgba(255,255,255,.9);
}

/* TEXTE VIEWER */
.card p {
  font-size: 16px;
  line-height: 1.6;
  color:#00325a;
  margin-bottom: 18px;
}

/* BOUTON WIN7 */
.btn {
  padding:10px 22px;
  font-size:15px;
  cursor:pointer;
  border-radius: var(--radius);
  border:1px solid #0074c5;
  color:#00365e;
  background: linear-gradient(#dff3ff,#8cd4ff);
  box-shadow: 0 3px 8px rgba(0,0,0,.25);
  text-shadow:0 1px 0 rgba(255,255,255,.9);
}

.btn:hover {
  background: linear-gradient(#f3fcff,#99dbff);
  transform:translateY(-2px);
}

<script>
  let data=[
    {title:'Pierre Sanglier',text:'En Moselle, Guy Grandjean, 76 ans, affirme avoir identifié 6 400 pierres en forme de sanglier, et spécule que ces pierront ont été sculptée par une tribue gauloise. Il les entrepose chez lui, les classe dans son excel, et pense que les rechercheurs font une omerta contre lui.'},
    {title:'Infirmier',text:'Un homme voit une fille et pense que cette dernière est une entité méchante, homme qui transfère la couleur et imagine un système de paix avec les extaterrestres'},
  ];

  const grid=document.getElementById('grid');
  const viewer=document.getElementById('viewer');
  const viewerTitle=document.getElementById('viewerTitle');
  const viewerText=document.getElementById('viewerText');
  const closeViewer=document.getElementById('closeViewer');

  function render(){
    grid.innerHTML='';
    data.forEach((item,i)=>{
      const s=document.createElement('div');
      s.className='square';
      s.innerHTML=`<div class="title">${item.title}</div>`;
      s.onclick=()=>openViewer(i);
      s.ondblclick=()=>edit(i,s);
      grid.appendChild(s);
    });
  }

  function edit(i,el){
    el.contentEditable=true;
    el.focus();
    el.onblur=()=>{
      el.contentEditable=false;
      data[i].title=el.innerText.trim()||data[i].title;
      render();
    };
  }

  function openViewer(i){
    viewerTitle.innerText=data[i].title;
    viewerText.innerText=data[i].text;
    grid.style.opacity=0;
    viewer.classList.add('open');
  }

  function close(){
    viewer.classList.remove('open');
    grid.style.opacity=1;
  }

  closeViewer.onclick=close;
  document.onkeydown=e=>{if(e.key==='Escape') close();};

  render();
</script>
</body>
</html>
