<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Carrés minimalistes</title>

  <style>
 :root {
  --bg: radial-gradient(circle at 50% 0%, #d9f1ff 0%, #9ed5ff 45%, #0070c9 100%);
  --text: #003b67;
  --square-size: 150px;
  --gap: 18px;
  --radius: 14px;
  --font: "Segoe UI", Tahoma, sans-serif;
}

/* Reset */
* { margin:0; padding:0; box-sizing:border-box; }

/* Fond + halo haut Windows 7 */
body {
  min-height:100vh;
  background: var(--bg);
  font-family: var(--font);
  color: var(--text);
  padding:70px 40px;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  overflow-x:hidden;
}

body::before {
  content:"";
  position:fixed;
  top:0; left:0; right:0;
  height:180px;
  pointer-events:none;
  background: radial-gradient(circle at 50% 0%,
    rgba(255,255,255,.9) 0%,
    rgba(255,255,255,0) 75%
  );
  filter:blur(32px);
  opacity:.55;
}

/* Grid */
.grid {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(var(--square-size),1fr));
  gap:var(--gap);
  width:100%;
  max-width:960px;
  transition:opacity .35s ease;
}

/* Carrés — vrai Aero Glass */
.square {
  background: linear-gradient(135deg,
    rgba(255,255,255,.82) 0%,
    rgba(219,244,255,.72) 45%,
    rgba(170,230,255,.62) 100%
  );
  border-radius: var(--radius);
  height: var(--square-size);
  display:flex;
  justify-content:center;
  align-items:center;
  cursor:pointer;
  padding:12px;
  user-select:none;
  border:1px solid rgba(255,255,255,.9);
  box-shadow:
    0 4px 12px rgba(0,40,80,.32),
    inset 0 1px 1px rgba(255,255,255,.9),
    inset 0 -4px 12px rgba(0,60,120,.25);
  transition:.25s cubic-bezier(.22,.61,.36,1);
}

.square:hover {
  transform:translateY(-7px) scale(1.08);
  box-shadow:
    0 14px 30px rgba(0,40,80,.35),
    inset 0 2px 2px rgba(255,255,255,.95);
}

/* Titre sur le carré */
.title {
  text-align:center;
  font-size:16px;
  line-height:1.2;
  font-weight:700;
  color:#004a75;
  text-shadow:0 1px 0 rgba(255,255,255,.95);
}

/* Fenêtre Viewer style Windows 7 */
.viewer {
  position:fixed;
  inset:0;
  background:rgba(0,45,85,.28);
  backdrop-filter:blur(12px) saturate(180%);
  display:flex;
  justify-content:center;
  align-items:center;
  padding:40px;
  opacity:0;
  pointer-events:none;
  transition:opacity .3s ease;
}
.viewer.open {
  opacity:1;
  pointer-events:auto;
}

/* Carte fenêtre Explorer */
.card {
  width:100%;
  max-width:760px;
  padding:40px;
  border-radius:18px;
  background:linear-gradient(to bottom,#ffffff 0%,#e8f5ff 100%);
  border:1px solid rgba(255,255,255,.75);
  box-shadow:
    0 10px 40px rgba(0,0,0,.45),
    inset 0 1px 0 rgba(255,255,255,.8),
    inset 0 -4px 12px rgba(0,100,180,.25);
  animation:win7Open .38s cubic-bezier(.19,.75,.35,1) both;
}

@keyframes win7Open {
  from { transform:scale(.85) translateY(20px); opacity:0; }
  to   { transform:scale(1) translateY(0); opacity:1; }
}

/* Texte viewer */
.card h1 {
  font-size:28px;
  margin-bottom:18px;
  font-weight:700;
  color:#004f9a;
  text-shadow:0 1px 0 rgba(255,255,255,1);
}

.card p {
  font-size:17px;
  line-height:1.6;
  color:#00385f;
  white-space:pre-wrap;
}

/* Bouton Windows 7 */
.btn {
  margin-top:28px;
  padding:9px 20px;
  background:linear-gradient(#d2f5ff,#98e1ff);
  border:1px solid #0080d2;
  border-radius:10px;
  font-weight:600;
  cursor:pointer;
  color:#00528f;
  text-shadow:0 1px 0 rgba(255,255,255,.9);
  box-shadow:0 4px 10px rgba(0,0,0,.25);
  transition:.2s ease;
}
.btn:hover {
  background:linear-gradient(#ffffff,#bdf0ff);
  transform:translateY(-3px);
  box-shadow:0 7px 16px rgba(0,0,0,.35);
}

  </style>

</head>

<body>
  <div id="grid" class="grid"></div>

  <div id="viewer" class="viewer">
    <div class="card">
      <h1 id="viewerTitle"></h1>
      <p id="viewerText"></p>
      <button class="btn" id="closeViewer">Fermer</button>
    </div>
  </div>

<script>
  let data=[
    {title:'Pierre Sanglier',text:'En Moselle, Guy Grandjean, 76 ans, affirme avoir identifié 6 400 pierres en forme de sanglier, et spécule que ces pierront ont été sculptée par une tribue gauloise. Il les entrepose chez lui, les classe dans son excel, et pense que les rechercheurs font une omerta contre lui.'},
    {title:'Infirmier',text:'Un homme voit une fille et pense que cette dernière est une entité méchante, homme qui transfère la couleur et imagine un système de paix avec les extaterrestres'},
  ];

  const grid=document.getElementById('grid');
  const viewer=document.getElementById('viewer');
  const viewerTitle=document.getElementById('viewerTitle');
  const viewerText=document.getElementById('viewerText');
  const closeViewer=document.getElementById('closeViewer');

  function render(){
    grid.innerHTML='';
    data.forEach((item,i)=>{
      const s=document.createElement('div');
      s.className='square';
      s.innerHTML=`<div class="title">${item.title}</div>`;
      s.onclick=()=>openViewer(i);
      s.ondblclick=()=>edit(i,s);
      grid.appendChild(s);
    });
  }

  function edit(i,el){
    el.contentEditable=true;
    el.focus();
    el.onblur=()=>{
      el.contentEditable=false;
      data[i].title=el.innerText.trim()||data[i].title;
      render();
    };
  }

  function openViewer(i){
    viewerTitle.innerText=data[i].title;
    viewerText.innerText=data[i].text;
    grid.style.opacity=0;
    viewer.classList.add('open');
  }

  function close(){
    viewer.classList.remove('open');
    grid.style.opacity=1;
  }

  closeViewer.onclick=close;
  document.onkeydown=e=>{if(e.key==='Escape') close();};

  render();
</script>
</body>
</html>
