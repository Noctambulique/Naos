<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Page interactive mobile</title>
<style>
  body{
    margin:0;
    font-family:sans-serif;
    background:#f2f2f2;
    overflow:hidden;
  }
  #container{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:auto;
    touch-action:manipulation;
    background:#fff;
  }
  .marker{
    position:absolute;
    width:80px;
    height:80px;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 2px 6px rgba(0,0,0,0.2);
    cursor:pointer;
  }
  .marker img{
    width:100%; height:100%; object-fit:cover;
  }

  #panel{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    background:#fff;
    border-top-left-radius:20px;
    border-top-right-radius:20px;
    box-shadow:0 -3px 14px rgba(0,0,0,.25);
    padding:16px;
    transform:translateY(100%);
    transition:transform .25s ease;
    max-height:70vh;
    overflow:auto;
  }
  #panel.open{transform:translateY(0)}

  #returnBtn{
    position:fixed;
    top:12px;
    left:12px;
    background:#000;
    color:#fff;
    padding:8px 14px;
    border-radius:10px;
    font-size:14px;
    cursor:pointer;
    z-index:200;
  }
  #labelBtn{
    margin-top:10px;
    background:#222;
    color:#fff;
    padding:8px 12px;
    border-radius:8px;
    font-size:14px;
    cursor:pointer;
  }
</style>
</head>
<body>
<div id="returnBtn" onclick="closePanel()">Retour</div>
<div id="container"></div>

<div id="panel">
  <img id="panelImg" style="width:100%; border-radius:12px; margin-bottom:12px;" />
  <div id="panelText" style="white-space:pre-line; font-size:16px; line-height:1.4;"></div>
  <div id="labelBtn" onclick="alert(currentLabel)">Voir label</div>
</div>

<script>
  const data = [
    {
      x: 200, y: 150,
      img: "Biblio/Adorno Theodor.jpg",
      type: "info",
      label:"Adorno Theodor",
      contentImg:"Biblio/Adorno Theodor.jpg",
      contentText:"Adorno dans la \n "
    }
  ];

  const container = document.getElementById("container");
  const panel = document.getElementById("panel");
  let currentLabel = "";

  function createMarkers(){
    data.forEach(item =>{
      const m = document.createElement("div");
      m.className = "marker";
      m.style.left = item.x + "px";
      m.style.top = item.y + "px";
      m.innerHTML = `<img src="${item.img}">`;
      m.onclick = ()=> openPanel(item);
      container.appendChild(m);
    });
  }

  function openPanel(item){
    currentLabel = item.label;
    document.getElementById("panelImg").src = item.contentImg;
    document.getElementById("panelText").textContent = item.contentText;
    panel.classList.add("open");
  }
  function closePanel(){ panel.classList.remove("open"); }

  createMarkers();
</script>
</body>
</html>
