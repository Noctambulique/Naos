<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Index de sujets</title>

<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">

<style>
  body{
    margin:0;
    min-height:100vh;
    background:#fafafa;
    color:#111;
    font-family:"Libre Baskerville", serif;
    display:flex;
    justify-content:center;
    align-items:center;
  }

  .sheet{
    width:90%;
    max-width:680px;
    background:#fff;
    padding:48px;
    box-shadow:0 0 0 1px rgba(0,0,0,0.06);
  }

  h1{
    font-size:1.1rem;
    font-weight:400;
    margin-bottom:36px;
    letter-spacing:0.3px;
  }

  .topic{
    display:flex;
    gap:12px;
    margin-bottom:22px;
    font-size:0.95rem;
    line-height:1.5;
  }

  .topic input{
    margin-top:3px;
  }

  .progress{
    margin-top:44px;
  }

  .track{
    height:6px;
    background:#e2e2e2;
  }

  .fill{
    height:100%;
    width:0%;
    background:#111;
    transition:width 0.25s ease;
  }

  .percent{
    margin-top:8px;
    font-size:0.8rem;
    text-align:right;
    color:#555;
  }
</style>
</head>

<body>

<div class="sheet">

  <h1>Index thématique</h1>

  <div class="topic">
    <input type="checkbox" class="check">
    <label>Ce sujet concerne les gens obsessionnels créatifs.</label>
  </div>

  <div class="topic">
    <input type="checkbox" class="check">
    <label>Ce sujet explore l’ordre et le chaos.</label>
  </div>

  <div class="topic">
    <input type="checkbox" class="check">
    <label>Ce sujet traite l'anticipation de l'esprit humain.</label>
  </div>

  <div class="topic">
    <input type="checkbox" class="check">
    <label>Ce sujet aborde le dépassement des facultés humaines.</label>
  </div>


  <div class="progress">
    <div class="track">
      <div class="fill" id="fill"></div>
    </div>
    <div class="percent" id="percent">0%</div>
  </div>

</div>

<script>
  const checks = document.querySelectorAll(".check");
  const fill = document.getElementById("fill");
  const percent = document.getElementById("percent");

  function update(){
    const total = checks.length;
    const active = [...checks].filter(c => c.checked).length;
    const value = Math.round((active / total) * 100);
    fill.style.width = value + "%";
    percent.textContent = value + "%";
  }

  checks.forEach(c => c.addEventListener("change", update));
</script>

</body>
</html>
