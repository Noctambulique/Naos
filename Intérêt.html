<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Index de sujets</title>

<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">

<style>
  body{
    margin:0;
    min-height:100vh;
    background:#e8ecd6; /* vert clair mat */
    font-family:"Libre Baskerville", serif;
    display:flex;
    justify-content:center;
    align-items:center;
    color:#1e1e1e;
  }

  .sheet{
    width:90%;
    max-width:680px;
    padding:44px;
    background:#f6f2da;
    border:4px solid #6c7c3f;
    box-shadow:8px 8px 0 #4f5a2d;
  }

  h1{
    font-size:1.2rem;
    font-weight:700;
    margin-bottom:36px;
    letter-spacing:0.4px;
    color:#2f3a1e;
  }

  .topic{
    display:flex;
    align-items:flex-start;
    gap:14px;
    margin-bottom:20px;
    padding:14px;
    background:#dfe6b8;
    border:3px solid #6f7f3a;
    box-shadow:4px 4px 0 #566128;
    font-size:0.95rem;
    line-height:1.55;
  }

  .topic input{
    margin-top:4px;
    accent-color:#4f6228;
    transform:scale(1.1);
  }

  .progress{
    margin-top:40px;
  }

  .track{
    height:12px;
    background:#c8d09b;
    border:3px solid #6b7a3a;
  }

  .fill{
    height:100%;
    width:0%;
    background:#4f6228;
    transition:width 0.25s ease;
  }

  .percent{
    margin-top:10px;
    font-size:0.85rem;
    text-align:right;
    color:#2f3a1e;
    font-weight:600;
  }
</style>
</head>

<body>

<div class="sheet">

  <h1>Index thématique</h1>

  <div class="topic">
    <input type="checkbox" class="check">
    <label>Ce sujet concerne des gens obsessionnels créatifs.</label>
  </div>

  <div class="topic">
    <input type="checkbox" class="check">
    <label>Ce sujet explore l’ordre et le chaos.</label>
  </div>

  <div class="topic">
    <input type="checkbox" class="check">
    <label>Ce sujet traite l’anticipation de l’esprit humain.</label>
  </div>

  <div class="topic">
    <input type="checkbox" class="check">
    <label>Ce sujet aborde le dépassement des facultés humaines.</label>
  </div>

  <div class="progress">
    <div class="track">
      <div class="fill" id="fill"></div>
    </div>
    <div class="percent" id="percent">0%</div>
  </div>

</div>

<script>
  const checks = document.querySelectorAll(".check");
  const fill = document.getElementById("fill");
  const percent = document.getElementById("percent");

  function update(){
    const total = checks.length;
    const active = [...checks].filter(c => c.checked).length;
    const value = Math.round((active / total) * 100);
    fill.style.width = value + "%";
    percent.textContent = value + "%";
  }

  checks.forEach(c => c.addEventListener("change", update));
</script>

</body>
</html>
