<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Index</title>

<style>
body{
  margin:0;
  height:100vh;
  font-family: "Trebuchet MS", Arial, sans-serif;
  background:
    linear-gradient(#1d74c9 0%, #5fb2ff 40%, #6fcf6a 70%, #4aa04a 100%);
  overflow:hidden;
}

/* CIEL */
.sky{
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 80% 20%, #ffffff 0%, transparent 45%),
    radial-gradient(circle at 20% 15%, #ffffff 0%, transparent 40%);
  opacity:0.9;
}

/* SOL */
.ground{
  position:absolute;
  bottom:0;
  width:100%;
  height:35%;
  background:#4fb14f;
}

/* BULLES */
.bubble{
  position:absolute;
  border-radius:50%;
  background:rgba(255,255,255,0.35);
  border:2px solid #ffffff;
}

.b1{ width:180px; height:180px; top:8%; left:12%; }
.b2{ width:120px; height:120px; top:20%; right:15%; }
.b3{ width:90px;  height:90px;  bottom:18%; right:28%; }

/* PANNEAU */
.panel{
  position:absolute;
  bottom:8%;
  left:50%;
  transform:translateX(-50%);
  background:#eaffcc;
  border:5px solid #5b8e2d;
  padding:28px;
  width:420px;
  box-shadow:6px 6px 0 #3f6b1e;
}

.panel h1{
  margin:0 0 20px;
  font-size:1.4rem;
  color:#2e4a1a;
}

.item{
  background:#d9f09a;
  border:3px solid #6c9832;
  padding:10px;
  margin-bottom:10px;
}
</style>
</head>

<body>

<div class="sky"></div>

<div class="bubble b1"></div>
<div class="bubble b2"></div>
<div class="bubble b3"></div>

<div class="ground"></div>

<div class="panel">
  <h1>Index thématique</h1>
  <div class="item">Créativité obsessionnelle</div>
  <div class="item">Ordre et chaos</div>
  <div class="item">Anticipation mentale</div>
  <div class="item">Extension des facultés humaines</div>
</div>

</body>
</html>
