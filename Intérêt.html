<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Index thématique</title>

<link href="https://fonts.googleapis.com/css2?family=Trebuchet+MS&display=swap" rel="stylesheet">

<style>
  body{
    margin:0;
    min-height:100vh;
    background:#6db7ff;
    font-family:"Trebuchet MS", sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    color:#1a1a1a;
  }

  .sheet{
    width:90%;
    max-width:720px;
    padding:44px;
    background:#b8e26a;
    border:6px solid #4f7d1c;
    box-shadow:10px 10px 0 #3a5f15;
  }

  h1{
    font-size:1.6rem;
    margin-bottom:32px;
    color:#1e3b0c;
    letter-spacing:0.5px;
  }

  .topic{
    display:flex;
    align-items:flex-start;
    gap:14px;
    margin-bottom:18px;
    padding:16px;
    background:#d9f28f;
    border:4px solid #6e9829;
    box-shadow:4px 4px 0 #557a1c;
  }

  .topic input{
    margin-top:4px;
    width:18px;
    height:18px;
    accent-color:#4a7c1a;
  }

  .topic label{
    font-size:0.95rem;
    line-height:1.45;
  }

  .progress{
    margin-top:40px;
  }

  .track{
    height:18px;
    background:#c4e682;
    border:4px solid #6b9630;
  }

  .fill{
    height:100%;
    width:0%;
    background:#4a7c1a;
    transition:width 0.25s ease;
  }

  .percent{
    margin-top:10px;
    font-size:0.9rem;
    text-align:right;
    color:#2e4a12;
    font-weight:600;
  }
</style>
</head>

<body>

<div class="sheet">

  <h1>Index thématique</h1>

  <div class="topic">
    <input type="checkbox" class="check">
    <label>Ce sujet concerne des gens obsessionnels créatifs.</label>
  </div>

  <div class="topic">
    <input type="checkbox" class="check">
    <label>Ce sujet explore l’ordre et le chaos.</label>
  </div>

  <div class="topic">
    <input type="checkbox" class="check">
    <label>Ce sujet traite l’anticipation de l’esprit humain.</label>
  </div>

  <div class="topic">
    <input type="checkbox" class="check">
    <label>Ce sujet aborde le dépassement des facultés humaines.</label>
  </div>

  <div class="progress">
    <div class="track">
      <div class="fill" id="fill"></div>
    </div>
    <div class="percent" id="percent">0%</div>
  </div>

</div>

<script>
  const checks = document.querySelectorAll(".check");
  const fill = document.getElementById("fill");
  const percent = document.getElementById("percent");

  function update(){
    const total = checks.length;
    const active = [...checks].filter(c => c.checked).length;
    const value = Math.round((active / total) * 100);
    fill.style.width = value + "%";
    percent.textContent = value + "%";
  }

  checks.forEach(c => c.addEventListener("change", update));
</script>

</body>
</html>
