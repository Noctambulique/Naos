<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Index de sujets</title>

<link href="https://fonts.googleapis.com/css2?family=Trebuchet+MS&display=swap" rel="stylesheet">

<style>
  body{
    margin:0;
    min-height:100vh;
    background:#ffd84d;
    font-family:"Trebuchet MS", sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    color:#222;
  }

  .sheet{
    width:90%;
    max-width:700px;
    background:#fff176;
    border:6px solid #ff9f1c;
    box-shadow:10px 10px 0 #d97706;
    padding:40px;
  }

  h1{
    font-size:1.4rem;
    margin-bottom:30px;
    color:#1e1e1e;
    text-transform:uppercase;
    letter-spacing:1px;
  }

  .topic{
    display:flex;
    align-items:flex-start;
    gap:14px;
    padding:14px;
    margin-bottom:18px;
    background:#c8f000;
    border:4px solid #7fb800;
    box-shadow:4px 4px 0 #567d00;
  }

  .topic input{
    margin-top:4px;
    width:18px;
    height:18px;
    accent-color:#ff6f00;
  }

  .topic label{
    font-size:0.95rem;
    line-height:1.4;
  }

  .progress{
    margin-top:40px;
  }

  .track{
    height:18px;
    background:#ffb703;
    border:4px solid #cc8a00;
    box-shadow:inset 3px 3px 0 #ffd66b;
  }

  .fill{
    height:100%;
    width:0%;
    background:#ff3d00;
    transition:width 0.25s ease;
  }

  .percent{
    margin-top:10px;
    font-size:0.9rem;
    text-align:right;
    font-weight:bold;
    color:#4a2b00;
  }
</style>
</head>

<body>

<div class="sheet">

  <h1>Index thématique</h1>

  <div class="topic">
    <input type="checkbox" class="check">
    <label>Ce sujet concerne des gens obsessionnels créatifs.</label>
  </div>

  <div class="topic">
    <input type="checkbox" class="check">
    <label>Ce sujet explore l’ordre et le chaos.</label>
  </div>

  <div class="topic">
    <input type="checkbox" class="check">
    <label>Ce sujet traite l’anticipation de l’esprit humain.</label>
  </div>

  <div class="topic">
    <input type="checkbox" class="check">
    <label>Ce sujet aborde le dépassement des facultés humaines.</label>
  </div>

  <div class="progress">
    <div class="track">
      <div class="fill" id="fill"></div>
    </div>
    <div class="percent" id="percent">0%</div>
  </div>

</div>

<script>
  const checks = document.querySelectorAll(".check");
  const fill = document.getElementById("fill");
  const percent = document.getElementById("percent");

  function update(){
    const total = checks.length;
    const active = [...checks].filter(c => c.checked).length;
    const value = Math.round((active / total) * 100);
    fill.style.width = value + "%";
    percent.textContent = value + "%";
  }

  checks.forEach(c => c.addEventListener("change", update));
</script>

</body>
</html>
