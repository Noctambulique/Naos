<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Cartographie des intérêts cognitifs</title>

<style>
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#0b0b0b;
    color:#eaeaea;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  }

  .container{
    width:90%;
    max-width:700px;
    background:rgba(255,255,255,0.03);
    border:1px solid rgba(255,255,255,0.08);
    padding:32px;
    border-radius:16px;
  }

  h1{
    font-weight:500;
    margin-bottom:24px;
    font-size:1.4rem;
    letter-spacing:0.3px;
  }

  .criterion{
    display:flex;
    align-items:flex-start;
    gap:12px;
    margin-bottom:18px;
    line-height:1.45;
  }

  .criterion input{
    margin-top:4px;
    transform:scale(1.2);
    cursor:pointer;
  }

  .progress-wrapper{
    margin-top:30px;
  }

  .progress-bar{
    width:100%;
    height:14px;
    background:rgba(255,255,255,0.1);
    border-radius:999px;
    overflow:hidden;
  }

  .progress-fill{
    height:100%;
    width:0%;
    background:linear-gradient(
      90deg,
      #4fd1c5,
      #63b3ed
    );
    transition:width 0.35s ease;
  }

  .progress-label{
    margin-top:10px;
    text-align:right;
    font-size:0.9rem;
    opacity:0.85;
  }
</style>
</head>

<body>

<div class="container">
  <h1>Axes d’intérêt et de dépassement cognitif</h1>

  <div class="criterion">
    <input type="checkbox" class="criterion-checkbox">
    <label>
      Intérêt profond pour les dynamiques de <strong>chaos et d’ordre</strong>,
      leurs frontières, leurs transitions et leurs structures cachées.
    </label>
  </div>

  <div class="criterion">
    <input type="checkbox" class="criterion-checkbox">
    <label>
      Fascination pour <strong>l’esprit humain</strong>, en particulier la
      cartographie mentale, l’anticipation comportementale et l’origine des
      schémas psychiques.
    </label>
  </div>

  <div class="criterion">
    <input type="checkbox" class="criterion-checkbox">
    <label>
      Intérêt marqué pour les <strong>personnalités obsessionnelles créatives</strong>,
      leur rigueur, leurs dérives productives et leur rapport au réel.
    </label>
  </div>

  <div class="criterion">
    <input type="checkbox" class="criterion-checkbox">
    <label>
      Recherche active de tout ce qui permet de <strong>dépasser les facultés humaines</strong> :
      cognition augmentée, systèmes hybrides, disciplines extrêmes, intelligence étendue.
    </label>
  </div>

  <div class="progress-wrapper">
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="progress-label" id="progressLabel">0%</div>
  </div>
</div>

<script>
  const checkboxes = document.querySelectorAll(".criterion-checkbox");
  const progressFill = document.getElementById("progressFill");
  const progressLabel = document.getElementById("progressLabel");

  function updateProgress(){
    const total = checkboxes.length;
    const checked = [...checkboxes].filter(cb => cb.checked).length;
    const percent = Math.round((checked / total) * 100);

    progressFill.style.width = percent + "%";
    progressLabel.textContent = percent + "%";
  }

  checkboxes.forEach(cb => {
    cb.addEventListener("change", updateProgress);
  });
</script>

</body>
</html>
