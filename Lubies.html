<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Deux titres par ligne</title>
  <style>
    body {
      font-family: sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      max-width: 800px;
      margin: 20px auto;
    }
    .item {
      display: block;
      background: white;
      padding: 15px;
      border-radius: 8px;
      text-align: center;
      text-decoration: none;
      color: #333;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      transition: transform 0.1s;
    }
    .item:hover {
      transform: translateY(-3px);
      background: #e9f0ff;
    }
    @media(max-width:600px){
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <h1>Deux titres par ligne</h1>
  <div class="grid">
    <a class="item" href="https://example.com/page1">Titre 1</a>
    <a class="item" href="https://example.com/page2">Titre 2</a>
    <a class="item" href="https://example.com/page3">Titre 3</a>
    <a class="item" href="https://example.com/page4">Titre 4</a>
    <a class="item" href="https://example.com/page5">Titre 5</a>
    <a class="item" href="https://example.com/page6">Titre 6</a>
  </div>
</body>
</html>
