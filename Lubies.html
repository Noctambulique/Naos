<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Deux titres par ligne</title>
  <style>
    body {
      font-family: sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      max-width: 800px;
      margin: 20px auto;
    }
    .item {
      display: block;
      background: white;
      padding: 15px;
      border-radius: 8px;
      text-align: center;
      text-decoration: none;
      color: #333;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      transition: transform 0.1s;
    }
    .item:hover {
      transform: translateY(-3px);
      background: #e9f0ff;
    }
    @media(max-width:600px){
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <h1>Deux titres par ligne</h1>
  <div class="grid" id="grid">
    <a class="item" href="https://example.com/page1">Titre 1</a>
    <a class="item" href="https://example.com/page2">Titre 2</a>
    <a class="item" href="https://example.com/page3">Titre 3</a>
    <a class="item" href="https://example.com/page4">Titre 4</a>
  </div>

  <div style="text-align:center; margin-top:20px;">
    <input id="title1" placeholder="Titre gauche"> 
    <input id="link1" placeholder="Lien gauche"> 
    <input id="title2" placeholder="Titre droite"> 
    <input id="link2" placeholder="Lien droite"> 
    <button id="add">Ajouter</button>
  </div>

  <script>
    const grid = document.getElementById('grid');
    document.getElementById('add').onclick = () => {
      const t1 = document.getElementById('title1').value;
      const l1 = document.getElementById('link1').value;
      const t2 = document.getElementById('title2').value;
      const l2 = document.getElementById('link2').value;

      if (t1 && l1) grid.innerHTML += `<a class='item' href='${l1}' target='_blank'>${t1}</a>`;
      if (t2 && l2) grid.innerHTML += `<a class='item' href='${l2}' target='_blank'>${t2}</a>`;

      document.getElementById('title1').value = '';
      document.getElementById('link1').value = '';
      document.getElementById('title2').value = '';
      document.getElementById('link2').value = '';
    };
  </script>
</body>
</html>
