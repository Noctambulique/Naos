<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Deux titres par ligne</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #ffffff;
      margin: 20px;
    }
    h1 {
      text-align: center;
      font-size: 20px;
    }
    .grid {
      display: table;
      width: 100%;
      border-collapse: collapse;
    }
    .row {
      display: table-row;
    }
    .item {
      display: table-cell;
      border: 1px solid #ccc;
      padding: 10px;
      text-align: center;
    }
    .item a {
      text-decoration: none;
      color: #000;
    }
    .item a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="grid">
    <div class="row">
      <div class="item"><a href="Psy/Triade">Triade</a></div>
      <div class="item"><a href="Psy/Angoisse.html">Angoisse</a></div>
    </div>
    <div class="row">
      <div class="item"><a href="Psy/Névrose.html">Névrose</a></div>
      <div class="item"><a href="Psy/Poétique.html">Poétique</a></div>
    </div>
  </div>

  <!-- Pour ajouter des lignes, copier une <div class="row"> et modifier les liens/titres -->
</body>
</html>
