<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Archive de Créatures</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #111;
    color: #eee;
}

#grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 16px;
    padding: 20px;
}

.card {
    background: #1c1c1c;
    border: 1px solid #333;
    cursor: pointer;
    padding: 10px;
    text-align: center;
}

.card img {
    width: 100%;
    height: 140px;
    object-fit: cover;
    margin-bottom: 8px;
}

#viewer {
    position: fixed;
    inset: 0;
    background: #0b0b0b;
    display: none;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
}

#close {
    position: absolute;
    top: 20px;
    right: 20px;
    cursor: pointer;
    font-size: 24px;
}

#viewer img {
    max-width: 420px;
    width: 100%;
    margin-bottom: 20px;
}
</style>
</head>

<body>

<div id="grid"></div>

<div id="viewer">
    <div id="close">✕</div>
    <h1 id="v-name"></h1>
    <img id="v-img">
</div>

<script>
const creatures = [
    {
        name: "Trans Energie",
        image1: "D hiver/Transe 1.png",
        image2: "D hiver/radar-transparent (9).png"
    },
    {
        name: "Créature 002",
        image1: "D hiver/Transe 2.png",
        image2: "D hiver/Transe 2b.png"
    }
];

const grid = document.getElementById("grid");

creatures.forEach(c => {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
        <img src="${c.image1}">
        <div>${c.name}</div>
    `;
    card.onclick = () => openViewer(c);
    grid.appendChild(card);
});

function openViewer(c) {
    document.getElementById("v-name").textContent = c.name;
    document.getElementById("v-img").src = c.image1;
    document.getElementById("viewer").style.display = "flex";
}

document.getElementById("close").onclick = () => {
    document.getElementById("viewer").style.display = "none";
};
</script>

</body>
</html>
