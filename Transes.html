<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Archive de Créatures</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #111;
    color: #eee;
}

#grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 16px;
    padding: 20px;
}

.card {
    background: #1c1c1c;
    border: 1px solid #333;
    cursor: pointer;
    padding: 10px;
    text-align: center;
    transition: background 0.2s;
}

.card:hover {
    background: #262626;
}

.card img {
    width: 100%;
    height: 140px;
    object-fit: cover;
    margin-bottom: 8px;
}

#viewer {
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at top, #141414, #0b0b0b);
    color: #eee;
    display: none;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
    overflow-y: auto;
}

#v-name {
    font-size: 28px;
    letter-spacing: 0.04em;
    margin-bottom: 24px;
    text-align: center;
}

#viewer img {
    max-width: 420px;
    width: 100%;
    margin-bottom: 28px;
    border: 1px solid #222;
}

#v-text {
    max-width: 520px;
    font-size: 15px;
    line-height: 1.7;
    text-align: center;
    color: #ccc;
    font-style: italic;
    padding-top: 16px;
    border-top: 1px solid #222;
}

}
</style>
</head>

<body>

<div id="grid"></div>

<div id="viewer">
    <div id="close">✕</div>
    <h1 id="v-name"></h1>
    <img id="v-img">
    <p id="v-text"></p>
</div>

<script>
const creatures = [
    {
        name: "Créature 001",
        image: "D hiver/20251229_1422_Monstre aux Yo-yos_simple_compose_01kdn4cgbpfys9qrb03c9f23v9.png",
        description: "On ne part jamais vraiment."
    },
    {
        name: "Créature 002",
        image: "D hiver/20251229_1502_Sirène Miroir Éclatante_simple_compose_01kdn6njd8frj8hrnhhs1k3grc.png",
        description: "Tes voix intérieures, ce qui te parle au plus profonds de toi, ta réalité hyppnotique"
    }, 
      {
        name: "Créature 003",
        image: "D hiver/20260101_1731_Humain Mystérieux Quadrillé_simple_compose_01kdx6d0pdeg5t3dc46xactsxt.png",
        description: "Voir tout ce qu'il adviendra."
    },
    {
        name: "Créature 004",
        image: " D hiver/Cadeau.png",
        description: "T'offrir une montagne dans un paquet."
    }

];

// génération des cartes
const grid = document.getElementById("grid");

creatures.forEach(c => {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
        <img src="${c.image}">
        <div>${c.name}</div>
    `;
    card.onclick = () => openViewer(c);
    grid.appendChild(card);
});

function openViewer(c) {
    document.getElementById("v-name").textContent = c.name;
    document.getElementById("v-img").src = c.image;
    document.getElementById("v-text").textContent = c.description;
    document.getElementById("viewer").style.display = "flex";
}

document.getElementById("close").onclick = () => {
    document.getElementById("viewer").style.display = "none";
};
</script>

</body>
</html>
