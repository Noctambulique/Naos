<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Jardin de Basile</title>

  <!-- Police poétique -->
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&display=swap" rel="stylesheet">

  <style>
    :root{--cols:2}
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{
      height:100%;
      font-family:"Cormorant Garamond", serif;
      background:#fff;
      color:#111;
      display:flex;
      align-items:center;
      justify-content:center;
      transition:opacity 1s ease;
      letter-spacing:0.3px;
      line-height:1.75;
      font-style:italic;
      font-size:1.12rem;
    }
    body.fade{opacity:0}

    main{width:100%;padding:5vh 5vw;transition:opacity .5s ease}
    .grid{
      display:grid;
      grid-template-columns:repeat(var(--cols),1fr);
      gap:20px;
      text-align:center;
    }
    .word{
      background:transparent;
      border:0;
      padding:20px;
      cursor:pointer;
      outline:none;
      font-size:1.35rem;
      transition:opacity .35s,transform .25s;
      font-family:"Cormorant Garamond", serif;
    }
    .word:active{transform:scale(.97)}
    .word.fade{opacity:.4}

    #detail{
      display:none;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:5vh 10vw;
      animation:fadeIn .6s ease;
      position:relative;
      width:100%;
      height:100%;
      font-family:"Cormorant Garamond", serif;
    }

    #detail img{
      max-width:100%;
      max-height:60vh;
      object-fit:contain;
      border-radius:6px;
      margin:20px 0;
    }
    #detail p{font-size:1.2rem;line-height:1.6}

    #retour{
      position:absolute;
      top:20px;
      left:20px;
      background:transparent;
      border:none;
      font-size:1.25rem;
      cursor:pointer;
      font-family:"Cormorant Garamond", serif;
      color:#111;
      display:flex;
      align-items:center;
      gap:6px;
      transition:opacity .3s;
    }
    #retour:hover{opacity:0.7}
    #retour::before{
      content:"←";
      font-size:1.25rem;
    }

    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  </style>
</head>
<body>
