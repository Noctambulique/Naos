<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Radar Minimal++</title>
<style>
  body{font-family:system-ui;margin:0;padding:20px;display:flex;flex-direction:column;gap:14px;max-width:720px;margin:auto}
  h1{font-size:18px;margin:0}
  textarea,input,button,select{width:100%;padding:8px;font-size:14px;border:1px solid #ddd;border-radius:6px;box-sizing:border-box}
  button{cursor:pointer}
  #canvasWrap{width:100%;height:460px}
  canvas{width:100%;height:100%;background:#fff}
  .row{display:flex;gap:8px}
</style>
</head>
<body>

<h1>Radar Chart Minimal++</h1>

<label>Nom des coins (séparés par virgules)</label>
<textarea id="labels">Force,Vitesse,Agilité,Endurance,Technique</textarea>

<label>Valeurs (même nombre, séparées par virgules)</label>
<input id="values" value="8,6,7,9,5" />

<label>Couleur</label>
<input type="color" id="color" value="#3b82f6" />

<label>Style</label>
<select id="style">
  <option value="soft">Courbes douces</option>
  <option value="straight">Lignes droites</option>
  <option value="spiky">Très pointu</option>
</select>

<div class="row">
  <button id="pngWhite">PNG fond blanc</button>
  <button id="pngTransparent">PNG transparent</button>
</div>

<div id="canvasWrap">
  <canvas id="radar"></canvas>
</div>

<script>
// --- INITIALISATION SÛRE APRÈS LE CHARGEMENT DU DOM ---
window.addEventListener("DOMContentLoaded", () => {
  const canvas = document.getElementById("radarCanvas");
  const ctx = canvas.getContext("2d");
  let radarChart = null;

  const sidesInput = document.getElementById("sides");
  const styleInput = document.getElementById("style");
  const labelsContainer = document.getElementById("labelsContainer");
  const downloadWhite = document.getElementById("downloadWhite");
  const downloadTransparent = document.getElementById("downloadTransparent");

  function regenerateLabels() {
    labelsContainer.innerHTML = "";
    const n = parseInt(sidesInput.value);
    for (let i = 0; i < n; i++) {
      const inp = document.createElement("input");
      inp.type = "text";
      inp.value = "Axe " + (i + 1);
      inp.dataset.index = i;
      inp.className = "labelInput";
      inp.addEventListener("input", updateChart);
      labelsContainer.appendChild(inp);
    }
  }

  function getLabels() {
    return [...document.querySelectorAll(".labelInput")].map(i => i.value);
  }

  function getData() {
    const n = parseInt(sidesInput.value);
    return Array(n).fill(0).map(() => Math.floor(Math.random() * 100) + 20);
  }

  function updateChart() {
    const labels = getLabels();
    const data = getData();

    if (radarChart) radarChart.destroy();

    const tension = styleInput.value === "soft" ? 0.45 : styleInput.value === "pointy" ? 0.05 : 0.25;

    radarChart = new Chart(ctx, {
      type: "radar",
      data: {
        labels,
        datasets: [{
          label: "",
          data,
          pointRadius: 3,
          borderWidth: 2,
          fill: true,
          tension
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: { r: { beginAtZero: true } },
        animation: false
      }
    });
  }

  // EXPORT PNG FOND BLANC
  downloadWhite.addEventListener("click", () => {
    const tmpCanvas = document.createElement("canvas");
    tmpCanvas.width = canvas.width;
    tmpCanvas.height = canvas.height;
    const tmpCtx = tmpCanvas.getContext("2d");
    tmpCtx.fillStyle = "#ffffff";
    tmpCtx.fillRect(0, 0, tmpCanvas.width, tmpCanvas.height);
    tmpCtx.drawImage(canvas, 0, 0);

    const link = document.createElement("a");
    link.download = "radar_blanc.png";
    link.href = tmpCanvas.toDataURL();
    link.click();
  });

  // EXPORT PNG TRANSPARENT
  downloadTransparent.addEventListener("click", () => {
    const link = document.createElement("a");
    link.download = "radar_transparent.png";
    link.href = canvas.toDataURL();
    link.click();
  });

  // Initialisation
  regenerateLabels();
  updateChart();

  sidesInput.addEventListener("input", () => {
    regenerateLabels();
    updateChart();
  });
  styleInput.addEventListener("input", updateChart);
});
</script>
<script>
let chart;
const ctx = document.getElementById('radar');

function tensionFromStyle(s){
  if(s==='straight') return 0;
  if(s==='soft') return 0.35;
  if(s==='spiky') return 0.8;
  return 0.35;
}

function makeChart(bg){
  const labels = document.getElementById('labels').value.split(',').map(s=>s.trim()).filter(Boolean);
  const rawVals = document.getElementById('values').value.split(',').map(v=>Number(v)||0);
  const values = rawVals.slice(0, labels.length).concat(Array(Math.max(0,labels.length-rawVals.length)).fill(0));
  const color = document.getElementById('color').value;
  const style = document.getElementById('style').value;

  if(chart) chart.destroy();

  chart = new Chart(ctx,{
    type:'radar',
    data:{ labels, datasets:[{
      label:'', data:values,
      borderColor:color,
      backgroundColor:bg?color+'30':color+'20',
      fill:true
    }]},
    options:{
      animation:false,
      responsive:true,
      maintainAspectRatio:false,
      elements:{ line:{ tension:tensionFromStyle(style) }},
      scales:{ r:{ beginAtZero:true, suggestedMax:10 } }
    }
  });
}

['labels','values','color','style'].forEach(id=>{
  document.getElementById(id).addEventListener('input',()=>makeChart(true));
});

makeChart(true);

document.getElementById('pngWhite').onclick=()=>{
  const link=document.createElement('a');
  link.download='radar_white.png';
  link.href=ctx.toDataURL('image/png');
  link.click();
};

document.getElementById('pngTransparent').onclick=()=>{
  const labels=document.getElementById('labels').value.split(',').map(s=>s.trim()).filter(Boolean);
  const rawVals=document.getElementById('values').value.split(',').map(v=>Number(v)||0);
  const values=rawVals.slice(0,labels.length).concat(Array(Math.max(0,labels.length-rawVals.length)).fill(0));
  const color=document.getElementById('color').value;
  const style=document.getElementById('style').value;

  const temp=document.createElement('canvas');
  temp.width=ctx.width; temp.height=ctx.height;

  new Chart(temp,{
    type:'radar',
    data:{labels,datasets:[{label:'',data:values,borderColor:color,backgroundColor:color+'20',fill:true}]},
    options:{animation:false,responsive:false,maintainAspectRatio:false,elements:{line:{tension:tensionFromStyle(style)}},scales:{r:{beginAtZero:true,suggestedMax:10}}}
  );

  const link=document.createElement('a');
  link.download='radar_transparent.png';
  link.href=temp.toDataURL('image/png');
  link.click();
};
</script>
</body>
</html>
