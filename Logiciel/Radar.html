<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Radar Minimal</title>
<style>
  body{font-family:system-ui;margin:0;padding:20px;display:flex;flex-direction:column;gap:14px;max-width:700px;margin:auto}
  h1{font-size:18px;margin:0}
  textarea,input,button,select{width:100%;padding:8px;font-size:14px;border:1px solid #ddd;border-radius:6px;box-sizing:border-box}
  button{cursor:pointer}
  #canvasWrap{width:100%;height:420px}
  canvas{width:100%;height:100%;background:#fff}
  .row{display:flex;gap:8px}
</style>
</head>
<body>

<h1>Radar Chart Minimal</h1>

<label>Labels (ex: Force,Vitesse,...)</label>
<textarea id="labels">Force,Vitesse,Agilité,Endurance</textarea>

<label>Valeurs (ex: 8,6,7,9)</label>
<input id="values" value="8,6,7,9" />

<label>Couleur</label>
<input type="color" id="color" value="#3b82f6" />

<div class="row">
  <button id="update">Mettre à jour</button>
  <button id="pngWhite">PNG fond blanc</button>
  <button id="pngTransparent">PNG transparent</button>
</div>

<div id="canvasWrap">
  <canvas id="radar"></canvas>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
let chart;
const ctx = document.getElementById('radar');

function makeChart(bg){
  const labels = document.getElementById('labels').value.split(',').map(s=>s.trim()).filter(Boolean);
  const values = document.getElementById('values').value.split(',').map(v=>Number(v)||0);
  const color = document.getElementById('color').value;

  if(chart) chart.destroy();

  chart = new Chart(ctx,{
    type:'radar',
    data:{
      labels,
      datasets:[{
        label:'Données',
        data:values,
        borderColor:color,
        backgroundColor:bg?color+'30':color+'25',
        fill:true
      }]
    },
    options:{
      animation:false,
      responsive:true,
      maintainAspectRatio:false,
      scales:{ r:{ beginAtZero:true, suggestedMax:10 } }
    }
  });
}

makeChart(true);

document.getElementById('update').onclick=()=>makeChart(true);

document.getElementById('pngWhite').onclick=()=>{
  const link=document.createElement('a');
  link.download='radar_white.png';
  link.href=ctx.toDataURL('image/png');
  link.click();
};

document.getElementById('pngTransparent').onclick=()=>{
  const labels = document.getElementById('labels').value.split(',').map(s=>s.trim());
  const values = document.getElementById('values').value.split(',').map(v=>Number(v)||0);
  const color = document.getElementById('color').value;

  const temp=document.createElement('canvas');
  temp.width=ctx.width; temp.height=ctx.height;
  new Chart(temp,{type:'radar',data:{labels,datasets:[{label:'',data:values,borderColor:color,backgroundColor:color+'25',fill:true}]},options:{animation:false,responsive:false,maintainAspectRatio:false,scales:{r:{beginAtZero:true,suggestedMax:10}}}});

  const link=document.createElement('a');
  link.download='radar_transparent.png';
  link.href=temp.toDataURL('image/png');
  link.click();
};
</script>

</body>
</html>
