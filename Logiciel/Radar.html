<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Radar Chart Builder — Export PNG</title>
  <style>
    :root{ --gap:12px; --card-radius:10px; --accent:#4f46e5; }
    *{box-sizing:border-box;font-family:Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial}
    body{margin:18px;background:#f4f6fb;color:#0f172a}
    .wrap{display:grid;grid-template-columns:380px 1fr;gap:18px;align-items:start}
    .panel{background:#fff;border-radius:12px;padding:14px;box-shadow:0 6px 18px rgba(15,23,42,0.06)}
    h1{font-size:18px;margin:0 0 10px}
    label{display:block;font-size:13px;margin:10px 0 6px}
    input[type=text], input[type=number], select{width:100%;padding:8px;border-radius:8px;border:1px solid #e6e9f2}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .controls-row{display:flex;gap:8px}
    button{background:var(--accent);color:#fff;padding:10px 12px;border-radius:8px;border:0;cursor:pointer}
    button.ghost{background:#fff;color:var(--accent);border:1px solid #e6e9f2}
    .small{padding:7px 8px;font-size:13px}
    canvas{width:100%;height:480px;background:transparent;border-radius:8px}
    .inputs-list{max-height:240px;overflow:auto;padding:6px;border-radius:8px;border:1px dashed #e6e9f2}
    .row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
    .row input[type=range]{flex:1}
    .meta{font-size:13px;color:#475569}
    .footer{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
    .muted{color:#94a3b8;font-size:13px}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="panel">
      <h1>Radar Chart Builder</h1>
      <p class="meta">Personnalisez axes, étiquettes, valeurs, couleurs et exportez en PNG (fond transparent ou rempli).</p>

      <label>Nombre de côtés (axes)</label>
      <div class="controls-row">
        <input id="axesCount" type="number" min="3" max="24" value="5">
        <button id="applyAxes" class="small">Appliquer</button>
        <button id="randomize" class="small ghost">Aléatoire</button>
      </div>

      <label>Options d'affichage</label>
      <div class="controls-row">
        <label style="display:flex;align-items:center;gap:8px"><input id="showTicks" type="checkbox" checked> Afficher chiffres</label>
        <label style="display:flex;align-items:center;gap:8px"><input id="showGrid" type="checkbox" checked> Afficher grille</label>
      </div>

      <label>Fond du canvas</label>
      <div class="controls-row">
        <select id="bgMode">
          <option value="transparent">Transparent (PNG sans fond)</option>
          <option value="white">Blanc</option>
          <option value="filled">Couleur de remplissage</option>
        </select>
        <input id="bgColor" type="color" value="#ffffff" style="width:56px">
      </div>

      <label>Dataset</label>
      <div class="controls-row">
        <input id="dsLabel" type="text" placeholder="Nom du dataset" value="Serie 1">
        <input id="dsAlpha" type="number" min="0" max="1" step="0.05" value="0.35" style="width:80px">
      </div>
      <div class="controls-row" style="margin-top:8px">
        <input id="dsColor" type="color" value="#0ea5a4">
        <button id="updateChart" class="small">Mettre à jour</button>
      </div>

      <label>Axes & valeurs</label>
      <div class="inputs-list" id="axesList"></div>

      <div class="footer">
        <button id="downloadTransparent">Télécharger PNG (transparent)</button>
        <button id="downloadFilled" class="ghost">Télécharger PNG (fond actif)</button>
      </div>

      <p class="muted" style="margin-top:12px">Astuce : pour un export sans fond, choisissez <strong>Transparent</strong> dans "Fond du canvas" et utilisez "Télécharger PNG (transparent)".</p>
    </div>

    <div class="panel">
      <canvas id="radarCanvas" width="800" height="600"></canvas>
    </div>
  </div>

  <!-- Chart.js depuis CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    // --- Utilitaires ---
    const qs = sel => document.querySelector(sel);
    const axesCountInput = qs('#axesCount');
    const applyAxesBtn = qs('#applyAxes');
    const axesList = qs('#axesList');
    const updateChartBtn = qs('#updateChart');
    const randomizeBtn = qs('#randomize');
    const showTicks = qs('#showTicks');
    const showGrid = qs('#showGrid');
    const bgMode = qs('#bgMode');
    const bgColor = qs('#bgColor');
    const dsColor = qs('#dsColor');
    const dsAlpha = qs('#dsAlpha');
    const dsLabel = qs('#dsLabel');
    const downloadTransparent = qs('#downloadTransparent');
    const downloadFilled = qs('#downloadFilled');

    // canvas + chart reference
    const canvas = qs('#radarCanvas');
    let chart = null;

    // Génère un tableau d'axes par défaut
    function makeDefaultAxes(n){
      const labels = [];
      for(let i=1;i<=n;i++) labels.push('Axe ' + i);
      return labels;
    }

    function makeInputs(labels, values){
      axesList.innerHTML = '';
      for(let i=0;i<labels.length;i++){
        const row = document.createElement('div');
        row.className = 'row';

        const inLabel = document.createElement('input');
        inLabel.type = 'text';
        inLabel.value = labels[i] || '';
        inLabel.placeholder = 'Label';
        inLabel.style.width = '45%';

        const inValue = document.createElement('input');
        inValue.type = 'number';
        inValue.min = 0;
        inValue.max = 100;
        inValue.value = (values && values[i] != null) ? values[i] : Math.round(Math.random()*80 + 10);
        inValue.style.width = '22%';

        const inRange = document.createElement('input');
        inRange.type = 'range';
        inRange.min = 0; inRange.max = 100; inRange.value = inValue.value;
        inRange.addEventListener('input', ()=>{ inValue.value = inRange.value; updateChartPreview(); });
        inValue.addEventListener('input', ()=>{ inRange.value = inValue.value; updateChartPreview(); });
        inRange.style.flex = '1';

        row.appendChild(inLabel);
        row.appendChild(inValue);
        row.appendChild(inRange);
        axesList.appendChild(row);
      }
    }

    // Lit labels & valeurs depuis inputs
    function readInputs(){
      const labels = [];
      const values = [];
      [...axesList.children].forEach((row)=>{
        const inputs = row.querySelectorAll('input');
        labels.push(inputs[0].value || '');
        values.push(Number(inputs[1].value)||0);
      });
      return {labels, values};
    }

    // Crée ou met à jour le chart
    function renderChart(labels, values){
      const ctx = canvas.getContext('2d');
      if(chart) chart.destroy();

      const color = dsColor.value;
      const alpha = Number(dsAlpha.value) || 0.35;

      chart = new Chart(ctx, {
        type: 'radar',
        data: {
          labels: labels,
          datasets: [{
            label: dsLabel.value || 'Serie',
            data: values,
            fill: true,
            backgroundColor: hexToRgba(color, alpha),
            borderColor: color,
            pointBackgroundColor: color,
            pointRadius: 4
          }]
        },
        options: {
          responsive: false,
          maintainAspectRatio: false,
          scales: {
            r: {
              beginAtZero: true,
              grid: { display: showGrid.checked },
              ticks: { display: showTicks.checked },
              pointLabels: { display: true }
            }
          },
          plugins: {
            legend: { display: true }
          }
        }
      });

      // appliquer background CSS (affecte seulement affichage)
      if(bgMode.value === 'transparent') canvas.style.background = 'transparent';
      else if(bgMode.value === 'white') canvas.style.background = '#ffffff';
      else canvas.style.background = bgColor.value;
    }

    function updateChartPreview(){
      const {labels, values} = readInputs();
      renderChart(labels, values);
    }

    // helpers
    function hexToRgba(hex, a){
      const h = hex.replace('#','');
      const bigint = parseInt(h,16);
      const r = (bigint >> 16) & 255;
      const g = (bigint >> 8) & 255;
      const b = bigint & 255;
      return `rgba(${r}, ${g}, ${b}, ${a})`;
    }

    // download with or without background
    function downloadPNG(withBackground){
      // create image from chart canvas
      const imgData = canvas.toDataURL('image/png');
      if(withBackground){
        // draw onto temp canvas with chosen background
        const tmp = document.createElement('canvas');
        tmp.width = canvas.width; tmp.height = canvas.height;
        const tctx = tmp.getContext('2d');
        // background color
        let fill = '#ffffff';
        if(bgMode.value === 'filled') fill = bgColor.value;
        else if(bgMode.value === 'white') fill = '#ffffff';
        tctx.fillStyle = fill;
        tctx.fillRect(0,0,tmp.width,tmp.height);
        const img = new Image();
        img.onload = ()=>{
          tctx.drawImage(img,0,0);
          const a = document.createElement('a'); a.download = 'radar-filled.png'; a.href = tmp.toDataURL('image/png'); a.click();
        };
        img.src = imgData;
      } else {
        const a = document.createElement('a'); a.download = 'radar-transparent.png'; a.href = imgData; a.click();
      }
    }

    // événement: appliquer nombre d'axes
    applyAxesBtn.addEventListener('click', ()=>{
      const n = Math.max(3, Math.min(24, Number(axesCountInput.value)||5));
      axesCountInput.value = n;
      makeInputs(makeDefaultAxes(n));
      updateChartPreview();
    });

    // randomize values
    randomizeBtn.addEventListener('click', ()=>{
      const n = Math.max(3, Math.min(24, Number(axesCountInput.value)||5));
      const labels = makeDefaultAxes(n);
      const values = labels.map(()=>Math.round(Math.random()*80 + 10));
      makeInputs(labels, values);
      updateChartPreview();
    });

    // update chart
    updateChartBtn.addEventListener('click', ()=> updateChartPreview());
    showTicks.addEventListener('change', ()=> updateChartPreview());
    showGrid.addEventListener('change', ()=> updateChartPreview());
    bgMode.addEventListener('change', ()=>{
      if(bgMode.value === 'filled') bgColor.disabled = false;
      else bgColor.disabled = false; // keep enabled so user can choose white as well
      updateChartPreview();
    });
    bgColor.addEventListener('input', ()=> updateChartPreview());
    dsColor.addEventListener('input', ()=> updateChartPreview());
    dsAlpha.addEventListener('input', ()=> updateChartPreview());

    downloadTransparent.addEventListener('click', ()=> downloadPNG(false));
    downloadFilled.addEventListener('click', ()=> downloadPNG(true));

    // init
    (function init(){
      const n = Number(axesCountInput.value)||5;
      const labels = makeDefaultAxes(n);
      makeInputs(labels);
      renderChart(labels, Array.from({length:n},()=>Math.round(Math.random()*80+10)));
    })();
  </script>
</body>
</html>
