<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Radar Chart Builder — Lisible & épais</title>

  <style>
    :root{ --gap:12px; --card-radius:10px; --accent:#4f46e5; }
    *{box-sizing:border-box;font-family:Inter, ui-sans-serif, system-ui,-apple-system, "Segoe UI", Roboto, Arial}
    body{margin:18px;background:#f4f6fb;color:#0f172a}
    .wrap{display:grid;grid-template-columns:380px 1fr;gap:18px;align-items:start}
    .panel{background:#fff;border-radius:12px;padding:14px;box-shadow:0 6px 18px rgba(15,23,42,0.06)}
    h1{font-size:18px;margin:0 0 10px}
    label{display:block;font-size:13px;margin:10px 0 6px}
    input[type=text], input[type=number], select{
      width:100%;padding:8px;border-radius:8px;border:1px solid #e6e9f2
    }
    .controls-row{display:flex;gap:8px}
    button{
      background:var(--accent);color:#fff;padding:10px 12px;border-radius:8px;border:0;cursor:pointer
    }
    button.ghost{background:#fff;color:var(--accent);border:1px solid #e6e9f2}
    .small{padding:7px 8px;font-size:13px}
    canvas{width:100%;height:480px;background:transparent;border-radius:8px;display:block}
    .inputs-list{max-height:240px;overflow:auto;padding:6px;border-radius:8px;border:1px dashed #e6e9f2}
    .row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
    .row input[type=range]{flex:1}
    .meta{font-size:13px;color:#475569}
    .footer{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
    .muted{color:#94a3b8;font-size:13px}
  </style>
</head>

<body>
  <div class="wrap">
    <div class="panel">
      <h1>Radar Chart Builder</h1>
      <p class="meta">Radar propre et lisible — 5 crans fixes : 0,2,4,6,8,10</p>

      <label>Nombre de côtés</label>
      <div class="controls-row">
        <input id="axesCount" type="number" min="3" max="24" value="5">
        <button id="applyAxes" class="small">Appliquer</button>
        <button id="randomize" class="small ghost">Aléatoire</button>
      </div>

      <label>Options d'affichage</label>
      <div class="controls-row">
        <label style="display:flex;align-items:center;gap:8px"><input id="showTicks" type="checkbox" checked> Chiffres</label>
        <label style="display:flex;align-items:center;gap:8px"><input id="showGrid" type="checkbox" checked> Grille</label>
      </div>

      <label>Fond du canvas</label>
      <div class="controls-row">
        <select id="bgMode">
          <option value="transparent">Transparent</option>
          <option value="white">Blanc</option>
          <option value="filled">Couleur</option>
        </select>
        <input id="bgColor" type="color" value="#ffffff" style="width:56px">
      </div>

      <label>Dataset</label>
      <div class="controls-row">
        <input id="dsLabel" type="text" value="Serie 1">
        <input id="dsAlpha" type="number" min="0" max="1" step="0.05" value="0.35" style="width:80px">
      </div>

      <div class="controls-row" style="margin-top:8px">
        <input id="dsColor" type="color" value="#0ea5a4">
        <button id="updateChart" class="small">Mettre à jour</button>
      </div>

      <label>Axes & valeurs (0 → 10)</label>
      <div class="inputs-list" id="axesList"></div>

      <div class="footer">
        <button id="downloadTransparent">PNG transparent</button>
        <button id="downloadFilled" class="ghost">PNG fond actif</button>
      </div>

      <p class="muted" style="margin-top:12px">Astuce : pour un PNG sans fond, sélectionnez <strong>Transparent</strong> et cliquez sur <em>PNG transparent</em>.</p>
    </div>

    <div class="panel">
      <canvas id="radarCanvas" width="800" height="600"></canvas>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    // raccourcis DOM
    const qs = s => document.querySelector(s);
    const axesCountInput = qs('#axesCount');
    const applyAxesBtn = qs('#applyAxes');
    const axesList = qs('#axesList');
    const updateChartBtn = qs('#updateChart');
    const randomizeBtn = qs('#randomize');
    const showTicks = qs('#showTicks');
    const showGrid = qs('#showGrid');
    const bgMode = qs('#bgMode');
    const bgColor = qs('#bgColor');
    const dsColor = qs('#dsColor');
    const dsAlpha = qs('#dsAlpha');
    const dsLabel = qs('#dsLabel');
    const downloadTransparent = qs('#downloadTransparent');
    const downloadFilled = qs('#downloadFilled');
    const canvas = qs('#radarCanvas');

    let chart = null;

    function makeDefaultAxes(n){
      return Array.from({length:n}, (_,i)=>"Axe "+(i+1));
    }

    function makeInputs(labels, values){
      axesList.innerHTML = '';
      for(let i=0;i<labels.length;i++){
        const row = document.createElement('div');
        row.className = 'row';

        const inLabel = document.createElement('input');
        inLabel.type = 'text';
        inLabel.value = labels[i] ?? '';
        inLabel.placeholder = 'Label';
        inLabel.style.width = '45%';

        const inValue = document.createElement('input');
        inValue.type = 'number';
        inValue.min = 0; inValue.max = 10;
        inValue.value = (values && values[i] != null) ? values[i] : Math.round(Math.random()*10);
        inValue.style.width = '22%';

        const inRange = document.createElement('input');
        inRange.type = 'range';
        inRange.min = 0; inRange.max = 10;
        inRange.step = 1;
        inRange.value = inValue.value;
        inRange.style.flex = '1';

        inRange.addEventListener('input', ()=>{ inValue.value = inRange.value; updateChartPreview(); });
        inValue.addEventListener('input', ()=>{ inRange.value = inValue.value; updateChartPreview(); });

        row.appendChild(inLabel);
        row.appendChild(inValue);
        row.appendChild(inRange);
        axesList.appendChild(row);
      }
    }

    function readInputs(){
      const labels = [];
      const values = [];
      [...axesList.children].forEach(r=>{
        const i = r.querySelectorAll("input");
        labels.push(i[0].value || '');
        values.push(Math.min(10, Math.max(0, Number(i[1].value) || 0)));
      });
      return {labels, values};
    }

    // --- renderChart (une seule version propre) ---
    function renderChart(labels, values){
      const ctx = canvas.getContext('2d');
      if(chart) chart.destroy();

      chart = new Chart(ctx, {
        type: 'radar',
        data: {
          labels,
          datasets: [{
            label: dsLabel.value || 'Série',
            data: values,
            fill: true,
            backgroundColor: hexToRgba(dsColor.value, Number(dsAlpha.value)),
            borderColor: dsColor.value,
            borderWidth: 5,           // contour dataset lisible
            pointRadius: 6,
            pointHoverRadius: 8,
            pointBackgroundColor: dsColor.value,
            pointBorderWidth: 2
          }]
        },
        options: {
          responsive: false,
          maintainAspectRatio: false,
          layout: { padding: 18 },
          plugins: { legend: { display: false } },
          scales: {
            r: {
              min: 0,
              max: 10,
              ticks: {
                display: showTicks.checked,
                stepSize: 2,              // crans : 0,2,4,6,8,10
                color: '#334155',
                font: { size: 13, weight: '600' },
                backdropColor: 'transparent'
              },
              pointLabels: {
                display: true,
                color: '#0f172a',
                font: { size: 14, weight: '600' },
                padding: 10
              },
              grid: {
                display: showGrid.checked,
                lineWidth: 3.5,           // anneaux nets mais pas agressifs
                color: 'rgba(100,116,139,0.18)'
              },
              angleLines: {
                display: true,
                lineWidth: 3.5,
                color: 'rgba(100,116,139,0.28)'
              },
              // Bordure extérieure du polygone
              border: {
                display: false
              }
            }
          }
        }
      });

      // Fond du canvas (affichage seulement)
      if(bgMode.value === "transparent") canvas.style.background = "transparent";
      else if(bgMode.value === "white") canvas.style.background = "#fff";
      else canvas.style.background = bgColor.value;
    }
    // --- fin renderChart ---

    function updateChartPreview(){
      const {labels, values} = readInputs();
      renderChart(labels, values);
    }

    function hexToRgba(hex, a){
      const h = (hex || '#000000').replace('#','');
      const n = parseInt(h,16);
      const r = (n>>16)&255, g=(n>>8)&255, b=n&255;
      return `rgba(${r},${g},${b},${a})`;
    }

    function downloadPNG(filled){
      const imgData = canvas.toDataURL("image/png");
      if(!filled){
        const a = document.createElement('a');
        a.download = 'radar-transparent.png';
        a.href = imgData;
        a.click();
        return;
      }
      const tmp = document.createElement('canvas');
      tmp.width = canvas.width; tmp.height = canvas.height;
      const t = tmp.getContext('2d');

      let fill = '#ffffff';
      if(bgMode.value === 'filled') fill = bgColor.value;
      else if(bgMode.value === 'white') fill = '#ffffff';

      t.fillStyle = fill;
      t.fillRect(0,0,tmp.width,tmp.height);

      const im = new Image();
      im.onload = ()=>{
        t.drawImage(im,0,0);
        const a = document.createElement('a');
        a.download = 'radar-filled.png';
        a.href = tmp.toDataURL('image/png');
        a.click();
      };
      im.src = imgData;
    }

    // — événements —
    applyAxesBtn.addEventListener('click', ()=>{
      const n = Math.max(3, Math.min(24, Number(axesCountInput.value) || 5));
      axesCountInput.value = n;
      makeInputs(makeDefaultAxes(n));
      updateChartPreview();
    });

    randomizeBtn.addEventListener('click', ()=>{
      const n = Math.max(3, Math.min(24, Number(axesCountInput.value) || 5));
      const labels = makeDefaultAxes(n);
      const values = labels.map(()=>Math.round(Math.random()*10));
      makeInputs(labels, values);
      updateChartPreview();
    });

    updateChartBtn.addEventListener('click', updateChartPreview);
    showTicks.addEventListener('change', updateChartPreview);
    showGrid.addEventListener('change', updateChartPreview);
    bgMode.addEventListener('change', updateChartPreview);
    bgColor.addEventListener('input', updateChartPreview);
    dsColor.addEventListener('input', updateChartPreview);
    dsAlpha.addEventListener('input', updateChartPreview);
    downloadTransparent.addEventListener('click', ()=>downloadPNG(false));
    downloadFilled.addEventListener('click', ()=>downloadPNG(true));

    // init
    (function init(){
      const n = Number(axesCountInput.value) || 5;
      const labels = makeDefaultAxes(n);
      const values = Array.from({length:n}, ()=> Math.round(Math.random()*10));
      makeInputs(labels, values);
      renderChart(labels, values);
    })();
  </script>
</body>
</html>
