<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Liste de tâches — ultra simple</title>
  <style>
    body{font-family:Arial;background:#f3f4f6;margin:0;padding:20px;color:#333}
    h1{text-align:center;margin-bottom:20px}
    .card{background:#fff;padding:15px;max-width:500px;margin:0 auto;border-radius:8px;box-shadow:0 2px 6px rgba(0,0,0,0.1)}
    form{display:flex;gap:10px}
    input{flex:1;padding:8px;border-radius:6px;border:1px solid #ccc}
    button{padding:8px 12px;border-radius:6px;border:0;background:#2563eb;color:white;cursor:pointer}
    button.secondary{background:#ccc;color:#333;width:100%;margin-top:10px}
    .task{padding:8px;border-radius:6px;background:#e5e7eb;margin-top:8px;display:flex;justify-content:space-between;align-items:center}
    .task.done{text-decoration:line-through;opacity:0.5}
    .btn-sm{cursor:pointer;border:0;background:#d1d5db;padding:4px 6px;border-radius:4px;margin-left:4px}
  </style>
</head>
<body>
  <h1>Liste de tâches</h1>

  <div class="card">
    <form id="taskForm">
      <input id="title" required placeholder="Nouvelle tâche" />
      <button>Ajouter</button>
    </form>
    <button id="clearBtn" class="secondary">Tout effacer</button>

    <div id="list"></div>
  </div>

  <script>
    const STORAGE_KEY = 'tasks_ultra_simple';
    let tasks = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');

    const list = document.getElementById('list');
    const form = document.getElementById('taskForm');
    const titleInput = document.getElementById('title');
    const clearBtn = document.getElementById('clearBtn');

    function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); }

    function addTask(title){ tasks.push({id:Date.now(),title,done:false}); save(); render(); }
    function toggle(id){ const t=tasks.find(x=>x.id===id); t.done=!t.done; save(); render(); }
    function del(id){ tasks = tasks.filter(t=>t.id!==id); save(); render(); }

    function render(){
      list.innerHTML="";
      if(tasks.length===0){ list.innerHTML='<p>Aucune tâche.</p>'; return; }

      tasks.forEach(t=>{
        const el = document.createElement('div');
        el.className = 'task' + (t.done ? ' done' : '');
        el.innerHTML = `<span>${t.title}</span>`;

        const btns = document.createElement('div');
        const b1 = document.createElement('button'); b1.className='btn-sm'; b1.textContent='✓'; b1.onclick=()=>toggle(t.id);
        const b2 = document.createElement('button'); b2.className='btn-sm'; b2.textContent='✖'; b2.onclick=()=>del(t.id);
        btns.appendChild(b1); btns.appendChild(b2);

        el.appendChild(btns);
        list.appendChild(el);
      });
    }

    form.addEventListener('submit', e=>{
      e.preventDefault();
      const title = titleInput.value.trim(); if(!title) return;
      addTask(title);
      form.reset();
    });

    clearBtn.addEventListener('click', ()=>{
      if(confirm('Tout supprimer ?')){ tasks=[]; save(); render(); }
    });

    render();
  </script>
</body>
</html>
