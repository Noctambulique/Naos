<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Échelle qualitative x2</title>
<style>
  :root{font-family:system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial; font-size:16px}
  html,body{height:100%; margin:0; display:flex; align-items:center; justify-content:center; background:#fff; color:#111}
  .container{width:min(620px,94vw); padding:20px; box-sizing:border-box; display:grid; gap:28px; align-items:center}
  .block{display:grid; gap:8px}
  .labels{display:flex; justify-content:space-between; font-size:0.8rem; opacity:0.85; user-select:none}
  input[type="range"]{width:100%; appearance:none; height:28px; background:transparent; margin:6px 0}
  input[type="range"]::-webkit-slider-runnable-track{height:6px; background:#e6e6e6; border-radius:6px}
  input[type="range"]::-webkit-slider-thumb{appearance:none; margin-top:-8px; width:20px; height:20px; border-radius:50%; background:#111; cursor:pointer}
  input[type="range"]::-moz-range-track{height:6px; background:#e6e6e6; border-radius:6px}
  input[type="range"]::-moz-range-thumb{width:20px; height:20px; border-radius:50%; background:#111; border:0}
  .current-label{font-weight:600; text-align:center; min-height:1.2em}
  .message{min-height:3.4em; font-size:0.95rem; line-height:1.3; text-align:center; padding:8px 10px}
  h2{text-align:center; margin:0; font-size:1rem}
</style>
</head>
<body>
<main class="container">

  <!-- 🔹 SLIDER 1 -->
  <section class="block">
    <h2>Avenir probable</h2>
    <input id="slider1" type="range" min="0" max="3" step="1" value="2">
    <div class="labels">
      <span>très décevant</span><span>décevant</span><span>bien</span><span>merveilleux</span>
    </div>
    <div id="label1" class="current-label"></div>
    <div id="msg1" class="message"></div>
  </section>

  <!-- 🔹 SLIDER 2 -->
  <section class="block">
    <h2>Ouverture au monde</h2>
    <input id="slider2" type="range" min="0" max="3" step="1" value="1">
    <div class="labels">
      <span>clos</span><span>prudent</span><span>équilibré</span><span>curieux</span><span>explorateur</span>
    </div>
    <div id="label2" class="current-label"></div>
    <div id="msg2" class="message"></div>
  </section>

</main>

<script>
// 🧠 TABLEAUX DES DONNÉES
// Slider 1 — tes textes actuels
const data1 = {
  labels: ["Misanthrope","Banal","Bien","Merveilleux"],
  messages: [
"J'ai tendance à penser ma vie comme un cycle de renaissance marqué par des phases de rupture auxquelles suivent une nouvelle façon de vivre, avec de nouvelles règles, de nouveaux comportements, et de nouvelles lubies. D'une manière générale, les périodes de rupture arrivent dans des moments où il n'est plus possible d'avancer, d'évoluer, ou quand des périodes de déception immense se présentent. Ainsi, à la fin d'un cycle, avant de redéfinir celui qui s'apprête à arriver, il est important de mesurer les ressources avec lesquelles je pars, et qui, d'une certaine façon, auront une détermination dans le cycle à venir. Pour que les cycles ne soient pas liés totalement entre eux, que la vie demeure la vie, j'essaye de puiser au plus profond de moi afin de trouver de nouvelles ressources qui n'auraient pas forcément été exploitées ou investir plus d'énergie que je n'en ai vraiment. Toutefois, deux motifs m'ont historiquement fait vaciller au point de frôler une renonciation à la renaissance. Le premier est l'ingratitude des gens. J'ai en effet tendance à considérer les relations sociales comme une sorte d'immense pot dans lequel chacun doit jeter des choses afin de nourrir la relation et de permettre l'épanouissement de chacun. Dans les faits, cette situation est cependant souvent très limitée. En effet, la plupart des gens ne jettent que ce qu'ils pensent absolument nécessaire à ce pot, voire font l'économie d'un tel geste. Ainsi, on se retrouve finalement non seulement seul, mais également endetté, ce qui constitue le premier motif. D'une autre part, les gens manquent cruellement d'efficacité, ce qui vient constituer le second motif. D'une manière générale, nous nous engageons dans certaines tâches parce que des pulsions, des émotions ou des sentiments nous poussent à nous réaliser à travers des objectifs personnels. Cela signifie que nous prenons rarement les choses extérieures à nous véritablement au sérieux. Le plus souvent, nous ne les considérons que sous l'angle de ce qu'elles reflètent de nous ou de ce que nous y avons investi. Cela révèle un manque de sérieux et d'efficacité qui semble isoler chacun dans sa propre subjectivité, l'enfermer en lui-même. Dans cette perspective, les relations sociales ne sont souvent que de simples malentendus."  "On passe notre temps à rêver que des choses extraordinaires pourraient nous arriver ; on imagine des futurs possibles, des scénarios grandioses. On se projette ici et là, et les circonstances de la vie nous poussent parfois à revoir nos ambitions à la hausse, comme si tout était sur le point de basculer en notre faveur. Mais il arrive aussi que l’on se retrouve seul, dans un square ou chez soi, avec l’impression que le monde avance sans nous. Comme si l’on était devenu un esprit, un fantôme, observant la vie défiler sans pouvoir y exercer la moindre influence. Alors, tous les rêves qu’on avait construits se désagrègent sous nos yeux. Par rapport à tout ce que l’on avait imaginé, la réalité se révèle profondément différente : on voit le temps passer, sans évoluer, sans atteindre ce que l’on avait espéré. Et l’on comprend que tout cela n’était peut-être qu’une belle illusion.",
  "Je parviens à réunir des gens passionnants et à créer une sorte de fidélité me permettant de construire un petit cercle de gens fidèles. Cet écosystème parvient à entretenir en moi une certaine chaleur que je peux distribuer autour de moi et qui me permet de vivre apaisé. Ce milieu extrêmement fertile me donne matière à penser et à continuer de créer.Les gens que je rassemble ont certains talents qui boostent les projets que je souhaite créer et me permettent d'aller plus loin que je n'aurais pu aller seul.",
  "Je rencontrerai enfin les gens que je dois rencontrer. Nos talents s'uniraient pour n'en former qu'un, et réaliser la palingénésie."
  ]
};

// Slider 2 — ➜ À PERSONNALISER (exemple)
const data2 = {
  labels: ["D","S","Y"],
  messages: [
    "Je préfère rester dans un environnement connu.",
    "Je réfléchis avant d’aller vers les autres.",
    "J’aime l’équilibre : m’ouvrir sans me perdre.",
  ]
};


// 🎛 Fonction générique pour gérer chaque duo slider + affichage
function bindSlider(id, data){
  const slider = document.getElementById(id);
  const label = document.getElementById("label" + id.at(-1));
  const msg = document.getElementById("msg" + id.at(-1));

  function update(){
    const v = Number(slider.value);
    label.textContent = data.labels[v] ?? "";
    msg.textContent = data.messages[v] ?? "";
  }

  slider.addEventListener("input", update);
  update(); // initialisation
}

// Activation ✨
bindSlider("slider1", data1);
bindSlider("slider2", data2);
</script>
</body>
</html>
