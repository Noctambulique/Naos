<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Jeu de cartes</title>

<style>
/* =======================
   VARIABLES PERSONNALISABLES
   ======================= */
:root {
  --bg: #0f172a;
  --card-bg: #ffffff;
  --card-border: #cbd5f5;
  --text-dark: #020617;
  --red: #dc2626;
  --black: #020617;
  --radius: 14px;
  --shadow: 0 8px 20px rgba(0,0,0,.25);
}

/* =======================
   BASE
   ======================= */
* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  font-family: system-ui, sans-serif;
  color: white;
  padding: 32px;
}

/* =======================
   TITRE
   ======================= */
h1 {
  text-align: center;
  font-size: 2.2rem;
  margin-bottom: 32px;
}

/* =======================
   GRILLE DE CARTES
   ======================= */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
  gap: 18px;
  max-width: 1100px;
  margin: auto;
}

/* =======================
   CARTE
   ======================= */
.card {
  background: var(--card-bg);
  border-radius: var(--radius);
  border: 1px solid var(--card-border);
  box-shadow: var(--shadow);
  padding: 10px;
  aspect-ratio: 2.5 / 3.5;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  transition: transform .15s ease, box-shadow .15s ease;
}

.card:hover {
  transform: translateY(-4px);
  box-shadow: 0 12px 28px rgba(0,0,0,.35);
}

.card.red { color: var(--red); }
.card.black { color: var(--black); }

/* =======================
   CONTENU DE LA CARTE
   ======================= */
.corner {
  font-weight: 700;
  font-size: 0.9rem;
}

.center {
  text-align: center;
  font-size: 2rem;
  user-select: none;
}
</style>
</head>

<body>

<h1 id="title">Mon jeu de cartes</h1>

<div class="grid" id="grid"></div>

<script>
/* =======================
   DONNÉES DU JEU
   ======================= */

const suits = [
  { name: "Pique", symbol: "♠", color: "black" },
  { name: "Cœur", symbol: "♥", color: "red" },
  { name: "Carreau", symbol: "♦", color: "red" },
  { name: "Trèfle", symbol: "♣", color: "black" }
];

const values = [
  { label: "A", name: "As" },
  { label: "2" }, { label: "3" }, { label: "4" },
  { label: "5" }, { label: "6" }, { label: "7" },
  { label: "8" }, { label: "9" }, { label: "10" },
  { label: "J", name: "Valet" },
  { label: "Q", name: "Dame" },
  { label: "K", name: "Roi" }
];

/* =======================
   LIEN PERSONNALISABLE
   ======================= */
/*
  Tu peux :
  - retourner toujours la même page
  - retourner une page différente selon la carte
*/
function linkFor(card) {
  // Exemple simple :
  return "page-carte.html";

  // Exemple avancé :
  // return `cartes/${card.value}_${card.suit}.html`;
}

/* =======================
   GÉNÉRATION DES CARTES
   ======================= */
const grid = document.getElementById("grid");

suits.forEach(suit => {
  values.forEach(value => {
    const card = document.createElement("div");
    card.className = `card ${suit.color}`;

    card.innerHTML = `
      <div class="corner">${value.label}${suit.symbol}</div>
      <div class="center">${suit.symbol}</div>
      <div class="corner" style="transform: rotate(180deg)">
        ${value.label}${suit.symbol}
      </div>
    `;

    card.onclick = () => {
      window.location.href = linkFor({
        suit: suit.name,
        value: value.label
      });
    };

    grid.appendChild(card);
  });
});
</script>

</body>
</html>
