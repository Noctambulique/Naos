<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Cartographie des cartes</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&display=swap');

:root{
  --bg:#0f172a;
  --card:#ffffff;
  --border:#cbd5f5;
  --inner:#e5e7eb;
  --shadow:0 14px 30px rgba(0,0,0,.35);
  --red:#dc2626;
  --black:#020617;
  --radius:16px;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:radial-gradient(circle at top,#1e293b,#020617);
  font-family:system-ui,sans-serif;
  padding:40px;
  color:white;
}

/* =========================
   STRUCTURE GÉNÉRALE
   ========================= */

.board{
  max-width:1300px;
  margin:auto;
  display:flex;
  flex-direction:column;
  gap:56px;
}

.suit-section{
  display:flex;
  flex-direction:column;
  gap:18px;
}

.suit-title{
  font-family:'Playfair Display',serif;
  font-size:1.7rem;
  letter-spacing:.1em;
  text-transform:uppercase;
  padding-left:6px;
}

.suit-title.red{ color:var(--red); }
.suit-title.black{ color:#e5e7eb; }

.suit-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(95px,1fr));
  gap:22px;
}

/* =========================
   CARTE
   ========================= */

.card{
  position:relative;
  background:linear-gradient(135deg,#ffffff,#f8fafc);
  border-radius:var(--radius);
  border:1px solid var(--border);
  box-shadow:var(--shadow);
  aspect-ratio:2.5/3.5;
  cursor:pointer;
  overflow:hidden;
  transition:.25s ease;
}

.card:hover{
  transform:translateY(-6px) rotate(-0.5deg);
  box-shadow:0 22px 40px rgba(0,0,0,.45);
}

.card::before{
  content:"";
  position:absolute;
  inset:8px;
  border:1px solid var(--inner);
  border-radius:12px;
  pointer-events:none;
}

.card.red{color:var(--red)}
.card.black{color:var(--black)}

/* =========================
   COINS
   ========================= */

.corner{
  position:absolute;
  font-family:'Playfair Display',serif;
  font-weight:700;
  font-size:1rem;
  line-height:1.05;
  display:flex;
  flex-direction:column;
  align-items:flex-start;
}

.corner.top{
  top:10px;
  left:10px;
}

.corner.bottom{
  bottom:28px;
  right:10px;
  transform:rotate(180deg);
}

/* =========================
   CENTRE
   ========================= */

.center{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:3.2rem;
  font-family:'Playfair Display',serif;
  opacity:.9;
  pointer-events:none;
}

/* =========================
   TITRE
   ========================= */

.label{
  position:absolute;
  bottom:8px;
  left:8px;
  right:8px;
  text-align:center;
  font-size:.7rem;
  letter-spacing:.08em;
  opacity:.7;
}
</style>
</head>

<body>

<div class="board" id="board"></div>

<script>
/* =========================
   DONNÉES
   ========================= */

const nodes = [
  { link:"Savoir.html", label:"Savoir, Roi de ♦️" },
  { link:"Frise Philo.html", label:"Histoire Philo, Dame de ♦️" },
  { link:"Psycho.html", label:"Psycho, Valet de ♦️" },
  { link:"Philo.html", label:"Philo-map, 10 de ♦️" },
  { link:"Biblio.html", label:"Biblio-Map, 9 de ♦️" },
  { link:"Cool.html", label:"Trucs cools, 8 de ♦️" },
  { link:"Esthétique.html", label:"Esthétique, 7 de ♦️" },

  { link:"Biographie.html", label:"Biographie, Roi de ❤️" },
  { link:"Musique.html", label:"Musique, Dame de ❤️" },
  { link:"Culture.html", label:"Culture, Valet de ❤️" },
  { link:"Dressing.html", label:"Dressing, 10 de ❤️" },
  { link:"excelart.html", label:"Excel Art, 9 de ❤️" },
  { link:"Plante.html", label:"Plantes, 8 de ❤️" },
  { link:"Artefact.html", label:"Artefact, 7 de ❤️" },
  { link:"Gardien.html", label:"Sexualité, 6 de ❤️" },
  { link:"Galerie.html", label:"Galerie, 5 de ❤️" },

  { link:"Conversation.html", label:"Répertoire, Dame de ♠️" },
  { link:"Triade.html", label:"Triade, Valet de ♠️" },
  { link:"Iceberg.html", label:"Iceberg, 10 de ♠️" },
  { link:"Amis.html", label:"Gens, 9 de ♠️" },
  { link:"Lubies.html", label:"Lubies, 8 de ♠️" },
  { link:"Multivers.html", label:"Multivers, 7 de ♠️" },

  { link:"Maison des Bio.html", label:"Musée des Bio, Roi de ♣️" },
  { link:"Anecdotes.html", label:"Anecdotes, Dame de ♣️" },
  { link:"Cartes.html", label:"Cartes, Valet de ♣️" },
  { link:"Musique.html", label:"Musique, 10 de ♣️" },
  { link:"Log.html", label:"Log, 9 de ♣️" },
  { link:"Internet.html", label:"Internet, 8 de ♣️" },
  { link:"Généalogie.html", label:"Généalogie, 7 de ♣️" },
  { link:"Logiciel.html", label:"Logiciel, 6 de ♣️" },
  { link:"Notice.html", label:"Notice, 5 de ♣️" },
  { link:"Cuisine.html", label:"Cuisine, 4 de ♣️" },
  { link:"Auto-Test.html", label:"Auto-Test, 3 de ♣️" },
];

/* =========================
   PARSING
   ========================= */

function parseCard(label){
  const match = label.match(/(.+),\s*(.+)\sde\s(♦️|❤️|♠️|♣️)/);
  if(!match) return null;

  return {
    title:match[1],
    value:match[2],
    suit:match[3],
    color:(match[3]==="♦️"||match[3]==="❤️")?"red":"black"
  };
}

/* =========================
   RENDU PAR COULEUR
   ========================= */

const board = document.getElementById("board");

const suits = {
  "♠️": { name:"Piques", class:"black" },
  "❤️": { name:"Cœurs", class:"red" },
  "♦️": { name:"Carreaux", class:"red" },
  "♣️": { name:"Trèfles", class:"black" }
};

for(const suit in suits){

  const section = document.createElement("section");
  section.className = "suit-section";

  const title = document.createElement("div");
  title.className = `suit-title ${suits[suit].class}`;
  title.textContent = `${suit} ${suits[suit].name}`;

  const grid = document.createElement("div");
  grid.className = "suit-grid";

  nodes.forEach(n=>{
    const d = parseCard(n.label);
    if(!d || d.suit !== suit) return;

    const card = document.createElement("div");
    card.className = `card ${d.color}`;

    card.innerHTML = `
      <div class="corner top">${d.value}<span>${d.suit}</span></div>
      <div class="center">${d.suit}</div>
      <div class="corner bottom">${d.value}<span>${d.suit}</span></div>
      <div class="label">${d.title}</div>
    `;

    card.onclick = ()=>location.href = n.link;
    grid.appendChild(card);
  });

  section.appendChild(title);
  section.appendChild(grid);
  board.appendChild(section);
}
</script>

</body>
</html>
