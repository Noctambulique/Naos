<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Cartographie des cartes</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&display=swap');

:root{
  --bg:#0f172a;
  --card:#ffffff;
  --border:#cbd5f5;
  --inner:#e5e7eb;
  --shadow:0 14px 30px rgba(0,0,0,.35);
  --red:#dc2626;
  --black:#020617;
  --radius:16px;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:radial-gradient(circle at top,#1e293b,#020617);
  font-family:system-ui,sans-serif;
  padding:40px;
  color:white;
}

.grid{
  max-width:1200px;
  margin:auto;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(95px,1fr));
  gap:22px;
}

/* =========================
   CARTE
   ========================= */

.card{
  position:relative;
  background:
    linear-gradient(135deg,#ffffff,#f8fafc);
  border-radius:var(--radius);
  border:1px solid var(--border);
  box-shadow:var(--shadow);
  padding:12px;
  aspect-ratio:2.5/3.5;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  cursor:pointer;
  transition:.25s ease;
  overflow:hidden;
}

.card::before{
  content:"";
  position:absolute;
  inset:8px;
  border:1px solid var(--inner);
  border-radius:12px;
  pointer-events:none;
}

.card:hover{
  transform:translateY(-6px) rotate(-0.6deg);
  box-shadow:0 22px 40px rgba(0,0,0,.45);
}

.card.red{color:var(--red)}
.card.black{color:var(--black)}

/* =========================
   COINS
   ========================= */

.corner{
  font-family:'Playfair Display',serif;
  font-weight:700;
  font-size:.95rem;
  line-height:1.05;
  display:flex;
  flex-direction:column;
  align-items:flex-start;
}

.corner.bottom{
  transform:rotate(180deg);
  align-self:flex-end;
}

/* =========================
   CENTRE
   ========================= */

.center{
  text-align:center;
  font-size:2.6rem;
  font-family:'Playfair Display',serif;
  opacity:.9;
  user-select:none;
}

/* =========================
   TITRE
   ========================= */

.label{
  position:absolute;
  bottom:10px;
  left:10px;
  right:10px;
  text-align:center;
  font-size:.65rem;
  letter-spacing:.04em;
  opacity:.65;
}
</style>
</head>

<body>

<div class="grid" id="grid"></div>

<script>
const nodes = [
  { link:"Savoir.html", label:"Savoir, Roi de ♦️" },
  { link:"Frise Philo.html", label:"Histoire Philo, Dame de ♦️" },
  { link:"Psycho.html", label:"Psycho, Valet de ♦️" },
  { link:"Philo.html", label:"Philo-map, 10 de ♦️" },
  { link:"Biblio.html", label:"Biblio-Map, 9 de ♦️" },
  { link:"Cool.html", label:"Trucs cools, 8 de ♦️" },
  { link:"Esthétique.html", label:"Esthétique, 7 de ♦️" },

  { link:"Biographie.html", label:"Biographie, Roi de ❤️" },
  { link:"Culture.html", label:"Culture, Dame de ❤️" },
  { link:"excelart.html", label:"Excel Culture, Valet de ❤️" },
  { link:"Dressing.html", label:"Dressing, 10 de ❤️" },
  { link:"Gardien.html", label:"Position, 9 de ❤️" },
  { link:"Plante.html", label:"Plantes, 8 de ❤️" },
  { link:"Artefact.html", label:"Artefact, 7 de ❤️" },
  { link:"Galerie.html", label:"Galerie, 5 de ❤️" },

  { link:"Conversation.html", label:"Répertoire, Dame de ♠️" },
  { link:"Triade.html", label:"Triade, Valet de ♠️" },
  { link:"Iceberg.html", label:"Iceberg, 10 de ♠️" },
  { link:"Amis.html", label:"Gens, 9 de ♠️" },
  { link:"Lubies.html", label:"Lubies, 8 de ♠️" },
  { link:"Multivers.html", label:"Multivers, 7 de ♠️" },

  { link:"Maison des Bio.html", label:"Musée des Bio, Roi de ♣️" },
  { link:"Anecdotes.html", label:"Anecdotes, Dame de ♣️" },
  { link:"Plan.html", label:"Plan, Valet de ♣️" },
  { link:"Musique.html", label:"Musique, 10 de ♣️" },
  { link:"Log.html", label:"Log, 9 de ♣️" },
  { link:"Internet.html", label:"Internet, 8 de ♣️" },
  { link:"Généalogie.html", label:"Généalogie, 7 de ♣️" },
  { link:"Logiciel.html", label:"Logiciel, 6 de ♣️" },
  { link:"Notice.html", label:"Notice, 5 de ♣️" },
  { link:"Cuisine.html", label:"Cuisine, 4 de ♣️" },
  { link:"Auto-Test.html", label:"Auto-Test, 3 de ♣️" },
  { link:"Cartes.html", label:"Cartes, 3 de ♣️" }
];

function parseCard(label){
  const match = label.match(/(.+),\s*(.+)\sde\s(♦️|❤️|♠️|♣️)/);
  if(!match) return null;

  return {
    title:match[1],
    value:match[2],
    suit:match[3],
    color:(match[3]==="♦️"||match[3]==="❤️")?"red":"black"
  };
}

const grid = document.getElementById("grid");

nodes.forEach(n=>{
  const d = parseCard(n.label);
  if(!d) return;

  const card = document.createElement("div");
  card.className = `card ${d.color}`;

  card.innerHTML = `
    <div class="corner">${d.value}<span>${d.suit}</span></div>
    <div class="center">${d.suit}</div>
    <div class="corner bottom">${d.value}<span>${d.suit}</span></div>
    <div class="label">${d.title}</div>
  `;

  card.onclick = ()=>location.href = n.link;
  grid.appendChild(card);
});
</script>

</body>
</html>
