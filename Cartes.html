<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Cartographie des cartes</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&display=swap');

:root{
  --border:#cbd5f5;
  --inner:#e5e7eb;
  --shadow:0 10px 22px rgba(0,0,0,.28);
  --red:#dc2626;
  --black:#020617;
  --radius:14px;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:radial-gradient(circle at top,#1e293b,#020617);
  font-family:system-ui,sans-serif;
  padding:32px;
  color:white;
}

/* =========================
   STRUCTURE PAR LIGNE
   ========================= */

.board{
  max-width:1200px;
  margin:auto;
  display:flex;
  flex-direction:column;
  gap:34px;
}

.suit-row{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(78px,1fr));
  gap:16px;
}

/* =========================
   CARTE (COMPACTE)
   ========================= */

.card{
  position:relative;
  background:linear-gradient(135deg,#ffffff,#f8fafc);
  border-radius:var(--radius);
  border:1px solid var(--border);
  box-shadow:var(--shadow);
  aspect-ratio:2.4/3.4;
  cursor:pointer;
  overflow:hidden;
  transition:.2s ease;
}

.card:hover{
  transform:translateY(-4px);
  box-shadow:0 16px 30px rgba(0,0,0,.38);
}

.card::before{
  content:"";
  position:absolute;
  inset:6px;
  border:1px solid var(--inner);
  border-radius:10px;
  pointer-events:none;
}

.card.red{color:var(--red)}
.card.black{color:var(--black)}

/* =========================
   COINS
   ========================= */

.corner{
  position:absolute;
  font-family:'Playfair Display',serif;
  font-weight:700;
  font-size:.75rem;
  line-height:1.05;
}

.corner.top{
  top:6px;
  left:6px;
}

.corner.bottom{
  bottom:22px;
  right:6px;
  transform:rotate(180deg);
}

/* =========================
   CENTRE
   ========================= */

.center{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:2.2rem;
  font-family:'Playfair Display',serif;
  opacity:.85;
  pointer-events:none;
}

/* =========================
   NOM (PLUS LISIBLE)
   ========================= */

.label{
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  padding:4px 6px;
  font-size:.65rem;
  font-weight:600;
  text-align:center;
  letter-spacing:.04em;
  background:rgba(15,23,42,.08);
  backdrop-filter:blur(4px);
}
</style>
</head>

<body>

<div class="board" id="board"></div>

<script>
/* =========================
   DONNÉES
   ========================= */

const nodes = [

    { link:"Biographie.html", label:"Biographie, Roi de ❤️" },
  { link:"Musique.html", label:"Musique, Dame de ❤️" },
  { link:"Culture.html", label:"Culture, Valet de ❤️" },
  { link:"Dressing.html", label:"Dressing, 10 de ❤️" },
  { link:"excelart.html", label:"Excel Art, 9 de ❤️" },
  
  { link:"Henné.html", label:"Henné, 7 de ❤️" },
  { link:"Plante.html", label:"Plantes, 6 de ❤️" },
  { link:"Cuisine.html", label:"Cuisine, 5 de ❤️" },
  { link:"Internet.html", label:"Internet, 4 de ❤️" },
  { link:"Artefact.html", label:"Objet, 3 de ❤️" },
  { link:"Galerie.html", label:"Galerie, 2 de ❤️" },
  { link:"Auto-Test.html", label:"Santé Mentale, 1 de ❤️" },

  
  { link:"Savoir.html", label:"Savoir, Roi de ♦️" },
  { link:"Psycho.html", label:"Psycho, Dame de ♦️" },
  { link:"Frise Philo.html", label:"Histoire Philo, Dame de ♦️" },
  { link:"Esthétique.html", label:"Esthétique, 10 de ♦️" },
  { link:"Livre.html", label:"Livre, 10 de ♦️" },

  { link:"Philo.html", label:"Philo-map, 6 de ♦️" },
  { link:"Biblio.html", label:"Biblio-Map, 5 de ♦️" },
  { link:"Maison des Bio.html", label:"Musée des Bio, 3 de ♦️" },
  { link:"Généalogie.html", label:"Généalogie, 2 de ♦️" },
  { link:"Intérêt.html", label:"Intérêt, 1 de ♦️" },


  { link:"Triade.html", label:"Triade, Dame de ♣️" },
  { link:"Conversation.html", label:"Répertoire, Valet de ♣️" },
  { link:"Iceberg.html", label:"Iceberg, 10 de ♣️" },
  { link:"Anecdotes.html", label:"Anecdotes, 9 de ♣️" },
  { link:"Multivers.html", label:"Multivers, 8 de ♣️" },
  { link:"Créature.html", label:"Créature, 7 de ♣️" },
  { link:"Cool.html", label:"Cool, 6 de ♣️" },
  { link:"Moi.html", label:"Moi, 5 de ♣️" },
  { link:"Log.html", label:"Log, 4 de ♣️" },
  { link:"Gardien.html", label:"Position, 3 de ♣️" },
  { link:"Gardien.html", label:"Secret, 2 de ♣️" },
  { link:"Gardien.html", label:"Sexualité, 1 de ♣️" },

  
  { link:"Lubies.html", label:"Lubies, 10 de ♠️" },
  { link:"Transe.html", label:"Transe, 8 de ♠️" },
  { link:"Classeur.html", label:"Classeur, 8 de ♠️" },
  { link:"Amis.html", label:"Gens, 2 de ♠️" },
  { link:"Certitude.html", label:"Certitude, 1 de ♠️" },

];

/* =========================
   PARSING
   ========================= */

function parseCard(label){
  const m = label.match(/(.+),\s*(.+)\sde\s(♦️|❤️|♠️|♣️)/);
  if(!m) return null;
  return {
    title:m[1],
    value:m[2],
    suit:m[3],
    color:(m[3]==="♦️"||m[3]==="❤️")?"red":"black"
  };
}

/* =========================
   RENDU PAR LIGNE (SANS TITRE)
   ========================= */

const board = document.getElementById("board");
const order = ["♠️","❤️","♦️","♣️"];

order.forEach(suit=>{
  const row = document.createElement("div");
  row.className = "suit-row";

  nodes.forEach(n=>{
    const d = parseCard(n.label);
    if(!d || d.suit !== suit) return;

    const card = document.createElement("div");
    card.className = `card ${d.color}`;

    card.innerHTML = `
      <div class="corner top">${d.value}<span>${d.suit}</span></div>
      <div class="center">${d.suit}</div>
      <div class="corner bottom">${d.value}<span>${d.suit}</span></div>
      <div class="label">${d.title}</div>
    `;

    card.onclick = ()=>location.href = n.link;
    row.appendChild(card);
  });

  board.appendChild(row);
});
</script>

</body>
</html>
