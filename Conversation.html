<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Trois Rectangles</title>

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
      font-family:'Cormorant Garamond', serif;
    }

    body{
      background:#faf7f2;
      color:#111;
      font-size:20px;
      min-height:100vh;
      display:grid;
      grid-template-columns:1fr 1fr 1fr;
    }

    .rect{
      padding:30px;
      overflow-y:auto;
    }

    #r1{background:#fde2e4;} /* rose pâle */
    #r2{background:#e2f0cb;} /* vert pâle */
    #r3{background:#cdeffd;} /* bleu pâle */

    .title{
      font-size:26px;
      font-weight:600;
      margin-bottom:14px;
      text-transform:uppercase;
    }

    .line{
      margin-bottom:12px;
      cursor:pointer;
      display:block;
      font-size:20px;
      opacity:0.9;
      transition:0.2s ease;
    }

    .line:hover{
      opacity:1;
      padding-left:6px;
    }

    .reader{
      position:fixed;
      inset:0;
      background:rgba(250,247,242,0.95);
      backdrop-filter:blur(4px);
      display:none;
      align-items:center;
      justify-content:center;
      padding:40px;
      z-index:9999;
      opacity:0;
      transition:opacity .35s ease;
    }

    .reader.open{
      display:flex;
      opacity:1;
    }

    .reader .card{
      max-width:850px;
      max-height:85vh;
      overflow:auto;
      font-size:26px;
      line-height:1.55;
      padding:20px;
      border-radius:6px;
      background:#fff;
    }

    .close{
      position:absolute;
      top:18px;
      right:22px;
      font-size:34px;
      border:0;
      background:transparent;
      cursor:pointer;
      opacity:0.7;
      transition:0.2s;
    }
    .close:hover{opacity:1;}

    @media(max-width:700px){
      body{grid-template-columns:1fr; height:auto;}
    }
  </style>
</head>

<body>

  <!-- RECTANGLE 1 -->
  <div class="rect" id="r1">
    <div class="title">Anti-Conscience</div>
    <span class="line" data-full="Je fais ce que je fais sans raison">De ses intérêts</span>

      <div class="title" style="margin-top:30px;">Conscience</div>
    <span class="line" data-full="Ce qui constitue la fin des imaginaires.">Parler des rêves</span>
    
      <div class="title">Pro-Conscience</div>
    <span class="line" data-full="Information liée à l’élément X.">Il semble que tu sois...</span>

      </div>

  <!-- RECTANGLE 2 -->
  <div class="rect" id="r2">
    <div class="title">Force</div>
    <span class="line" data-full="Information liée à l’élément X.">Contre-Intuitif</span>
  
    <div class="title">Pro-Conscience</div>
    <span class="line" data-full="Etudier la solidité des connaissances, le bien et le mal, les questions existentielles.">Vibes paradox</span>

       <div class="title" style="margin-top:30px;">Pro-Force</div>
    <span class="line" data-full="X.">Compliment</span>
    
  </div>

  <!-- RECTANGLE 3 -->
  <div class="rect" id="r3">

    <div class="title">Conscience</div>
    <span class="line" data-full="Ce que les gens assument et n'assument pas.">Chercher les ambiguités</span>
    

  </div>

  <div class="reader" id="reader">
    <button class="close" id="closeReader">✕</button>
    <div class="card" id="readerCard"></div>
  </div>

<script>
  const reader = document.getElementById('reader');
  const readerCard = document.getElementById('readerCard');
  const closeReader = document.getElementById('closeReader');

  function openReader(html){
    readerCard.innerHTML = html;
    reader.classList.add('open');
  }

  function closeReaderFn(){
    reader.classList.remove('open');
  }

  closeReader.onclick = closeReaderFn;

  document.querySelectorAll('.line').forEach(el=>{
    el.onclick = ()=>{
      const full = el.dataset.full || el.textContent;
      openReader(full);
    };
  });

  document.addEventListener('keydown',e=>{
    if(e.key==='Escape') closeReaderFn();
  });
</script>

</body>
</html>
