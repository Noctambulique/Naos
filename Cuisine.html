<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Jardin de Basile</title>

  <!-- Polices raffinées -->
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital@0;1&family=Merriweather:wght@300;400&display=swap" rel="stylesheet">

  <style>
    :root{--cols:2}

    *{box-sizing:border-box;margin:0;padding:0}

    html,body{
      height:100%;
      font-family:"Merriweather","EB Garamond",serif;
      background:#fff;
      color:#111;
      display:flex;
      align-items:center;
      justify-content:center;
      transition:opacity 1s ease;
      letter-spacing:0.4px;
    }

    body.fade{opacity:0}

    /* --- IMAGE EN HAUT --- */
    #banniere{
      width:100%;
      max-height:25vh;
      object-fit:cover;
      margin-bottom:2vh;
      border-radius:6px;
    }

    main{
      width:100%;
      padding:4vh 6vw;
      transition:opacity .5s ease;
      text-align:center;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(var(--cols),1fr);
      gap:24px;
    }

    .word{
      background:transparent;
      border:0;
      padding:24px;
      cursor:pointer;
      outline:none;
      font-size:1.55rem;
      font-family:"EB Garamond",serif;
      transition:opacity .3s,transform .25s;
      letter-spacing:0.6px;
    }
    .word:active{transform:scale(.97)}
    .word.fade{opacity:.45}

    #detail{
      display:none;
      flex-direction:column;
      align-items:center;
      justify-content:flex-start;
      padding:5vh 8vw;
      animation:fadeIn .6s ease;
      width:100%;
      height:100%;
      text-align:center;
    }

    #detail img{
      max-width:100%;
      max-height:60vh;
      object-fit:contain;
      border-radius:6px;
      margin:25px 0;
    }

    #detail p{
      font-size:1.35rem;
      line-height:1.65;
      font-family:"EB Garamond",serif;
      letter-spacing:0.4px;
    }

    /* Flèche retour */
    #retour{
      position:absolute;
      top:20px;
      left:20px;
      background:transparent;
      border:none;
      font-size:1.3rem;
      cursor:pointer;
      font-family:inherit;
      color:#111;
      display:flex;
      align-items:center;
      gap:6px;
      transition:opacity .3s;
    }
    #retour:hover{opacity:0.7}
    #retour::before{
      content:"←";
      font-size:1.3rem;
    }

    @keyframes fadeIn{from{opacity:0}to{opacity:1}}

  </style>
</head>
<body>

  <main id="main">


    <div id="grid" class="grid" style="--cols:2"></div>
  </main>

  <section id="detail">
    <button id="retour">Retour</button>
    <img id="imageDetail" src="" alt="" />
    <p id="texteDetail"></p>
  </section>

  <script>
    const grid = document.getElementById('grid');
    const main = document.getElementById('main');
    const detail = document.getElementById('detail');
    const imgDetail = document.getElementById('imageDetail');
    const texteDetail = document.getElementById('texteDetail');
    const retour = document.getElementById('retour');

    const mots = [
      { mot: 'Pates Butternet Morilles', texte: 'Pates Butternet Morilles', image: 'D hiver/IMG_5595.JPG' },
      { mot: 'Quiche Poivron Feta', texte: 'Quiche Poivron Feta', image: 'D hiver/IMG_5596.JPG' },
      { mot: 'Epinard Butternet', texte: 'Epinard Butternet', image: 'D hiver/IMG_5610.JPG' },
      { mot: 'Soupe Choux Rouge', texte: 'Soupe Choux Rouge', image: 'D hiver/IMG_5709.JPG' },
    ];

    function genererMots() {
      grid.innerHTML = '';
      mots.forEach(item => {
        const btn = document.createElement('button');
        btn.className = 'word';
        btn.textContent = item.mot;
        btn.dataset.text = item.texte;
        btn.dataset.image = item.image;
        grid.appendChild(btn);
      });
    }
    genererMots();

    grid.addEventListener('click', e => {
      const btn = e.target.closest('.word');
      if (!btn) return;

      btn.classList.add('fade');
      setTimeout(() => btn.classList.remove('fade'), 350);

      main.style.opacity = 0;

      setTimeout(() => {
        main.style.display = 'none';
        texteDetail.textContent = btn.dataset.text;

        if (btn.dataset.image) {
          imgDetail.src = btn.dataset.image;
          imgDetail.style.display = 'block';
        } else {
          imgDetail.style.display = 'none';
        }

        detail.style.display = 'flex';
      }, 380);
    });

    retour.addEventListener('click', () => {
      detail.style.display = 'none';
      main.style.display = 'block';
      setTimeout(() => { main.style.opacity = 1; }, 100);
    });
  </script>
</body>
</html>
