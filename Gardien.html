<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dialogue</title>
<style>
body{
  margin:0;
  background:#ffffff;
  font-family:'Courier New', monospace;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  height:100vh;
  padding:20px;
}
.box{
  width:100%;
  max-width:900px;
  background:#f4f4f4;
  border:3px solid #000;
  border-radius:6px;
  padding:20px;
  box-shadow:0 0 0 4px #000, 0 0 0 8px #999;
}
.speaker{
  font-weight:bold;
  margin-bottom:10px;
  font-size:16px;
  color:#000;
}
.text{
  white-space:pre-wrap;
  min-height:80px;
  color:#000;
  font-size:17px;
}
.hint{
  text-align:right;
  font-size:13px;
  color:#444;
  margin-top:12px;
  font-weight:bold;
}
</style>
</head>
<body>
<div class="box">
  <div class="speaker" id="speaker"></div>
  <div class="text" id="text"></div>
  <div class="hint">Entrée</div>
</div>

<script>
const lines=[
  {s:"Garde",t:"Halte. Cette section de la ville est verrouillée."},
  {s:"Garde",t:"Personne n’entre. Même les  n’ont plus accès."},
  {s:"Garde",t:"Les raisons ne concernent pas le public.\nFaites demi-tour immédiatement."}
];
  
let i=0, typing=false, pos=0;

function showLine(){
  const L=lines[i];
  document.getElementById("speaker").textContent=L.s;
  const el=document.getElementById("text");
  el.textContent="";
  pos=0; typing=true;
  type(L.t,el);
}

function type(str,el){
  if(!typing) return;
  el.textContent=str.slice(0,pos++);
  if(pos<=str.length) setTimeout(()=>type(str,el),16);
  else typing=false;
}

function next(){
  if(typing){
    typing=false;
    document.getElementById("text").textContent=lines[i].t;
    return;
  }
  i++;
  if(i<lines.length) showLine();
}

document.addEventListener("keydown",e=>{ if(e.key==="Enter") next(); });

showLine();
</script>
</body>
</html>
