<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Naos</title>

<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:system-ui,Segoe UI,Roboto,Arial;
  background:#000;
}

#viewport{
  position:fixed;
  inset:0;
  overflow:hidden;
  touch-action:none;
}

#map{
  position:absolute;
  width:1600px;
  height:1600px;

  background-repeat:no-repeat;
  background-position:top center;
  background-size:contain;

  transform-origin:0 0;
  will-change:transform;
}

/* ===== MARKERS ===== */

.marker-wrap{
  position:absolute;
  transform:translate(-50%,-50%);
  text-align:center;
  z-index:10;
  user-select:none;
}

.marker{
  display:block;
  cursor:pointer;
  width:100%;
  height:auto;
  object-fit:contain;
}

.marker-label{
  margin-top:4px;
  padding:2px 6px;
  font-size:12px;
  color:#fff;
  background:rgba(0,0,0,.65);
  border-radius:6px;
  white-space:nowrap;
  pointer-events:none;
}
</style>
</head>

<body>

<div id="viewport">
  <div id="map"></div>
</div>
