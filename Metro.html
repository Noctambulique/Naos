<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Naos</title>

<style>
:root{
  --ui-bg: rgba(0,0,0,0.6);
  --ui-color: #fff;
  --player-size: 36px;
  --marker-size: 90px;
}

html,body{
  margin:0;
  height:100%;
  font-family:system-ui,Segoe UI,Roboto,Arial;
}

#app{
  height:100vh;
  display:flex;
  flex-direction:column;
}

#hud{
  position:fixed;
  left:10px;
  top:10px;
  z-index:30;
  background:var(--ui-bg);
  color:var(--ui-color);
  padding:8px 12px;
  border-radius:8px;
  font-size:14px;
  box-shadow:0 4px 12px rgba(0,0,0,.4);
  user-select:none;
}

#hud b{min-width:80px;display:inline-block}

#viewport{
  position:relative;
  flex:1;
  overflow:hidden;
  background:#222;
  touch-action:none;
}

#map{
  position:absolute;
  left:0;
  top:0;
  transform-origin:0 0;
  background-size:cover;
}

#player{
  position:absolute;
  width:var(--player-size);
  height:var(--player-size);
  margin-left:calc(var(--player-size)/-2);
  margin-top:calc(var(--player-size)/-2);
  z-index:40;
  cursor:grab;
  display:block;
}

#player:active{cursor:grabbing}

.marker{
  position:absolute;
  width:var(--marker-size);
  height:var(--marker-size);
  margin-left:calc(var(--marker-size)/-2);
  margin-top:calc(var(--marker-size)/-2);
  z-index:35;
  object-fit:contain;
  user-select:none;
}

#modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.7);
  z-index:100;
  align-items:center;
  justify-content:center;
}

#modal img{
  max-width:90vw;
  max-height:90vh;
  border-radius:8px;
}

@media(max-width:600px){
  :root{
    --player-size:28px;
    --marker-size:28px;
  }
}
</style>
</head>

<body>
<div id="app">

<div id="hud">
  <div><b>Position</b> <span id="pos">x:0 y:0</span></div>
  <div><b>Map</b> <span id="mapName"></span></div>
  <div><b>Lieu</b> <span id="locLabel"></span></div>
</div>

<div id="viewport">
  <div id="map">
    <img id="player" draggable="false"
      src="data:image/svg+xml;utf8,
      <svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'
      fill='none' stroke='%23ffcc00' stroke-width='1.5'>
      <circle cx='12' cy='10' r='3.2'/>
      <path d='M12 2v3M12 21v-3M20 12h-3M7 12H4'/>
      </svg>">
  </div>
</div>

<div id="modal" onclick="hideModal()">
  <img id="modalImg">
</div>

</div>

<script>
/* ================= CONFIG ================= */

const MAPS = {
  "ville-centre":{
    id:"ville-centre",
    name:"Ville - Centre",
    bg:"Map/Metro Plan.png",
    width:1700,
    height:1700
  }
};

const LOCATIONS = [
    { x: 1316, y: 757, img: "Map/20251209_0031_Bouche de Métro Nocturne_simple_compose_01kc04tdvfe89b447ny9471ewx.png", type: "document", link: "Gardien.html", label:"Secret, 6 de ❤️", size: 80 },
  { x: 890, y: 505, img: "Map/Maison1.png", type: "document", link: "Cuisine.html", label:"Cuisine, 4 de ♣️", size: 80 },
  { x: 1436, y: 850, img: "Map/Maison1.png", type: "document", link: "Internet.html", label:"Internet, 8 de ♣️", size: 80 },
  { x: 1076, y: 597, img: "Map/Maison1.png", type: "document", link: "Galerie.html", label:"Galerie, 5 de ❤️", size: 80, eLabel: "S'ancrer", eGroup: 6 },
  { x: 241, y: 477, img: "Map/20251209_0031_Bouche de Métro Nocturne_simple_compose_01kc04tdvfe89b447ny9471ewx.png", type: "document", link: "Gardien.html", label:"Sexualité, 4 de ❤️", size: 80 },
  { x: 873, y: 247, img: "Map/Maison1.png", type: "document", link: "Logiciel.html", label:"Logiciel, 6 de ♣️", size: 80 },

];
const PLAYER_SPEED = 800;
const CLICK_RADIUS = 40;
const DETECTION_RADIUS = 60;

let CURRENT_MAP_ID = "ville-centre";

const state = {
  mapObj:null,
  player:{x:0,y:0},
  keys:{},
  dragging:false,
  lastTs:null
};

/* ================= DOM ================= */

const viewport = document.getElementById("viewport");
const mapEl = document.getElementById("map");
const playerEl = document.getElementById("player");
const posEl = document.getElementById("pos");
const mapNameEl = document.getElementById("mapName");
const locLabelEl = document.getElementById("locLabel");
const modal = document.getElementById("modal");
const modalImg = document.getElementById("modalImg");

/* ================= MAP ================= */

function loadMap(id){
  const m = MAPS[id];
  if(!m) return;
  state.mapObj = m;
  mapEl.style.width = m.width+"px";
  mapEl.style.height = m.height+"px";
  mapEl.style.backgroundImage = `url("${m.bg}")`;
  mapNameEl.textContent = m.name;
}

/* ================= PLAYER ================= */

function clampPlayer(){
  const m = state.mapObj;
  if(!m) return;
  state.player.x = Math.max(0,Math.min(m.width,state.player.x));
  state.player.y = Math.max(0,Math.min(m.height,state.player.y));
}

function centerOnPlayer(){
  const vpW = viewport.clientWidth;
  const vpH = viewport.clientHeight;
  const mapW = mapEl.clientWidth;
  const mapH = mapEl.clientHeight;

  let x = vpW/2 - state.player.x;
  let y = vpH/2 - state.player.y;

  x = Math.min(0,Math.max(vpW-mapW,x));
  y = Math.min(0,Math.max(vpH-mapH,y));

  mapEl.style.transform = `translate(${x}px,${y}px)`;
  playerEl.style.left = state.player.x+"px";
  playerEl.style.top = state.player.y+"px";
}

/* ================= INPUT ================= */

window.addEventListener("keydown",e=>{
  state.keys[e.key.toLowerCase()] = true;
});

window.addEventListener("keyup",e=>{
  state.keys[e.key.toLowerCase()] = false;
});

/* ================= LOOP ================= */

function loop(ts){
  if(!state.lastTs) state.lastTs = ts;
  const dt = (ts-state.lastTs)/1000;
  state.lastTs = ts;

  let dx = 0, dy = 0;
  if(state.keys.w||state.keys.arrowup) dy--;
  if(state.keys.s||state.keys.arrowdown) dy++;
  if(state.keys.a||state.keys.arrowleft) dx--;
  if(state.keys.d||state.keys.arrowright) dx++;

  if(dx||dy){
    const len = Math.hypot(dx,dy)||1;
    state.player.x += dx/len*PLAYER_SPEED*dt;
    state.player.y += dy/len*PLAYER_SPEED*dt;
    clampPlayer();
    centerOnPlayer();
  }

  posEl.textContent = `x:${Math.round(state.player.x)} y:${Math.round(state.player.y)}`;
  requestAnimationFrame(loop);
}

/* ================= MODAL ================= */

function showModal(src){
  modalImg.src = src;
  modal.style.display="flex";
}

function hideModal(){
  modal.style.display="none";
  modalImg.src="";
}

/* ================= INIT ================= */

function init(){
  loadMap(CURRENT_MAP_ID);
  state.player.x = state.mapObj.width/2;
  state.player.y = state.mapObj.height/2;
  centerOnPlayer();
  requestAnimationFrame(loop);
}

init();
</script>
</body>
</html>
