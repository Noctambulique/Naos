<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Naos</title>

<style>
html,body{
  margin:0;
  height:100%;
  overflow:hidden;
  font-family:system-ui,Segoe UI,Roboto,Arial;
  background:#000;
}

#viewport{
  position:fixed;
  inset:0;
  overflow:hidden;
  touch-action:none;
}

#map{
  position:absolute;
  left:0;
  top:0;
  width:1600px;
  height:1600px;

  background-repeat:no-repeat;
  background-position:top left;
  background-size:1600px 1600px;

  will-change:transform;
}


/* ===== MARKERS ===== */

.marker-wrap{
  position:absolute;
  transform:translate(-50%,-50%);
  text-align:center;
  z-index:10;
  user-select:none;
}

.marker{
  display:block;
  object-fit:contain;
  cursor:pointer;
}

.marker-label{
  margin-top:4px;
  padding:2px 6px;
  font-size:12px;
  line-height:1.2;
  color:#fff;
  background:rgba(0,0,0,.65);
  border-radius:6px;
  white-space:nowrap;
  pointer-events:none;
}
</style>
</head>

<body>

<div id="viewport">
  <div id="map"></div>
</div>

<script>
/* ================= CONFIG ================= */

const MAP = {
  bg:"Map/Metro Plan.png",
  width:1600,
  height:1600
};

const LOCATIONS = [
  {
    x:1316,
    y:757,
    img:"Map/20251209_0031_Bouche de Métro Nocturne_simple_compose_01kc04tdvfe89b447ny9471ewx.png",
    link:"Gardien.html",
    label:"Secret — 6 ❤️",
    size:95
  },
  {
    x:890,
    y:505,
    img:"Map/Maison1.png",
    link:"Cuisine.html",
    label:"Cuisine — 4 ♣️",
    size:110
  },
  {
    x:1436,
    y:850,
    img:"Map/Maison1.png",
    link:"Internet.html",
    label:"Internet — 8 ♣️",
    size:80
  },
  {
    x:1076,
    y:597,
    img:"Map/Maison1.png",
    link:"Galerie.html",
    label:"Galerie — 5 ❤️",
    size:100
  },
  {
    x:241,
    y:477,
    img:"Map/20251209_0031_Bouche de Métro Nocturne_simple_compose_01kc04tdvfe89b447ny9471ewx.png",
    link:"Gardien.html",
    label:"Sexualité — 4 ❤️",
    size:90
  },
  {
    x:873,
    y:247,
    img:"Map/Maison1.png",
    link:"Logiciel.html",
    label:"Logiciel — 6 ♣️",
    size:75
  }
];

/* ================= STATE ================= */

const viewport = document.getElementById("viewport");
const mapEl = document.getElementById("map");

let cam = { x:0, y:0 };
let drag = { active:false, x:0, y:0, cx:0, cy:0 };

/* ================= INIT MAP ================= */

mapEl.style.width = MAP.width + "px";
mapEl.style.height = MAP.height + "px";
mapEl.style.backgroundImage = `url("${MAP.bg}")`;

/* Centrage initial */
cam.x = (viewport.clientWidth  - MAP.width ) / 2;
cam.y = (viewport.clientHeight - MAP.height) / 2;
applyCam();

/* ================= CREATE MARKERS ================= */

LOCATIONS.forEach(loc=>{
  const wrap = document.createElement("div");
  wrap.className = "marker-wrap";
  wrap.style.left = loc.x + "px";
  wrap.style.top  = loc.y + "px";

  const img = document.createElement("img");
  img.src = loc.img;
  img.className = "marker";
  img.style.width  = (loc.size || 80) + "px";
  img.style.height = (loc.size || 80) + "px";
  img.onclick = ()=>location.href = loc.link;

  const label = document.createElement("div");
  label.className = "marker-label";
  label.textContent = loc.label || "";

  wrap.appendChild(img);
  wrap.appendChild(label);
  mapEl.appendChild(wrap);
});

/* ================= CAMERA ================= */

function applyCam(){
  const minX = viewport.clientWidth  - MAP.width;
  const minY = viewport.clientHeight - MAP.height;

  cam.x = Math.min(0, Math.max(minX, cam.x));
  cam.y = Math.min(0, Math.max(minY, cam.y));

  mapEl.style.transform = `translate(${cam.x}px,${cam.y}px)`;
}

/* ================= DRAG ================= */

function startDrag(x,y){
  drag.active = true;
  drag.x = x;
  drag.y = y;
  drag.cx = cam.x;
  drag.cy = cam.y;
}

function moveDrag(x,y){
  if(!drag.active) return;
  cam.x = drag.cx + (x - drag.x);
  cam.y = drag.cy + (y - drag.y);
  applyCam();
}

function endDrag(){
  drag.active = false;
}

/* souris */
viewport.addEventListener("mousedown",e=>startDrag(e.clientX,e.clientY));
window.addEventListener("mousemove",e=>moveDrag(e.clientX,e.clientY));
window.addEventListener("mouseup",endDrag);

/* tactile */
viewport.addEventListener("touchstart",e=>{
  const t = e.touches[0];
  startDrag(t.clientX,t.clientY);
});
viewport.addEventListener("touchmove",e=>{
  const t = e.touches[0];
  moveDrag(t.clientX,t.clientY);
});
viewport.addEventListener("touchend",endDrag);
</script>

</body>
</html>
