<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Naos</title>

<style>
:root{
  --marker-size:90px;
}

html,body{
  margin:0;
  height:100%;
  overflow:hidden;
  font-family:system-ui,Segoe UI,Roboto,Arial;
}

#viewport{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:#000;
  touch-action:none;
}

#map{
  position:absolute;
  left:0;
  top:0;
  background-repeat:no-repeat;
  background-position:center;
  background-size:cover;
  will-change:transform;
}

.marker{
  position:absolute;
  width:var(--marker-size);
  height:var(--marker-size);
  margin-left:calc(var(--marker-size)/-2);
  margin-top:calc(var(--marker-size)/-2);
  object-fit:contain;
  cursor:pointer;
  z-index:10;
}
</style>
</head>

<body>

<div id="viewport">
  <div id="map"></div>
</div>

<script>
/* ================= CONFIG ================= */

const MAP = {
  bg:"Map/Metro Plan.png",
  width:1600,
  height:1600
};

const LOCATIONS = [
  { x:1316, y:757, img:"Map/20251209_0031_Bouche de Métro Nocturne_simple_compose_01kc04tdvfe89b447ny9471ewx.png", link:"Gardien.html" },
  { x:890,  y:505, img:"Map/Maison1.png", link:"Cuisine.html" },
  { x:1436, y:850, img:"Map/Maison1.png", link:"Internet.html" },
  { x:1076, y:597, img:"Map/Maison1.png", link:"Galerie.html" },
  { x:241,  y:477, img:"Map/20251209_0031_Bouche de Métro Nocturne_simple_compose_01kc04tdvfe89b447ny9471ewx.png", link:"Gardien.html" },
  { x:873,  y:247, img:"Map/Maison1.png", link:"Logiciel.html" }
];

/* ================= STATE ================= */

const viewport = document.getElementById("viewport");
const mapEl = document.getElementById("map");

let cam = { x:0, y:0 };
let drag = { active:false, x:0, y:0, cx:0, cy:0 };

/* ================= INIT ================= */

mapEl.style.width = MAP.width+"px";
mapEl.style.height = MAP.height+"px";
mapEl.style.backgroundImage = `url("${MAP.bg}")`;

/* === centrer la map à l’écran === */
cam.x = (viewport.clientWidth  - MAP.width ) / 2;
cam.y = (viewport.clientHeight - MAP.height) / 2;
applyCam();

/* ================= MARKERS ================= */

LOCATIONS.forEach(loc=>{
  const img = document.createElement("img");
  img.src = loc.img;
  img.className = "marker";
  img.style.left = loc.x+"px";
  img.style.top  = loc.y+"px";
  img.onclick = ()=>location.href = loc.link;
  mapEl.appendChild(img);
});

/* ================= CAMERA ================= */

function applyCam(){
  const minX = viewport.clientWidth  - MAP.width;
  const minY = viewport.clientHeight - MAP.height;

  cam.x = Math.min(0, Math.max(minX, cam.x));
  cam.y = Math.min(0, Math.max(minY, cam.y));

  mapEl.style.transform = `translate(${cam.x}px,${cam.y}px)`;
}

/* ================= DRAG ================= */

function startDrag(x,y){
  drag.active = true;
  drag.x = x;
  drag.y = y;
  drag.cx = cam.x;
  drag.cy = cam.y;
}

function moveDrag(x,y){
  if(!drag.active) return;
  cam.x = drag.cx + (x - drag.x);
  cam.y = drag.cy + (y - drag.y);
  applyCam();
}

function endDrag(){
  drag.active = false;
}

/* souris */
viewport.addEventListener("mousedown",e=>startDrag(e.clientX,e.clientY));
window.addEventListener("mousemove",e=>moveDrag(e.clientX,e.clientY));
window.addEventListener("mouseup",endDrag);

/* tactile */
viewport.addEventListener("touchstart",e=>{
  const t = e.touches[0];
  startDrag(t.clientX,t.clientY);
});
viewport.addEventListener("touchmove",e=>{
  const t = e.touches[0];
  moveDrag(t.clientX,t.clientY);
});
viewport.addEventListener("touchend",endDrag);
</script>

</body>
</html>
