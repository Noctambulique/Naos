<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Galerie plein écran</title>
  <style>
    body {
      margin: 0;
      background: #000;
      overflow-x: auto;
      overflow-y: hidden;
      height: 100vh;
      display: flex;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      scroll-behavior: smooth;
    }

    img {
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      flex-shrink: 0;
      scroll-snap-align: start;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <main>
    <!-- Remplace les URLs ci-dessous par tes images -->

    <img src="Histoire Philo/Diapositive2.PNG" alt="">
    <img src="Histoire Philo/Diapositive3.PNG" alt="">
  </main>
</body>
</html>
