<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rectangles Cliquables</title>

  <style>
    body{
      margin:0;
      background:#fafafa;
      font-family:sans-serif;
    }

    .rect{
      width:100%;
      height:140px; /* faible hauteur, long horizontalement */
      margin:12px 0;
      background:#eaeaea;
      overflow:hidden;
      cursor:pointer;
      transition:transform .25s ease, box-shadow .25s ease;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .rect:hover{
      transform:scale(1.02);
      box-shadow:0 6px 20px rgba(0,0,0,0.12);
    }

    .rect img{
      width:100%;
      height:100%;
      object-fit:cover;
    }
  </style>
</head>

<body>

  <a href="Logiciel/Convertisseur Excel.html">

      <img src="D hiver/Excel.png" alt="">
    </div>
