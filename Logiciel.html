<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rectangles Cliquables</title>

  <!-- Police gamer -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

  <style>
    body{
      margin:0;
      background:#fafafa;
      font-family:'Orbitron', sans-serif;
    }

    .rect{
      width:100%;
      height:140px;
      margin:12px 0;
      background:#eaeaea;
      cursor:pointer;
      transition:transform .25s ease, box-shadow .25s ease;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:32px;
      letter-spacing:2px;
      text-transform:uppercase;
      color:#111;
    }

    .rect:hover{
      transform:scale(1.02);
      box-shadow:0 6px 20px rgba(0,0,0,0.12);
    }

    a{
      text-decoration:none;
    }
  </style>
</head>

<body>

  <!-- Convertisseur Excel -->
  <a href="Logiciel/Convertisseur Excel.html">
    <div class="rect">Convertisseur Excel</div>
  </a>

  <!-- Emploi du Temps -->
