<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Plan simple</title>
<style>
  :root{
    --cols: 10;
    --gap: 4px;
    --radius: 6px;
    --zoom-speed: 350ms;
  }

  body{
    margin:0;
    background:#111;
    font-family: system-ui;
    color:#fff;
  }

  .grid{
    display:grid;
    grid-template-columns: repeat(var(--cols), 1fr);
    gap:var(--gap);
    padding:var(--gap);
  }

  .card{
    background:rgba(255,255,255,0.06);
    border-radius:var(--radius);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    overflow:hidden;
    transition:transform var(--zoom-speed), opacity var(--zoom-speed);
  }

  .card img{
    width:100%;
    height:100%;
    object-fit:cover;
    pointer-events:none;
    user-select:none;
  }

  .card.active{
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;
    margin:0;
    border-radius:0;
    z-index:20;
    transform:none !important;
  }

  .grid.zoomed .card:not(.active){
    opacity:0;
    pointer-events:none;
  }

  .close-btn{
    position:fixed;
    top:12px;
    right:12px;
    z-index:30;
    background:rgba(0,0,0,0.5);
    padding:8px 12px;
    border:none;
    border-radius:6px;
    color:#fff;
    cursor:pointer;
    font-size:14px;
    display:none;
  }
</style>
</head>
<body>

<main class="grid" id="grid">
 <section class="card"><img src="Philo/Diapositive1.PNG" alt=""></section>
    <section class="card"><img src="Philo/Diapositive2.PNG" alt=""></section>
    <section class="card"><img src="Philo/Diapositive3.PNG" alt=""></section>
    <section class="card"><img src="Philo/Diapositive4.PNG" alt=""></section>
    <section class="card"><img src="Philo/Diapositive5.PNG" alt=""></section>
    <section class="card"><img src="Philo/Diapositive6.PNG" alt=""></section>
    <section class="card"><img src="Philo/Diapositive7.PNG" alt=""></section>
    <section class="card"><img src="Philo/Diapositive8.PNG" alt=""></section>
    <section class="card"><img src="Philo/Diapositive9.PNG" alt=""></section>
    <section class="card"><img src="Philo/Diapositive10.PNG" alt=""></section>
    <section class="card"><img src="Philo/Diapositive11.PNG" alt=""></section>
    <section class="card"><img src="Philo/Diapositive12.PNG" alt=""></section>
    <section class="card"><img src="Philo/Diapositive13.PNG" alt=""></section>
    <section class="card"><img src="Philo/Diapositive14.PNG" alt=""></section>
    <section class="card"><img src="Philo/Diapositive15.PNG" alt=""></section>
    <section class="card"><img src="Philo/Diapositive16.PNG" alt=""></section>
    <section class="card"><img src="Philo/Diapositive17.PNG" alt=""></section>
    <section class="card"><img src="Philo/Diapositive18.PNG" alt=""></section>
</main>

<button id="closeBtn" class="close-btn">Fermer ✕</button>

<script>
(function(){
  const grid = document.getElementById('grid');
  const cards = [...document.querySelectorAll('.card')];
  const closeBtn = document.getElementById('closeBtn');

  let active = null;

  function open(card){
    if(active) return;
    active = card;
    card.classList.add('active');
    grid.classList.add('zoomed');
    closeBtn.style.display = 'block';
  }

  function close(){
    if(!active) return;
    active.classList.remove('active');
    grid.classList.remove('zoomed');
    active = null;
    closeBtn.style.display = 'none';
  }

  /* ---- Navigation SLIDES ---- */
  function goTo(offset){
    if(!active) return;

    let index = cards.indexOf(active);
    index = (index + offset + cards.length) % cards.length;

    active.classList.remove('active');
    active = cards[index];
    active.classList.add('active');
  }

  /* ---- Clic sur image fullscreen → fermer ---- */
  cards.forEach(c => {
    c.onclick = () => {
      if(active === c) close();
      else open(c);
    };
  });

  /* ---- Bouton fermer ---- */
  closeBtn.onclick = close;

  /* ---- Clavier ---- */
  window.addEventListener('keydown', e => {
    if(e.key === 'Escape') close();
    if(e.key === 'ArrowRight') goTo(+1);
    if(e.key === 'ArrowLeft') goTo(-1);
  });

  /* ---- Swipe mobile ---- */
  let startX = 0;
  window.addEventListener('touchstart', e => {
    startX = e.touches[0].clientX;
  });

  window.addEventListener('touchend', e => {
    if(!active) return;
    let dx = e.changedTouches[0].clientX - startX;
    if(Math.abs(dx) > 50){
      if(dx < 0) goTo(+1);
      else goTo(-1);
    }
  });

})();
</script>

</body>
</html>
