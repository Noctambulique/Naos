<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Colonnes interactives</title>
  <style>
    :root{--gap:18px;--accent:#0ea5a4;--bg:#ffffff}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;background:var(--bg);color:#042;padding:24px}
    .columns{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:var(--gap)}
    .col{background:#fff;padding:14px;border-radius:12px;box-shadow:0 4px 14px rgba(0,0,0,.06)}
    .title{font-weight:700;font-size:16px;margin-bottom:10px}
    .content{display:flex;flex-wrap:wrap;gap:8px}
    .word{padding:6px 10px;border-radius:999px;background:rgba(14,165,164,.08);cursor:pointer;user-select:none}

    .reader{position:fixed;inset:0;background:#fff;display:none;align-items:center;justify-content:center;padding:40px;z-index:9999}
    .reader.open{display:flex}
    .reader .card{max-width:900px;max-height:90vh;overflow:auto;padding:28px;font-size:18px;line-height:1.5}
    .close{position:absolute;top:16px;right:16px;font-size:24px;border:0;background:transparent;cursor:pointer;color:#000}

    @media(max-width:520px){.columns{grid-template-columns:1fr}}
  </style>
</head>
<body>

  <div class="columns" id="columns">
    <section class="col">
      <div class="title">Titre 1</div>
      <div class="content">
        <span class="word" data-full="Texte complet A">Mot A</span>
        <span class="word" data-full="Texte complet B">Mot B</span>
      </div>
    </section>

    <section class="col">
      <div class="title">Titre 2</div>
      <div class="content">
        <span class="word" data-full="Texte complet C">Mot C</span>
      </div>
    </section>
  </div>

  <div class="reader" id="reader">
    <button class="close" id="closeReader">✕</button>
    <div class="card" id="readerCard"></div>
  </div>

<script>
  const reader = document.getElementById('reader');
  const readerCard = document.getElementById('readerCard');
  const closeReader = document.getElementById('closeReader');

  function openReader(html){
    readerCard.innerHTML = html;
    reader.classList.add('open');
  }
  function closeReaderFn(){ reader.classList.remove('open'); }
  closeReader.onclick = closeReaderFn;

  document.querySelectorAll('.word').forEach(w=>{
    w.onclick = ()=>{
      const full = w.dataset.full || w.textContent;
      openReader(full);
    };
  });

  document.addEventListener('keydown',e=>{
    if(e.key==='Escape') closeReaderFn();
  });
</script>

</body>
</html>
