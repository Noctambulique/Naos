<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Colonnes minimalistes</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial}
    body{padding:24px;color:#111;background:#fff}

    .columns{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
    .col{padding:8px}
    .title{font-weight:600;font-size:18px;margin-bottom:12px}
    .line{margin-bottom:8px;cursor:pointer;display:block}

    /* Vue du texte complet */
    .reader{position:fixed;inset:0;background:#fff;display:none;align-items:center;justify-content:center;padding:40px;z-index:9999}
    .reader.open{display:flex}
    .reader .card{max-width:900px;max-height:90vh;overflow:auto;font-size:20px;line-height:1.5}
    .close{position:absolute;top:16px;right:16px;font-size:28px;border:0;background:transparent;cursor:pointer}

    @media(max-width:700px){.columns{grid-template-columns:1fr}}
  </style>
</head>
<body>

  <div class="columns">
    
    <section class="col">
      <div class="title">Colonne 2</div>
      <span class="line" data-full="Texte explicatif 1.">ça va ?</span>
      <span class="line" data-full="Texte explicatif 2.">Tu fais quoi ?</span>
      <span class="line" data-full="Texte explicatif 3.">Tu étudies quoi ?</span>
    </section>

    <section class="col">
      <div class="title">Colonne 3</div>
      <span class="line" data-full="Information liée à l’élément X.">C'est quoi ton livre préféré ?</span>
      <span class="line" data-full="Etudier la solidité des connaissances, le bien et le mal, les questions existentielles.">C'est quoi la philosophie ?</span>
    </section>

  </div>

  <div class="reader" id="reader">
    <button class="close" id="closeReader">✕</button>
    <div class="card" id="readerCard"></div>
  </div>

<script>
  const reader = document.getElementById('reader');
  const readerCard = document.getElementById('readerCard');
  const closeReader = document.getElementById('closeReader');

  function openReader(html){ readerCard.innerHTML = html; reader.classList.add('open'); }
  function closeReaderFn(){ reader.classList.remove('open'); }
  closeReader.onclick = closeReaderFn;

  document.querySelectorAll('.line').forEach(el=>{
    el.onclick = ()=>{
      const full = el.dataset.full || el.textContent;
      openReader(full);
    };
  });

  document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeReaderFn(); });
</script>

</body>
</html>
